name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  # Release Autopilot opens its PRs with GITHUB_TOKEN, which starts no
  # pull_request workflows, so it dispatches this on the release branch.
  # Its checks land on the branch's head commit, but GitHub does not count
  # dispatched checks toward a ruleset's required checks.
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Unique tag the caller uses to find this run
        required: false
        type: string

# A PR run keeps its default name (the PR title). A dispatched run carries the
# caller's tag, so the caller can find the exact run it started.
run-name: ${{ inputs.dispatch_id && format('PR Checks [{0}]', inputs.dispatch_id) || github.event.pull_request.title }}

concurrency:
  group: pr-checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: CLI & Agent Packages (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor each package declares in `engines`, and the version most
        # contributors run. Testing only the latter lets the floor rot.
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # Lint runs last, per AGENTS.md: Biome autofixes formatting, so putting it
      # ahead of the correctness gates just reports style on code that may not
      # compile.
      - name: CLI — install, typecheck, test, build, lint
        working-directory: cli
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
          npm run lint

      - name: Agent — install, typecheck, test, build
        working-directory: agent
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

  ci-executor:
    # The first-party CI executor is its own Worker with its own dependencies
    # (docs/adr/012). Its suite drives real `git` and `bash` against a fixture
    # repository, which the runner image has. It does NOT build the container
    # image or start a container: that needs Docker and Cloudflare, and is
    # listed under "What is not tested here" in ci-executor/README.md.
    name: CI Executor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install, typecheck, test, lint
        working-directory: ci-executor
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run lint


  # ========================================================================
  # Code Quality Checks
  # ========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tests/wrangler-migration-chain.test.ts reads wrangler.toml at
          # origin/main to prove this PR only appends Durable Object
          # migrations. The default shallow fetch has no origin/main, and the
          # guard fails rather than skips in CI, so fetch the full history.
          fetch-depth: 0
          # The guard only reads local objects (git show, git rev-parse) and
          # nothing else here talks to a remote, so the job needs no token in
          # .git/config — and this job uploads an artifact.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/

  # ========================================================================
  # Engines Floor
  # ========================================================================
  engines-floor:
    # `engines` in package.json claims >=22.13.0, but every job above runs the
    # floating "22", which resolves to the newest 22.x. That gap hid #340: the
    # `node:sqlite` shim behind the D1 test harness could not bind numbered
    # parameters on 22.14.0, so a contributor on an older 22.x saw 43 red tests
    # on a clean checkout while CI stayed green. Running the suite at the exact
    # declared floor is what keeps that claim honest — this job going red means
    # either the code stopped supporting the floor or the floor should move.
    name: Unit Tests (engines floor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same reason as the Unit Tests job: the wrangler migration-chain
          # guard reads wrangler.toml at origin/main and fails rather than skips.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The exact floor `engines` declares, not a range. Bump both together.
          node-version: "22.13.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # No coverage here: the Unit Tests job owns the thresholds and the
      # artifact. This job answers one question — does the suite pass at the
      # oldest Node we claim to support.
      - name: Run tests
        run: npm test

  # ========================================================================
  # Integration Tests
  # ========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration -- --run
        env:
          CI: true

  # ========================================================================
  # No staging deployment here — on purpose.
  # ========================================================================
  # PRs used to run `wrangler deploy --env=staging`, which published the PR
  # branch over the single shared stratum-staging Worker. Cloudflare records
  # the last-applied Durable Object migration tag on the script itself, so a
  # PR that added a migration left staging one tag ahead of main. Wrangler
  # cannot find that tag in main's wrangler.toml, assumes it was deleted, and
  # replays the whole chain from v1 — which fails on the already-populated
  # MergeQueue class (API error 10074) and red-lines every subsequent push to
  # main, and with it the production deploy that gates on staging.
  #
  # Per-PR environments live in pr-preview.yml: an isolated stratum-pr-<N>
  # Worker with its own D1, KV and evaluation queue, torn down when the PR closes. The shared
  # staging Worker is deployed from main only (ci.yml), which keeps its
  # migration tag a function of main's wrangler.toml alone.

  # ========================================================================
  # PR Status Summary
  # ========================================================================
  pr-status:
    name: PR Status Summary
    needs: [lint, typecheck, test, engines-floor, integration-tests]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      pull-requests: write
      checks: write
    steps:
      - name: Update PR status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # Ride out transient GitHub API 5xx (503 brownouts have failed
          # otherwise-green runs on nothing but the status comment). A retried
          # POST can rarely duplicate a status comment — accepted trade-off vs.
          # red runs. Every non-transient 4xx is exempt; 429 stays retryable.
          retries: 3
          retry-exempt-status-codes: 400,401,402,403,404,405,406,407,409,410,411,412,413,414,415,416,417,418,421,422,423,424,426,428,431,451
          script: |
            const jobs = {
              lint: '${{ needs.lint.result }}',
              typecheck: '${{ needs.typecheck.result }}',
              test: '${{ needs.test.result }}',
              enginesFloor: '${{ needs.engines-floor.result }}',
              integration: '${{ needs.integration-tests.result }}'
            };

            const allPassed = Object.values(jobs).every(r => r === 'success');
            const status = allPassed ? '✅ All checks passed' : '❌ Some checks failed';
            const summary = `Lint: ${jobs.lint}, Type Check: ${jobs.typecheck}, Tests: ${jobs.test}, Engines floor: ${jobs.enginesFloor}, Integration: ${jobs.integration}`;

            // A fork PR's token is read-only whatever `permissions` asks for,
            // so creating the check run would 403 and turn a green run red.
            // Report through this job's own result instead.
            // A dispatch has no PR: it runs on a branch in this repository.
            const pr = context.payload.pull_request;
            const head = pr ? pr.head.repo : context.payload.repository;
            if (!head || head.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.info(`Fork PR: skipping the PR Requirements check run. ${summary}`);
              if (!allPassed) core.setFailed(`${status}: ${summary}`);
              return;
            }

            // Create check run for merge requirements
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'PR Requirements',
              head_sha: pr ? pr.head.sha : context.sha,
              status: 'completed',
              conclusion: allPassed ? 'success' : 'failure',
              output: {
                title: status,
                summary
              }
            });

  # ========================================================================
  # Security Scan
  # ========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run secret scanner tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run secret detection tests
        run: npm test -- tests/secret-scanner.test.ts --run

      - name: Check for leaked secrets in diff
        run: |
          # Check if any secrets might have been added
          if git diff origin/main..HEAD | grep -iE "(api[_-]?key|secret|token|password)" | grep -v "test\|mock\|example"; then
            echo "⚠️ Potential secrets detected in diff. Please review."
            exit 1
          fi
        continue-on-error: true
