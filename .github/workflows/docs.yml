name: Docs Site

on:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      # The site's header is generated from the app's stylesheet, so a change
      # there has to rebuild (and re-check) the docs site too.
      - "src/ui/nav-css.ts"
      - "src/ui/styles.ts"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "src/ui/nav-css.ts"
      - "src/ui/styles.ts"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Deploy Docs Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: website
        run: npm ci

      # The published guide and reference pages are generated from docs/ by
      # scripts/mirror-docs.mjs. Nothing regenerates them at build time, so a
      # change to docs/ that was not mirrored would otherwise deploy silently
      # stale pages.
      - name: Check the docs mirrors are current
        working-directory: website
        run: npm run check:guides

      # Same for the header: it is generated from the app's own stylesheet
      # (src/ui/nav-css.ts) so both origins render one header, and nothing
      # regenerates it at build time.
      - name: Check the header mirror is current
        working-directory: website
        run: npm run check:header

      - name: Build
        working-directory: website
        # Absent on forks and in PR builds, which is the intent: the build must
        # succeed without it and simply ship no analytics.
        env:
          POSTHOG_PUBLIC_KEY: ${{ vars.POSTHOG_PUBLIC_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The Worker needs the same value the build used: the build bakes it
          # into the HTML, this tells the proxy the deployment has analytics on.
          # Absent, the proxy answers 204 and relays nothing.
          POSTHOG_PUBLIC_KEY: ${{ vars.POSTHOG_PUBLIC_KEY }}
        run: npx wrangler deploy --var POSTHOG_PUBLIC_KEY:"$POSTHOG_PUBLIC_KEY"
