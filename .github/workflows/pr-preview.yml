name: PR Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ github.event.number }}
  PREVIEW_SUBDOMAIN: pr-${{ github.event.number }}
  DB_NAME: stratum-pr-${{ github.event.number }}
  WORKER_NAME: stratum-pr-${{ github.event.number }}
  # Per-PR, like the database: queue names are account-level, and a shared
  # queue would hand one preview's evaluation runs to another preview's
  # consumer, whose D1 has no such change (#412).
  EVAL_QUEUE_NAME: stratum-evaluations-pr-${{ github.event.number }}

jobs:
  # =======================================================================
  # Cleanup on PR Close
  # =======================================================================
  cleanup:
    name: Cleanup Preview Environment
    runs-on: ubuntu-latest
    # Fork PRs never get a preview (see deploy job), so there is nothing to clean up.
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Delete D1 Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deleting D1 database: ${{ env.DB_NAME }}"
          # Get database ID
          DB_ID=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            | jq -r ".result[] | select(.name == \"${{ env.DB_NAME }}\") | .uuid")
          
          if [ -n "$DB_ID" ] && [ "$DB_ID" != "null" ]; then
            echo "Found database ID: $DB_ID"
            DELETE_RESPONSE=$(curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json")
            
            DELETE_SUCCESS=$(echo "$DELETE_RESPONSE" | jq -r '.success // false')
            if [ "$DELETE_SUCCESS" = "true" ]; then
              echo "✓ Database deleted"
            else
              echo "❌ Failed to delete database"
              echo "Response: $DELETE_RESPONSE"
              exit 1
            fi
          else
            echo "Database not found, may have been already deleted"
          fi

      - name: Delete Worker Script
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deleting Worker: ${{ env.WORKER_NAME }}"
          DELETE_RESPONSE=$(curl -s -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/${{ env.WORKER_NAME }}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")
          DELETE_SUCCESS=$(echo "$DELETE_RESPONSE" | jq -r '.success // false')
          if [ "$DELETE_SUCCESS" = "true" ]; then
            echo "✓ Worker deleted"
          else
            ERROR_CODE=$(echo "$DELETE_RESPONSE" | jq -r '.errors[0].code // 0')
            if [ "$ERROR_CODE" = "10007" ]; then
              echo "Worker not found, may have been already deleted"
            else
              echo "❌ Failed to delete Worker"
              echo "Response: $DELETE_RESPONSE"
              exit 1
            fi
          fi

      # After the Worker: a queue with a live consumer cannot be deleted, and
      # deleting the Worker removes its consumer.
      - name: Delete Evaluation Queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deleting queue: ${{ env.EVAL_QUEUE_NAME }}"
          LIST=$(curl -sf -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues?name=${{ env.EVAL_QUEUE_NAME }}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}") || { echo "❌ Could not list queues"; exit 1; }
          QUEUE_ID=$(echo "$LIST" | jq -r --arg n "${{ env.EVAL_QUEUE_NAME }}" '[.result[]? | select(.queue_name == $n) | .queue_id] | first // empty')
          if [ -z "$QUEUE_ID" ]; then
            echo "Queue not found, may have been already deleted"
            exit 0
          fi
          DELETE_RESPONSE=$(curl -s -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if [ "$(echo "$DELETE_RESPONSE" | jq -r '.success // false')" = "true" ]; then
            echo "✓ Queue deleted"
          else
            echo "❌ Failed to delete queue"
            echo "Response: $DELETE_RESPONSE"
            exit 1
          fi

      - name: Delete KV Namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          KV_NAME="stratum-preview-state-pr-${{ env.PR_NUMBER }}"
          echo "Deleting KV namespace: $KV_NAME"
          # The list endpoint pages (20 per page by default); reading only the
          # first page misses this PR's namespace once the account has more.
          # Stops on a short page (the documented contract), fails on any
          # response that is not a successful JSON listing, and caps the walk.
          find_kv() {
            local page=1 per_page=100 resp id count
            while [ "$page" -le 50 ]; do
              resp=$(curl -sf -X GET \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=${per_page}&page=${page}" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}") || return 1
              echo "$resp" | jq -e '.success == true and (.result | type == "array")' >/dev/null 2>&1 || return 1
              id=$(echo "$resp" | jq -r --arg t "$1" '[.result[] | select(.title == $t) | .id] | first // empty')
              if [ -n "$id" ]; then echo "$id"; return 0; fi
              count=$(echo "$resp" | jq -r '.result | length')
              [ "$count" -lt "$per_page" ] && return 0
              page=$((page + 1))
            done
            return 1
          }
          KV_ID=$(find_kv "$KV_NAME") || { echo "❌ Could not list KV namespaces"; exit 1; }
          if [ -n "$KV_ID" ] && [ "$KV_ID" != "null" ]; then
            DELETE_RESPONSE=$(curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${KV_ID}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json")
            DELETE_SUCCESS=$(echo "$DELETE_RESPONSE" | jq -r '.success // false')
            if [ "$DELETE_SUCCESS" = "true" ]; then
              echo "✓ KV namespace deleted"
            else
              echo "❌ Failed to delete KV namespace"
              echo "Response: $DELETE_RESPONSE"
              exit 1
            fi
          else
            echo "KV namespace not found, may have been already deleted"
          fi

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # Ride out transient GitHub API 5xx (503 brownouts have failed
          # otherwise-green runs on nothing but the status comment). A retried
          # POST can rarely duplicate a status comment — accepted trade-off vs.
          # red runs. Every non-transient 4xx is exempt; 429 stays retryable.
          retries: 3
          retry-exempt-status-codes: 400,401,402,403,404,405,406,407,409,410,411,412,413,414,415,416,417,418,421,422,423,424,426,428,431,451
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🗑️ Preview Environment Deleted

            The preview environment for this PR has been cleaned up:
            - ~~https://${{ env.PREVIEW_SUBDOMAIN }}.staging.app.usestratum.dev~~

            All resources (Worker, D1 database, KV namespace) have been destroyed.`
            });

  # =======================================================================
  # Deploy Preview Environment
  # =======================================================================
  deploy:
    name: Deploy Preview Environment
    runs-on: ubuntu-latest
    # Fork PRs are excluded: pull_request withholds secrets from forks, so the
    # deploy can only fail there — and unreviewed fork code shouldn't get a live
    # preview environment anyway. Never convert this workflow to pull_request_target.
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
      db_id: ${{ steps.db.outputs.db_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create D1 Database
        id: db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Creating D1 database: ${{ env.DB_NAME }}"
          
          # Check if database already exists (handle null/empty results)
          DB_LIST=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")
          
          echo "Database list response: $DB_LIST"
          
          EXISTING_DB=$(echo "$DB_LIST" | jq -r "[.result[]? // empty | select(.name == \"${{ env.DB_NAME }}\") | .uuid] | first // empty")
          
          if [ -n "$EXISTING_DB" ] && [ "$EXISTING_DB" != "null" ]; then
            echo "Database already exists: $EXISTING_DB"
            echo "db_id=$EXISTING_DB" >> $GITHUB_OUTPUT
          else
            echo "Creating new database..."
            # Create new database
            DB_RESPONSE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"${{ env.DB_NAME }}\"}")
            
            echo "Create response: $DB_RESPONSE"
            
            DB_ID=$(echo "$DB_RESPONSE" | jq -r '.result.uuid // empty')
            
            if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
              echo "Error: Failed to create database"
              echo "Response: $DB_RESPONSE"
              exit 1
            fi
            
            echo "Created database: $DB_ID"
            echo "db_id=$DB_ID" >> $GITHUB_OUTPUT
          fi

      - name: Apply D1 Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_ID: ${{ steps.db.outputs.db_id }}
        run: |
          echo "Applying migrations to database: $DB_ID"
          
          # Create temporary wrangler.toml for migrations
          cat > wrangler.migrate.toml << EOF
          name = "temp-migrate-${{ env.PR_NUMBER }}"
          [[d1_databases]]
          binding = "DB"
          database_name = "${{ env.DB_NAME }}"
          database_id = "${DB_ID}"
          migrations_dir = "migrations"
          EOF
          
          # Apply migrations using wrangler (CI mode auto-confirms)
          # For preview envs, we continue even if some migrations fail (e.g., already applied)
          if npx wrangler d1 migrations apply ${{ env.DB_NAME }} --config wrangler.migrate.toml --remote; then
            echo "✓ All migrations applied successfully"
          else
            MIGRATE_EXIT=$?
            echo "⚠️ Some migrations failed (exit code: $MIGRATE_EXIT)"
            echo "This can happen if the database was partially migrated in a previous run."
            echo "Continuing with deployment..."
          fi

      - name: Create or Get KV Namespace
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          KV_NAME="stratum-preview-state-pr-${{ env.PR_NUMBER }}"
          
          # The list endpoint pages (20 per page by default); reading only the
          # first page misses this PR's namespace once the account has more.
          # Stops on a short page (the documented contract), fails on any
          # response that is not a successful JSON listing, and caps the walk.
          find_kv() {
            local page=1 per_page=100 resp id count
            while [ "$page" -le 50 ]; do
              resp=$(curl -sf -X GET \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=${per_page}&page=${page}" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}") || return 1
              echo "$resp" | jq -e '.success == true and (.result | type == "array")' >/dev/null 2>&1 || return 1
              id=$(echo "$resp" | jq -r --arg t "$1" '[.result[] | select(.title == $t) | .id] | first // empty')
              if [ -n "$id" ]; then echo "$id"; return 0; fi
              count=$(echo "$resp" | jq -r '.result | length')
              [ "$count" -lt "$per_page" ] && return 0
              page=$((page + 1))
            done
            return 1
          }
          KV_ID=$(find_kv "$KV_NAME") || { echo "❌ Could not list KV namespaces"; exit 1; }
          
          if [ -n "$KV_ID" ] && [ "$KV_ID" != "null" ]; then
            echo "Found existing KV namespace: $KV_ID"
            echo "kv_id=$KV_ID" >> $GITHUB_OUTPUT
          else
            echo "Creating new KV namespace: $KV_NAME"
            KV_RESPONSE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"title\":\"$KV_NAME\"}")
            
            KV_ID=$(echo "$KV_RESPONSE" | jq -r '.result.id // empty')
            
            if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
              # Fail rather than deploy without STATE: every page that reads
              # projects would 500, and the preview would still report "ready".
              echo "❌ Failed to create KV namespace"
              echo "Response: $KV_RESPONSE"
              exit 1
            else
              echo "Created KV namespace: $KV_ID"
              echo "kv_id=$KV_ID" >> $GITHUB_OUTPUT
            fi
          fi

      # `wrangler deploy` fails outright on a bound queue that does not exist.
      # Idempotent, matching ci.yml's queue step.
      - name: Ensure Evaluation Queue Exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          queue="${{ env.EVAL_QUEUE_NAME }}"
          if out=$(npx wrangler queues create "$queue" 2>&1); then
            echo "✓ Created queue $queue"
          elif echo "$out" | grep -qiE "already (exists|taken)|11009"; then
            echo "✓ Queue $queue already exists"
          else
            echo "$out"
            exit 1
          fi

      - name: Generate Wrangler Config
        env:
          DB_ID: ${{ steps.db.outputs.db_id }}
          KV_ID: ${{ steps.kv.outputs.kv_id }}
        run: |
          cat > wrangler.preview.toml << EOF
          name = "${{ env.WORKER_NAME }}"
          main = "src/index.ts"
          compatibility_date = "2026-04-29"
          compatibility_flags = ["nodejs_compat"]

          # Keep workers.dev URL enabled
          workers_dev = true

          [observability]
          enabled = true
          head_sampling_rate = 1.0

          [[d1_databases]]
          binding = "DB"
          database_name = "${{ env.DB_NAME }}"
          database_id = "${DB_ID}"
          migrations_dir = "migrations"
          EOF
          
          # Only add KV if we have an ID
          if [ -n "$KV_ID" ]; then
            cat >> wrangler.preview.toml << EOF

          [[kv_namespaces]]
          binding = "STATE"
          id = "${KV_ID}"
          EOF
          fi
          
          cat >> wrangler.preview.toml << EOF

          [[ratelimits]]
          name = "RATE_LIMIT_ANON"  # signed-out requests
          namespace_id = "3021"
          simple = { limit = 60, period = 60 }

          [[ratelimits]]
          name = "RATE_LIMIT_AUTH"  # signed-in users and agents
          namespace_id = "3022"
          simple = { limit = 1000, period = 60 }

          [[ratelimits]]
          name = "RATE_LIMIT_ANALYTICS"  # analytics ingest
          namespace_id = "3023"
          simple = { limit = 600, period = 60 }

          [[ratelimits]]
          name = "RATE_LIMIT_STRICT"  # routes that pass requestsPerMinute: 20 (POST /projects)
          namespace_id = "3024"
          simple = { limit = 20, period = 60 }

          [[artifacts]]
          binding = "ARTIFACTS"
          namespace = "stratum-staging"

          [ai]
          binding = "AI"

          [[send_email]]
          name = "EMAIL"

          # Evaluation runs (#412); knobs mirror the stratum-evaluations
          # consumer in wrangler.toml. No DLQ: the preview is disposable.
          [[queues.producers]]
          binding = "EVALUATION_QUEUE"
          queue = "${{ env.EVAL_QUEUE_NAME }}"

          [[queues.consumers]]
          queue = "${{ env.EVAL_QUEUE_NAME }}"
          max_batch_size = 1
          max_retries = 2
          retry_delay = 30

          # Add custom domain - wrangler will create this automatically on deploy
          # Note: zone_name must be the actual Cloudflare zone (usestratum.dev), not the subdomain
          [[routes]]
          pattern = "${{ env.PREVIEW_SUBDOMAIN }}.staging.app.usestratum.dev"
          custom_domain = true
          zone_name = "usestratum.dev"

          [vars]
          POSTHOG_HOST = "https://app.posthog.com"
          OAUTH_REDIRECT_URI = "https://${{ env.PREVIEW_SUBDOMAIN }}.staging.app.usestratum.dev/auth/github/callback"
          EMAIL_FROM_ADDRESS = "noreply@usestratum.dev"
          PREVIEW_ENV = "pr-${{ env.PR_NUMBER }}"
          # Previews carry no analytics key, so nothing is sent today. Labelled
          # anyway so contributor traffic can never be counted as production if
          # one is ever added here.
          STRATUM_ENVIRONMENT = "preview"
          EOF
          
          echo "✓ Generated wrangler.preview.toml"
          cat wrangler.preview.toml

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying Worker: ${{ env.WORKER_NAME }}"
          DEPLOY_OUTPUT=$(npx wrangler deploy --config wrangler.preview.toml 2>&1)
          echo "$DEPLOY_OUTPUT"

          WORKERS_DEV_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-zA-Z0-9-]+\.[a-zA-Z0-9-]+\.workers\.dev' | head -1)
          if [ -z "$WORKERS_DEV_URL" ]; then
            echo "Warning: could not parse workers.dev URL from deploy output"
          fi
          echo "workers_dev_url=$WORKERS_DEV_URL" >> $GITHUB_OUTPUT

          PREVIEW_URL="https://${{ env.PREVIEW_SUBDOMAIN }}.staging.app.usestratum.dev"
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $PREVIEW_URL"

      - name: Wait for SSL
        run: |
          echo "⏳ Waiting for SSL certificate provisioning..."
          echo "Custom domain: https://${{ env.PREVIEW_SUBDOMAIN }}.staging.app.usestratum.dev"
          echo ""
          echo "Note: SSL certificate provisioning typically takes 30-60 seconds."

      - name: Smoke Tests
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          WORKERS_DEV_URL: ${{ steps.deploy.outputs.workers_dev_url }}
        run: |
          echo "Running smoke tests..."
          echo "Preview URL: $PREVIEW_URL"

          # First test the workers.dev URL to ensure Worker is working
          echo "Testing workers.dev URL first: $WORKERS_DEV_URL"
          if [ -n "$WORKERS_DEV_URL" ] && curl -sfS --max-time 10 "$WORKERS_DEV_URL/health"; then
            echo "✓ Worker is responding on workers.dev"
          else
            echo "⚠️ Worker not responding on workers.dev (may still be deploying)"
          fi

          # Wait longer for custom domain SSL to provision
          echo "Waiting 60 seconds for custom domain SSL certificate to provision..."
          sleep 60

          # Test custom domain with retries
          echo "Testing custom domain: $PREVIEW_URL"
          if curl -sfS --retry 5 --retry-delay 15 --max-time 30 "$PREVIEW_URL/health"; then
            echo "✓ Smoke tests passed"
          else
            echo "⚠️ Custom domain not responding yet (SSL may still be provisioning)"
            echo "The deployment succeeded, but the custom domain needs a few more minutes."
            if [ -n "$WORKERS_DEV_URL" ]; then
              echo "You can check the workers.dev URL in the meantime: $WORKERS_DEV_URL"
            fi
            # Don't fail the workflow - the deployment is successful
          fi

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # Ride out transient GitHub API 5xx (503 brownouts have failed
          # otherwise-green runs on nothing but the status comment). A retried
          # POST can rarely duplicate a status comment — accepted trade-off vs.
          # red runs. Every non-transient 4xx is exempt; 429 stays retryable.
          retries: 3
          retry-exempt-status-codes: 400,401,402,403,404,405,406,407,409,410,411,412,413,414,415,416,417,418,421,422,423,424,426,428,431,451
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview_url }}';
            const dbId = '${{ steps.db.outputs.db_id }}';
            
            const body = `## 🚀 Preview Environment Ready

            **URL:** ${previewUrl}

            ### Details
            - **PR Number:** #${{ env.PR_NUMBER }}
            - **Database:** ${{ env.DB_NAME }} (ID: \`${dbId}\`)
            - **Worker:** ${{ env.WORKER_NAME }}

            ### Quick Links
            - [Health Check](${previewUrl}/health)
            - [Sign Up](${previewUrl}/auth/signup)
            - [Sign In](${previewUrl}/auth/email)

            ### Testing
            This environment is isolated with its own database. Test freely!

            > 💡 **Note:** This environment will be automatically deleted when the PR is closed or merged.`;

            // Find existing comment (paginate to get all comments)
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview Environment Ready')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
