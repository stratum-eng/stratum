name: CI - Main Branch

on:
  push:
    branches: [main]

# Note: PR checks are now handled in .github/workflows/pr-checks.yml

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/

  packages:
    name: CLI & Agent Packages (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor each package declares in `engines`, and the version most
        # contributors run. Testing only the latter lets the floor rot.
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      # Lint runs last, per AGENTS.md: Biome autofixes formatting, so putting it
      # ahead of the correctness gates just reports style on code that may not
      # compile.
      - name: CLI — install, typecheck, test, build, lint
        working-directory: cli
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
          npm run lint

      - name: Agent — install, typecheck, test, build
        working-directory: agent
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build


  # ========================================================================
  # Staging Deployment with Automatic Migration
  # ========================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest
    # Repo guard: forks pushing to their own main lack the secrets and
    # environments, so deploys there can only fail. Tests above still run
    # in forks, where they are actually useful.
    if: >
      github.repository == 'stratum-eng/stratum' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    permissions:
      issues: write
      contents: read
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 Migrations (Staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Applying D1 migrations for staging..."
          npx wrangler d1 migrations apply stratum-staging --remote --env=staging
          echo "✓ Migrations applied successfully"

      # A deploy fails outright on a bound queue that does not exist. The names
      # come from wrangler.toml rather than a copy kept here, so binding a new
      # queue cannot leave a deploy path un-provisioned.
      - name: Ensure Staging Queues Exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/wrangler-queues.mjs staging > /tmp/queues-staging.txt
          # Redirect, not a pipe: a `while ... | read` loop runs in a subshell,
          # where `exit 1` would end the subshell and let the step pass.
          while read -r queue; do
            [ -z "$queue" ] && continue
            if out=$(npx wrangler queues create "$queue" 2>&1); then
              echo "✓ Created queue $queue"
            elif echo "$out" | grep -qiE "already (exists|taken)|11009"; then
              echo "✓ Queue $queue already exists"
            else
              echo "$out"
              exit 1
            fi
          done < /tmp/queues-staging.txt

      - name: Deploy to Cloudflare Staging
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POSTHOG_PUBLIC_KEY: ${{ vars.POSTHOG_PUBLIC_KEY }}
        run: |
          # The app's half of browser analytics. `POSTHOG_PUBLIC_KEY` is a
          # `[vars]` entry that ships commented out, because a self-hoster who
          # deployed this repo must not inherit our project token — so the
          # value can only come from here, and until it did, the Worker served
          # every page without the SDK while the docs site (deploy-docs.yml,
          # which has passed it since day one) reported browser events. Empty
          # when the repository variable is unset, which `webAnalyticsConfig`
          # reads as off.
          npx wrangler deploy --env=staging --var POSTHOG_PUBLIC_KEY:"$POSTHOG_PUBLIC_KEY"
          SUBDOMAIN=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain')
          URL="https://stratum-staging.$SUBDOMAIN.workers.dev"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"

      - name: Smoke test - Health endpoint
        env:
          STAGING_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -e
          echo "→ Testing health endpoint: $STAGING_URL/api/health"
          curl -sfS --retry 5 --retry-delay 5 "$STAGING_URL/api/health"
          echo "✓ Health check passed"

  # ========================================================================
  # Production Deployment with Manual Approval
  # ========================================================================
  deploy-production:
    name: Deploy to Production
    needs: [test, deploy-staging]
    runs-on: ubuntu-latest
    # Repo guard: see deploy-staging.
    if: >
      github.repository == 'stratum-eng/stratum' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    permissions:
      issues: write
      contents: read
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 Migrations (Production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Applying D1 migrations for production..."
          npx wrangler d1 migrations apply stratum --remote --env=production
          echo "✓ Migrations applied successfully"

      # Production had no such step until deploys added two new queues: its
      # original queues predated CI, so nothing ever created one here and the
      # gap stayed invisible until a bound queue was missing and the deploy
      # failed. Names come from wrangler.toml so the two cannot drift.
      - name: Ensure Production Queues Exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/wrangler-queues.mjs production > /tmp/queues-production.txt
          # Redirect, not a pipe: a `while ... | read` loop runs in a subshell,
          # where `exit 1` would end the subshell and let the step pass.
          while read -r queue; do
            [ -z "$queue" ] && continue
            if out=$(npx wrangler queues create "$queue" 2>&1); then
              echo "✓ Created queue $queue"
            elif echo "$out" | grep -qiE "already (exists|taken)|11009"; then
              echo "✓ Queue $queue already exists"
            else
              echo "$out"
              exit 1
            fi
          done < /tmp/queues-production.txt

      - name: Deploy to Cloudflare Production
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POSTHOG_PUBLIC_KEY: ${{ vars.POSTHOG_PUBLIC_KEY }}
        run: |
          # The app's half of browser analytics. `POSTHOG_PUBLIC_KEY` is a
          # `[vars]` entry that ships commented out, because a self-hoster who
          # deployed this repo must not inherit our project token — so the
          # value can only come from here, and until it did, the Worker served
          # every page without the SDK while the docs site (deploy-docs.yml,
          # which has passed it since day one) reported browser events. Empty
          # when the repository variable is unset, which `webAnalyticsConfig`
          # reads as off.
          npx wrangler deploy --env=production --var POSTHOG_PUBLIC_KEY:"$POSTHOG_PUBLIC_KEY"
          SUBDOMAIN=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain')
          URL="https://stratum.$SUBDOMAIN.workers.dev"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"

      - name: Smoke test - Health endpoint
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -e
          echo "→ Testing health endpoint: $PRODUCTION_URL/api/health"
          curl -sfS --retry 5 --retry-delay 5 "$PRODUCTION_URL/api/health"
          echo "✓ Health check passed"

      - name: Smoke test - Critical paths
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -e
          echo "→ Running critical path smoke tests"
          npx vitest run tests/smoke/ --reporter=verbose || true
          echo "✓ Smoke tests completed"

      - name: Record deployment summary
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const deploymentUrl = '${{ steps.deploy.outputs.url }}';
            const commitSha = context.sha.substring(0, 7);
            const commitMessage = context.payload.head_commit?.message || 'No message';

            await core.summary
              .addHeading('✅ Production Deployment Complete')
              .addRaw(`**Commit:** ${commitSha}\n\n`)
              .addRaw(`**Message:** ${commitMessage}\n\n`)
              .addRaw(`**URL:** ${deploymentUrl}\n`)
              .addList([
                'D1 migrations applied',
                'Build successful',
                'Health checks passed',
                'Smoke tests completed',
                'Deployment verified',
              ])
              .write();

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          # Ride out transient GitHub API 5xx (503 brownouts have failed
          # otherwise-green runs on nothing but the status comment). A retried
          # POST can rarely duplicate a status comment — accepted trade-off vs.
          # red runs. Every non-transient 4xx is exempt; 429 stays retryable.
          retries: 3
          retry-exempt-status-codes: 400,401,402,403,404,405,406,407,409,410,411,412,413,414,415,416,417,418,421,422,423,424,426,428,431,451
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🚨 Production deploy failed",
              body: `The production deployment workflow failed on \`${context.ref}\`.\n\n[View Workflow Run](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
              labels: ['deployment', 'production', 'failure']
            });
