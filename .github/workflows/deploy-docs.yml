name: Deploy Docs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Docs Site
    # Guard against dispatching a deploy from a non-main branch, and share the
    # concurrency group with the docs.yml main-push deploy so the two can't race.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-refs/heads/main
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build
        working-directory: website
        env:
          POSTHOG_PUBLIC_KEY: ${{ vars.POSTHOG_PUBLIC_KEY }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The Worker needs the same value the build used: the build bakes it
          # into the HTML, this tells the proxy the deployment has analytics on.
          # Absent, the proxy answers 204 and relays nothing.
          POSTHOG_PUBLIC_KEY: ${{ vars.POSTHOG_PUBLIC_KEY }}
        run: npx wrangler deploy --var POSTHOG_PUBLIC_KEY:"$POSTHOG_PUBLIC_KEY"
