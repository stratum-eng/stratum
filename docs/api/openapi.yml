        schema: { type: string }
    delete:
      operationId: deleteWorkspace
      tags: [workspaces]
      summary: Delete a workspace
      description: Requires project write access AND workspace write access (creator or admin). Also deletes the backing Artifacts fork.
      parameters:
        - name: projectId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  workspace: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/orgs:
    post:
      operationId: createOrg
      tags: [orgs]
      summary: Create an organization
      description: The creator becomes an org admin. The slug must not collide with an existing username.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string, description: 1-64 char alphanumeric slug }
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                type: object
                properties:
                  org: { $ref: "#/components/schemas/Org" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listOrgs
      tags: [orgs]
      summary: List organizations the caller belongs to
      description: |
        Omits each organization's `ipAllowlist`, since this path is not
        restricted to the organization's networks. Read it from
        `GET /api/orgs/{slug}/security`.
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                type: object
                properties:
                  orgs:
                    type: array
                    items: { $ref: "#/components/schemas/OrgSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/orgs/{slug}:
    parameters:
      - $ref: "#/components/parameters/OrgSlug"
    get:
      operationId: getOrg
      tags: [orgs]
      summary: Get an organization (members only)
      description: Non-members receive the same 404 as a missing org.
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  org: { $ref: "#/components/schemas/Org" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/orgs/{slug}/members:
    parameters:
