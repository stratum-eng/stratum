        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/issues/{number}/close:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
      - name: number
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: toggleIssueClosed
      tags: [issues]
      summary: Toggle an issue open/closed (form-friendly)
      description: Flips the issue's status and redirects to the issue page.
      responses:
        "302":
          description: Redirect to the issue page
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{name}/changes:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
    post:
      operationId: createChange
      tags: [changes]
      summary: Create a change from a workspace and evaluate it
      description: |
        Diffs the workspace against the project, runs the project's evaluator
        policy (secret scan always; diff/webhook/llm/sandbox per policy), records
        eval runs, and sets the change status to `accepted` or `needs_changes`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace]
              properties:
                workspace: { type: string }
      responses:
        "201":
          description: Change created and evaluated
          content:
            application/json:
              schema:
                type: object
                properties:
                  change: { $ref: "#/components/schemas/Change" }
                  eval: { $ref: "#/components/schemas/EvalResult" }
                  evalRuns:
                    type: array
                    items: { $ref: "#/components/schemas/EvalRun" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetDeleting"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listChanges
      tags: [changes]
      summary: List changes for a project
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, needs_changes, accepted, approved, promoted, merged, rejected]
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        "200":
          description: Changes
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  changes:
                    type: array
                    items: { $ref: "#/components/schemas/Change" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{name}/changes/merge-batch:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
    post:
      operationId: mergeBatch
      tags: [changes]
      summary: Merge many changes into the project in one request
      description: |
        Batched server-side merge (ADR 004): resolves and policy-gates every
        change, then merges the eligible ones onto the project head with a
        single push. At most 80 changes per request. Requires the RepoDO
        backend to be enabled. `force` is deny-by-default and must be allowed
        by the project policy (`merge.allowForce: true`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changeIds]
              properties:
                changeIds:
                  type: array
                  maxItems: 80
                  items: { type: string }
                force: { type: boolean, default: false }
      responses:
        "200":
          description: Batch outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  merged:
                    type: array
                    items: { type: string }
                  conflicted:
                    type: array
                    items: { type: string }
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        changeId: { type: string }
                        reason: { type: string }
                  timings:
                    type: object
                    properties:
                      resolveMs: { type: number }
                      batchMs: { type: number }
                      persistMs: { type: number }
                      serverMs: { type: number }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/changes/{id}:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
    get:
      operationId: getChange
      tags: [changes]
      summary: Get a change with its eval runs and cost summary
      security: [{ bearerAuth: [] }, {}]
      responses:
        "200":
          description: Change detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  change: { $ref: "#/components/schemas/Change" }
                  evalRuns:
                    type: array
                    items: { $ref: "#/components/schemas/EvalRun" }
                  costs:
                    type: array
                    items:
                      type: object
                      description: Per-kind cost summary for this change
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/changes/{id}/merge:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
    post:
      operationId: mergeChange
      tags: [changes]
      summary: Merge a change into its project
      description: |
        Users only. The change must be approved, accepted, or promoted (unless
        forcing, which the project policy must allow). Branch protection,
        stale-base (`requireFreshBase`), and stale-workspace (SEC-2) gates run
        before the merge.
      parameters:
        - name: force
          in: query
          schema: { type: boolean, default: false }
          description: Bypass evaluation/approval gates. Only allowed when the project policy sets `merge.allowForce`.
        - name: strategy
          in: query
          schema: { type: string, enum: [merge, squash], default: merge }
      responses:
        "200":
          description: Merged
          content:
            application/json:
              schema:
                type: object
                properties:
                  merged: { type: boolean }
                  changeId: { type: string }
                  project: { type: string }
                  workspace: { type: string }
                  commit: { type: string }
                  postMerge:
                    type: object
                    description: Post-merge policy check outcome
                    properties:
                      status: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Project access denied, or merge blocked by branch protection (code PROTECTION_BLOCKED with `reasons`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      reasons:
                        type: array
                        items: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Structured conflict responses; `code` is one of STALE_BASE,
            STALE_WORKSPACE, WORKSPACE_UNVERIFIABLE, or MERGE_CONFLICT (which
            includes `conflictId` and `conflictingFiles` for
            `POST /api/projects/conflicts/{id}/resolve`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      baseSha: { type: string }
                      currentHead: { type: string }
                      evaluatedSha: { type: string }
                      currentTip: { type: string }
                      conflictId: { type: string }
                      conflictingFiles:
                        type: array
                        items: { type: string }
                      message: { type: string }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/changes/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
    post:
      operationId: rejectChange
      tags: [changes]
      summary: Reject a change
      description: Users only. Merged changes cannot be rejected.
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  rejected: { type: boolean }
                  changeId: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/changes/{id}/evaluate:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
    post:
      operationId: evaluateChange
      tags: [changes]
      summary: Re-run evaluation for a change
      description: Users only. Merged, rejected, or promoted changes cannot be re-evaluated.
      responses:
        "200":
          description: Evaluation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  changeId: { type: string }
                  eval: { $ref: "#/components/schemas/EvalResult" }
                  evalRuns:
                    type: array
                    items: { $ref: "#/components/schemas/EvalRun" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/changes/{id}/github-pr:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
    post:
      operationId: promoteChangeToGitHubPr
      tags: [changes]
      summary: Promote an accepted change to a GitHub pull request
      description: |
        Users only. The change must be accepted (or already promoted) and the
        project connected to GitHub with a configured GitHub token. Creates a
        (draft by default) PR from branch `stratum/{changeId}` and marks the
        change `promoted`.

        The PR base is always the project's own recorded default branch and is
        not accepted from the request body: this endpoint acts with the
        instance-wide GitHub token, so honouring a caller-supplied base would
        let any caller aim that shared credential at a branch of its choosing.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                body: { type: string }
                draft: { type: boolean, default: true }
      responses:
        "200":
          description: PR created
          content:
            application/json:
              schema:
                type: object
                properties:
                  changeId: { type: string }
                  github:
                    type: object
                    properties:
                      owner: { type: string }
                      repo: { type: string }
                      branch: { type: string }
                      pullRequestNumber: { type: integer }
                      pullRequestUrl: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/changes/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
    post:
      operationId: addChangeComment
      tags: [reviews]
      summary: Add a comment to a change
      description: |
        Users and agents with read access to the project may comment.

        A comment can optionally be anchored to a diff line by passing `file`
        and `line` together (`side` and `commitSha` are only allowed with such
        an anchor). Passing `parentCommentId` posts a reply into an existing
        thread: the parent must belong to the same change, replies inherit the
        thread's anchor (anchor fields must be omitted), and replies to
        replies are flattened onto the thread root.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 20000 }
                file:
                  type: string
                  description: File path the comment is anchored to (requires line)
                line:
                  type: integer
                  minimum: 1
                  description: 1-based line number in the diff (requires file)
                side:
                  type: string
                  enum: [old, new]
                  description: Which half of the diff the line belongs to; only with file+line
                commitSha:
                  type: string
                  description: Commit the anchor was recorded against; only with file+line
                parentCommentId:
                  type: string
                  description: Thread root to reply to; mutually exclusive with anchor fields
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment: { $ref: "#/components/schemas/ChangeComment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listChangeComments
      tags: [reviews]
      summary: List comments on a change
      description: |
        Comments are returned in `createdAt` order and each carries its
        `parentCommentId` (plus any line anchor), so threads are
        reconstructable: roots in order, replies grouped under their root.
      security: [{ bearerAuth: [] }, {}]
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items: { $ref: "#/components/schemas/ChangeComment" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/changes/{id}/comments/{commentId}/resolve:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
      - name: commentId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: resolveChangeComment
      tags: [reviews]
      summary: Resolve a comment thread
      description: |
        Marks a thread-root comment resolved. Allowed for project writers or
        the comment's author. Replies cannot be resolved — only the thread
        root.
      responses:
        "200":
          description: Thread resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment: { $ref: "#/components/schemas/ChangeComment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/changes/{id}/comments/{commentId}/unresolve:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
      - name: commentId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: unresolveChangeComment
      tags: [reviews]
      summary: Reopen a resolved comment thread
      description: Same authorization rules as resolve.
      responses:
        "200":
          description: Thread reopened
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment: { $ref: "#/components/schemas/ChangeComment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/changes/{id}/reviews:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
    post:
      operationId: submitReview
      tags: [reviews]
      summary: Submit a human review verdict
      description: |
        Users only — agent tokens cannot approve work. An `approve` verdict
        moves the change to `approved`; `request_changes` moves it to
        `needs_changes`. Only open, needs_changes, accepted, or approved
        changes can be reviewed.

        A `comment` verdict is a comment-only review: `comment` (the text) is
        required, the body is recorded in the change's discussion, the change
        status is untouched, and it never counts toward required approvals nor
        blocks a merge. It also never replaces an existing
        approve/request_changes verdict by the same reviewer — a verdict row
        with `comment` is only recorded when the reviewer has no verdict yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict]
              properties:
                verdict:
                  type: string
                  enum: [approve, request_changes, comment]
                comment: { type: string, maxLength: 20000 }
      responses:
        "201":
          description: Review recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  review: { $ref: "#/components/schemas/Review" }
                  changeStatus:
                    type: string
                    description: |
                      approved or needs_changes after an approve/request_changes
                      verdict; the change's unchanged status after a comment
                      verdict.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetDeleting"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List reviews on a change
      security: [{ bearerAuth: [] }, {}]
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items: { $ref: "#/components/schemas/Review" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/workspaces/{namespace}/{slug}/workspaces:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a workspace (fork) for a project
      description: Requires project write access. Omitting `name` generates one (`ws-<timestamp>`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 1-64 char alphanumeric slug
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace: { type: string }
                  remote: { type: string }
                  namespace: { type: string }
                  slug: { type: string }
                  path: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetDeleting"
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List workspaces for a project
      security: [{ bearerAuth: [] }, {}]
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { type: string }
                  slug: { type: string }
                  path: { type: string }
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/workspaces/{name}/commit:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: Workspace name (scoped by projectId in the body)
    post:
      operationId: commitToWorkspace
      tags: [workspaces]
      summary: Commit files to a workspace
      description: |
        Writes the given file map onto the workspace fork as one commit. Bounded
        to 2000 files / 25 MiB per commit. Requires project write access AND
        workspace write access (creator or admin); failures return 404 to avoid
        leaking existence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files, message, projectId]
              properties:
                files:
                  type: object
                  additionalProperties: { type: string }
                  description: Path -> contents map
                message: { type: string }
                projectId: { type: string, format: uuid }
      responses:
        "200":
          description: Commit pushed
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace: { type: string }
                  commit: { type: string, description: Commit SHA }
                  filesChanged:
                    type: array
                    items: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
