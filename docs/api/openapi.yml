  /api/projects/{namespace}/{slug}/sync:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: syncProject
      tags: [sync]
      summary: Re-sync the project with its source repository
      description: |
        Checks the source remote (GitHub/GitLab/Bitbucket) for new commits and,
        when updates exist, queues a background sync. Only allowed in the
        caller's own namespace.
      responses:
        "200":
          description: Sync initiated, or already up to date
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  namespace: { type: string }
                  slug: { type: string }
                  importId: { type: string }
                  status: { type: string, example: queued }
                  hasUpdates: { type: boolean }
                  commitsBehind: { type: integer }
                  latestCommit: { type: string }
                  lastSyncedCommit: { type: string }
        "400":
          description: Not connected to a remote, unsupported provider, or a sync is already in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The project has a push mirror enabled and does not sync from its source (`code` = `PUSH_MIRROR_ENABLED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >-
            Whether the project has a push mirror could not be read, so nothing was synced (`code` =
            `PUSH_MIRROR_UNKNOWN`). Retry. A failed read is never treated as "no mirror".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/sync/status:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getSyncStatus
      tags: [sync]
      summary: Get sync status for a project
      security: [{ bearerAuth: [] }, {}]
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/mirror:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getPushMirror
      tags: [mirror]
      summary: Get the project's push mirror
      description: Project admins only (user identity).
      responses:
        "200":
          description: The mirror, or null when the project has none
          content:
            application/json:
              schema:
                type: object
                required: [mirror]
                properties:
                  mirror:
                    oneOf:
                      - $ref: "#/components/schemas/PushMirror"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: configurePushMirror
      tags: [mirror]
      summary: Configure the project's push mirror
      description: |
        Project admins only (user identity). Sets the GitHub repository the
        project's default branch and tags are pushed to after every merge. The
        mirror is fast-forward only: it never force-pushes and never deletes a
        ref on GitHub.

        The target is checked before it is saved, enabled or not (only
        disabling an existing mirror skips the check): the GitHub App must be
        installed on the repository with the Contents (read and write)
        permission, linked to the project's owner, and the repository must not
        be connected to another project. Saving an enabled mirror queues a push.

        While a mirror is enabled the project is in forge mode: syncing from
        its source and promoting changes to GitHub pull requests are refused
        with `409` `PUSH_MIRROR_ENABLED`.

        `POST` to the same path is equivalent, and is what the settings form
        uses; a form-encoded request is answered with a redirect to the project
        settings page instead of JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo]
              properties:
                repo:
                  type: string
                  description: The GitHub repository, as `owner/repository`
                  example: acme/widgets
                enabled:
                  type: boolean
                  default: true
                  description: >
                    A disabled mirror keeps its configuration and status and
                    pushes nothing. Enabling it again queues a push.
                acceptPullRequests:
                  type: boolean
                  description: >
                    Bring pull requests opened against the mirror's default
                    branch into the project as `external` changes. Off for a
                    new mirror. Left unchanged when omitted. Needs the GitHub
                    App's Pull requests permission (read and write) and its
                    `pull_request` webhook event.
                requireContributorAgreement:
                  type: boolean
                  description: >
                    Require the maintainer importing a pull request to confirm
                    the contributor agreement. Off for a new mirror. Left
                    unchanged when omitted.
      responses:
        "200":
          description: Mirror saved
          content:
            application/json:
              schema:
                type: object
                required: [mirror]
                properties:
                  mirror: { $ref: "#/components/schemas/PushMirror" }
        "400":
          description: "`repo` is not `owner/repository` (`code` = `invalid-repo`)"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not an admin; the App installation is not linked to the project's owner (`not-authorized`); or the App lacks the Contents permission on the repository (`no-permission`)
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The App is not installed on the repository (`not-installed`), the repository is connected to another project (`taken`), or the project is being deleted (`deleting`)
        "502":
          description: GitHub could not be reached (`code` = `github`)
        "503":
          description: The GitHub App is not configured on this instance (`not-configured`), or the mirror could not be saved (`failed`)
    delete:
      operationId: deletePushMirror
      tags: [mirror]
      summary: Remove the project's push mirror
      description: >
        Project admins only (user identity). Deletes the configuration and
        status. The GitHub repository is not changed.
      responses:
        "200":
          description: Mirror removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{namespace}/{slug}/mirror/resume:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: resumePushMirror
      tags: [mirror]
      summary: Clear a failed or diverged mirror and push now
      description: |
        Project admins only (user identity). Clears a `failed` or `diverged`
        state and queues a push. This is the only way out of `diverged`.

        Resuming never forces a push: if the GitHub repository still holds
        history the project does not, the next push marks the mirror `diverged`
        again. On a healthy mirror this queues a push now.
      responses:
        "202":
          description: Push queued
          content:
            application/json:
              schema:
                type: object
                required: [mirror]
                properties:
                  mirror: { $ref: "#/components/schemas/PushMirror" }
        "302":
          description: Form post; redirect to the settings page
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{namespace}/{slug}/resync:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: resyncFromGitHub
      tags: [mirror]
      summary: "Break-glass: fast-forward the default branch to its GitHub copy"
      description: |
        Project admins only (user identity), with a browser session or a
        personal API token. An OAuth grant is refused with
        `403 ADMIN_REQUIRES_DIRECT_CREDENTIAL`. The organization's second-factor
        policy and IP allowlist apply.

        Fast-forwards the project's default branch to the same branch on the
        project's push mirror repository or, for a project with no mirror, its
        linked GitHub repository. The request cannot choose the source.

        Fast-forward only: a diverged branch is refused with
        `409 RESYNC_DIVERGED`, naming both commits, and nothing is changed.
        Nothing is ever forced, rewritten or merged.

        The commits this brings in are NOT evaluated: no evaluator, approval,
        post-merge check or deployment runs for them. The audit entries
        (`branch.resync_requested`, `branch.resynced`), the `branch.resynced`
        event and this response all say so.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedSha:
                  type: string
                  pattern: "^[0-9a-fA-F]{40}$"
                  description: |
                    Only fast-forward if the branch on GitHub is at exactly this
                    commit. Any other commit there is refused with
                    `409 RESYNC_SHA_MISMATCH`.
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  description: The source repository, `owner/repository`, typed out.
                expected_sha:
                  type: string
                  pattern: "^[0-9a-fA-F]{40}$"
                  description: >
                    Optional pin, as `expectedSha` in the JSON body: the resync
                    is refused unless GitHub's branch is at exactly this
                    commit. Trimmed and lower-cased; empty means no pin.
      responses:
        "200":
          description: The branch was fast-forwarded, or was already up to date
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ResyncFastForwarded"
                  - $ref: "#/components/schemas/ResyncUpToDate"
        "302":
          description: Form post; redirect to the settings page
        "400":
          description: >
            `RESYNC_INVALID_SHA`: `expectedSha` is not a full SHA.
            `RESYNC_INVALID_BODY`: the body is present but is not a JSON
            object (an empty body is accepted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResyncRefusal" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Not a project admin, a write-scoped OAuth grant
            (`ADMIN_REQUIRES_DIRECT_CREDENTIAL`), a read-only token or grant
            (`TOKEN_SCOPE_INSUFFICIENT`), or the GitHub App is not
            authorized for the repository (`GITHUB_APP_NOT_AUTHORIZED`,
            `GITHUB_APP_PERMISSION_DENIED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResyncRefusal" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Refused, nothing changed: `RESYNC_DIVERGED`, `RESYNC_SHA_MISMATCH`,
            `RESYNC_PROJECT_MOVED`, `RESYNC_NO_UPSTREAM`,
            `RESYNC_UPSTREAM_BRANCH_MISSING`, `RESYNC_PROJECT_BRANCH_MISSING`,
            `GITHUB_APP_NOT_INSTALLED` or `TARGET_DELETING`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResyncRefusal" }
        "502":
          description: |
            GitHub or the project's repository could not be read or refused the
            operation: `GITHUB_ACCESS_DENIED`, `RESYNC_UPSTREAM_UNAVAILABLE`,
            `RESYNC_PROJECT_UNAVAILABLE`, `RESYNC_HISTORY_INCOMPLETE`,
            `RESYNC_PUSH_REJECTED` or `RESYNC_FAILED`. After `RESYNC_FAILED`
            the outcome may be unknown; check the branch before retrying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResyncRefusal" }
        "503":
          description: "`GITHUB_APP_NOT_CONFIGURED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResyncRefusal" }
        "504":
          description: |
            `RESYNC_PUSH_TIMEOUT`: the push did not finish in time and may
            still land. Check the branch before retrying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResyncRefusal" }

