  /api/projects/{namespace}/{slug}/webhooks/{id}/regenerate-secret:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: regenerateWebhookSecret
      tags: [webhooks]
      summary: Regenerate a webhook's signing secret
      description: |
        Requires project write access. Replaces the webhook's HMAC signing
        secret with a newly generated one and returns it — like creation, this
        is the only time the new secret is shown. The webhook keeps its id,
        configuration, and delivery history. The old secret stops working
        immediately: every delivery from now on is signed with the new one, so
        update your receivers to verify `X-Stratum-Signature` with it. Records a
        `webhook.secret_rotated` audit entry. The response is sent with
        `Cache-Control: no-store`. A request without a JSON `Content-Type` (the
        management page's form post) gets an HTML page that shows the new
        secret once instead of the JSON body.
      responses:
        "200":
          description: Secret regenerated (includes the new secret, shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook: { $ref: "#/components/schemas/Webhook" }
            text/html:
              schema: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/webhooks/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: deleteWebhookForm
      tags: [webhooks]
      summary: Delete a webhook (form-friendly alias)
      responses:
        "302":
          description: Redirect back to the project's webhooks page
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{namespace}/{slug}/secrets:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: listProjectSecrets
      tags: [deployments]
      summary: List deploy secret names (values never returned)
      description: |
        Requires **project admin**, and the caller must not be an agent: an
        agent token is refused on every secret route even when its owner owns
        the project. There is no read path for a stored secret value anywhere
        in the API.
      responses:
        "200":
          description: Secret names and metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  secrets:
                    type: array
                    items: { $ref: "#/components/schemas/ProjectSecret" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: putProjectSecretForm
      tags: [deployments]
      summary: Create or replace a deploy secret (form-friendly alias)
      description: |
        The browser's way in to the PUT below, which an HTML form cannot issue;
        the secret's name travels in the body. Same authorization gate. A
        form-encoded caller is redirected back to the project settings page
        with a fixed error code rather than a caller-supplied message.

        The content type is what selects the response shape, not just the
        parser: `application/json` is answered with JSON, and anything else is
        treated as a browser form and answered with a `302`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value]
              properties:
                name:
                  type: string
                  pattern: "^[A-Z][A-Z0-9_]{0,63}$"
                value:
                  type: string
                  description: At most 4096 bytes. Never returned by any endpoint.
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name, value]
              properties:
                name:
                  type: string
                  pattern: "^[A-Z][A-Z0-9_]{0,63}$"
                  description: >
                    Surrounding whitespace is trimmed before validation. A name
                    that does not match the pattern redirects with
                    `?secretError=name` instead of returning `400`.
                value:
                  type: string
                  description: >
                    At most 4096 bytes; must not be empty (an empty value
                    redirects with `?secretError=value`). Never returned by any
                    endpoint.
          multipart/form-data:
            schema:
              type: object
              required: [name, value]
              properties:
                name:
                  type: string
                  pattern: "^[A-Z][A-Z0-9_]{0,63}$"
                value:
                  type: string
                  description: At most 4096 bytes. Never returned by any endpoint.
      responses:
        "200":
          description: Secret stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { $ref: "#/components/schemas/ProjectSecret" }
        "302":
          description: Form-encoded caller redirected back to project settings
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: >
            Storage failed, or the instance has no DEPLOY_SECRET_KEY configured
            (`DEPLOY_SECRET_KEY_MISSING`), without which secrets cannot be encrypted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/projects/{namespace}/{slug}/secrets/{name}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,63}$"
    put:
      operationId: putProjectSecret
      tags: [deployments]
      summary: Create or replace a deploy secret
      description: |
        Requires project admin and a non-agent identity. Encrypted at rest with
        the project id and secret name bound as additional authenticated data;
        only the deploy runner ever decrypts it. Audited as `secret.written`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  description: At most 4096 bytes. Never returned by any endpoint.
      responses:
        "200":
          description: Secret stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { $ref: "#/components/schemas/ProjectSecret" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: >
            Storage failed, or the instance has no DEPLOY_SECRET_KEY configured
            (`DEPLOY_SECRET_KEY_MISSING`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteProjectSecret
      tags: [deployments]
      summary: Delete a deploy secret
      description: Requires project admin and a non-agent identity. Audited as `secret.deleted`.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  name: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/secrets/{name}/delete:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: deleteProjectSecretForm
      tags: [deployments]
      summary: Delete a deploy secret (form-friendly alias)
      description: |
        Browsers cannot issue DELETE. Same gate as the DELETE above; a
        form-encoded caller is redirected back to project settings even when the
        name was already gone.
      responses:
        "200":
          description: Deleted (JSON caller)
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  name: { type: string }
        "302":
          description: Form-encoded caller redirected back to project settings
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/deployments:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: listDeployments
      tags: [deployments]
      summary: List post-merge deployments, newest first
      description: |
        Readable by anyone who can read the project (anonymously, on a public
        project). `logTail` is included **only** for callers with project write
        access — it holds a redacted provider payload.
      parameters:
        - name: name
          in: query
          schema: { type: string }
          description: Only deployments for this `deploys:` entry or pipeline environment name
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_approval, queued, running, succeeded, failed, superseded, skipped]
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Deployments
          content:
            application/json:
              schema:
                type: object
                properties:
                  deployments:
                    type: array
                    items: { $ref: "#/components/schemas/Deployment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/deployments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getDeployment
      tags: [deployments]
      summary: Get one deployment
      description: |
        The URL carries no project, so the row's own project is authorized. A
        deployment in a project the caller cannot read answers `404` rather than
        `403`, so an id cannot be confirmed by probing. `logTail` is included
        only for project writers.
      responses:
        "200":
          description: The deployment
          content:
            application/json:
              schema:
                type: object
                properties:
                  deployment: { $ref: "#/components/schemas/Deployment" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/deployments/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: approveDeployment
      tags: [deployments]
      summary: Approve a deployment awaiting approval
      description: |
        Moves a `pending_approval` deployment to `queued` and enqueues it.
        Requires project **write** access and a **user** identity — an agent
        token is refused. Like a human review verdict, the guarantee is "not an
        agent identity": a user's scoped API token and MCP OAuth grants are
        accepted, so this is not evidence of a human at a keyboard.

        Audited as `deployment.approved`. A form-encoded caller receives a
        `302` back to the deployment page instead of JSON.
      responses:
        "200":
          description: Approved and enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  deployment: { $ref: "#/components/schemas/Deployment" }
        "302":
          description: Form-encoded caller redirected to the deployment page
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The deployment is not awaiting approval (`DEPLOYMENT_NOT_PENDING`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Deployments are not enabled on this instance (`DEPLOY_QUEUE_UNAVAILABLE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/deployments/{id}/retry:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: retryDeployment
      tags: [deployments]
      summary: Re-run a finished deployment as a new attempt
      description: |
        Creates a new row for the same commit with `attempt` incremented and
        enqueues it; the original row is kept. Requires project write access,
        and unlike approve an agent identity is accepted. The originating
        change id is carried over, so the "was this change reverted?" check
        still applies. Audited as `deployment.retried`.

        A retry is not a way round a **pipeline** environment's approval
        gate: a user's retry carries that user's approval, and an agent's
        retry carries none. If the environment has `requiresApproval: true`
        (read from the pipeline at the commit being retried), an agent's retry
        waits at `pending_approval` until a user approves it — created there
        directly when the retried deployment was itself approved, and
        otherwise moved there when it is about to run.
      responses:
        "201":
          description: Retry attempt created and enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  deployment: { $ref: "#/components/schemas/Deployment" }
        "302":
          description: Form-encoded caller redirected to the new deployment page
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The deployment is not in a terminal status
            (`DEPLOYMENT_NOT_RETRYABLE`) — a `pending_approval` row in
            particular cannot be retried, since the retry would start `queued`
            and route around the approval gate — or this attempt already exists
            (`DEPLOYMENT_RETRY_EXISTS`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Deployments are not enabled on this instance (`DEPLOY_QUEUE_UNAVAILABLE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/deployments/{id}/rollback:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: The `succeeded` deployment to put back
    post:
      operationId: rollbackDeployment
      tags: [deployments]
      summary: Roll back to an earlier deployment
      description: |
        Creates a **new** deployment of the same name (environment) and commit
        as `{id}`, with `rollbackOf` set, and enqueues it. It redeploys what
        that deployment deployed: for a pipeline environment that declares
        `rollback:` steps and has a recorded `version`, those steps run with
        `STRATUM_ROLLBACK_VERSION`; otherwise the environment's steps (or the
        static target) run again at that commit.

        **It does not undo a database migration.** Migrations are forward-only;
        the earlier version is deployed against the schema as it is now.

        Requires project **write** access and a **user** identity, exactly like
        approve — an agent token is refused — and the caller is recorded as
        `approvedBy`, so the rollback does not then wait for approval. It is
        serialized with every other deployment of the environment, supersedes
        deployments of it still `queued` or `pending_approval`, and never
        promotes to a later environment. Audited as `deployment.rolled_back`.

        A form-encoded caller must send `confirm=yes`; without it the response
        is a `302` to the confirmation page and nothing happens. JSON callers
        need no confirmation field.
      responses:
        "201":
          description: Rollback deployment created and enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  deployment: { $ref: "#/components/schemas/Deployment" }
        "302":
          description: >
            Form-encoded caller: redirected to the new deployment, or — without
            `confirm=yes` — to the confirmation page
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The deployment did not succeed, so there is nothing to put back
            (`DEPLOYMENT_NOT_ROLLBACKABLE`), or another retry or rollback took
            the attempt number at the same moment (`DEPLOYMENT_RETRY_EXISTS`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Deployments are not enabled on this instance (`DEPLOY_QUEUE_UNAVAILABLE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/deployments/{id}/log:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getDeploymentLog
      tags: [deployments]
      summary: Read a pipeline deployment's full step log
      description: |
        The output of every step the deployment has run so far, one step after
        another, as the CI executor kept it. Only a pipeline deployment
        (`target: pipeline`) has one. Requires project **write** access, like
        `logTail`: a deploy log is whatever the project's deploy commands
        printed.
      responses:
        "200":
          description: The log
          content:
            text/plain:
              schema: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >
            No such deployment; the deployment is not a pipeline deployment
            (`LOG_NOT_AVAILABLE`); or no log has been stored yet
            (`LOG_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The instance has no CI executor, or it could not be reached (`CI_EXECUTOR_UNAVAILABLE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/deploy-reports/{deploymentId}:
    parameters:
      - name: deploymentId
        in: path
        required: true
        schema: { type: string }
        description: The deployment id handed to the CI executor in its deploy dispatch
    post:
      operationId: reportDeployment
      tags: [deployments]
      summary: Report a pipeline deployment's outcome (CI executor callback)
      description: |
        Called by the instance's CI executor, not by an API client. The request
        carries no bearer token and no session; it is authenticated by the
        `X-Stratum-Signature` header, the HMAC-SHA256 of the raw request body
        under the instance's `CI_EXECUTOR_SECRET`.

        One report finishes one `running` pipeline deployment. It cannot create
        a deployment, finish one that was never handed to the executor
        (`queued`, `pending_approval`), or change one that has already
        finished.
      security: []
      parameters:
        - name: X-Stratum-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: "^sha256=[0-9a-f]{64}$"
          description: "`sha256=` followed by the hex HMAC-SHA256 of the raw request body"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentReport" }
      responses:
        "200":
          description: The deployment was finished with the reported outcome
          content:
            application/json:
              schema:
                type: object
                required: [applied, status]
                properties:
                  applied: { type: boolean }
                  status: { type: string, enum: [succeeded, failed] }
        "400":
          description: Signed, but not a valid report (code INVALID_REPORT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: >
            Missing or wrong signature (code INVALID_SIGNATURE). The signature
            is checked before the deployment is looked up, so the endpoint does
            not reveal which deployment ids exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            There is no running pipeline deployment with this id for the
            reported commit (code DEPLOYMENT_NOT_RUNNING): it already finished,
            was given up on, or was never dispatched. Not retryable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: The body is over 128 KB (code PAYLOAD_TOO_LARGE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/projects/{namespace}/{slug}/issues:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: createIssue
      tags: [issues]
      summary: Open an issue
      description: Anyone who can read the project can open issues. Also accepts form bodies (which redirect on success).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 20000 }
                linkedChangeId:
                  type: string
                  description: Must reference a change in this project
      responses:
        "201":
          description: Issue created
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue: { $ref: "#/components/schemas/Issue" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetDeleting"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listIssues
      tags: [issues]
      summary: List issues
      description: |
        Filterable by status, label, assignee, and free-text search (`q`, a
        case-insensitive substring match over title + body). Paginate with
        `limit` + `offset`; results are ordered newest-first by issue number.
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, closed] }
        - name: label
          in: query
          description: Only issues carrying this exact label
          schema: { type: string }
        - name: assignee
          in: query
          description: Only issues assigned to this user id
          schema: { type: string }
        - name: q
          in: query
          description: Substring search over title and body (max 200 chars; % and _ match literally)
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
        - name: offset
          in: query
          description: Rows to skip (LIMIT/OFFSET pagination)
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: Issues
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items: { $ref: "#/components/schemas/Issue" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/issues/{number}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
      - name: number
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getIssue
      tags: [issues]
      summary: Issue detail
      security: [{ bearerAuth: [] }, {}]
      responses:
        "200":
          description: Issue
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue: { $ref: "#/components/schemas/Issue" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateIssue
      tags: [issues]
      summary: Edit, close, reopen, label, or assign an issue
      description: Requires project write access. Users only (agent tokens cannot edit issues).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 20000 }
                status: { type: string, enum: [open, closed] }
                linkedChangeId:
                  type: [string, "null"]
                  description: Set to null or "" to unlink
                assignee:
                  type: [string, "null"]
                  description: Single assignee (user id); set to null or "" to unassign
                labels:
                  type: array
                  maxItems: 20
                  items: { type: string, maxLength: 50 }
                  description: |
                    Replaces the issue's full label set (add/remove by sending the
                    desired set); [] clears all labels. Omit to leave labels unchanged.
      responses:
        "200":
          description: Updated issue
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue: { $ref: "#/components/schemas/Issue" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/issues/{number}/comments:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
      - name: number
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: addIssueComment
      tags: [issues]
      summary: Comment on an issue
      description: Anyone who can read the project can comment. Also accepts form bodies (which redirect to the issue page).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 20000 }
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment: { $ref: "#/components/schemas/IssueComment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listIssueComments
      tags: [issues]
      summary: List an issue's comments
      description: Chronological (oldest first), paginated with limit + offset.
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items: { $ref: "#/components/schemas/IssueComment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/issues/{number}/close:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
      - name: number
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: toggleIssueClosed
      tags: [issues]
      summary: Toggle an issue open/closed (form-friendly)
      description: Flips the issue's status and redirects to the issue page.
      responses:
        "302":
          description: Redirect to the issue page
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{namespace}/{slug}/issues/import/github:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: importGitHubIssues
      tags: [issues]
      summary: Import the project's GitHub issues
      description: |
        Project admins only (user identity). Queues a background import of the
        issues of the project's own GitHub source repository: title, body,
        state, labels, timestamps and comments, each linked back to GitHub.
        Pull requests are skipped. Re-running updates previously imported
        issues and comments instead of duplicating them. Public repositories
        only. A form-encoded request is answered with a redirect to the project
        settings page instead of JSON.
      responses:
        "202":
          description: Import queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { $ref: "#/components/schemas/IssueImportRun" }
        "302":
          description: Form post; redirect to the settings page
        "400":
          description: The project has no GitHub source (`code` = `no-source`)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not an admin, the repository is private (`code` = `private`), or no GitHub credential may act for the project's owner (`not-authorized`)
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An import is active (`active`), the code import is incomplete (`incomplete`), or the project is being deleted (`deleting`)
        "502":
          description: GitHub could not be reached (`code` = `github`)
        "503":
          description: No GitHub credential is available on this instance (`not-configured`), or the job could not be queued (`failed`)
    get:
      operationId: getGitHubIssueImport
      tags: [issues]
      summary: Latest GitHub issue import run
      responses:
        "200":
          description: The latest run, or null if the project never imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    oneOf:
                      - $ref: "#/components/schemas/IssueImportRun"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{name}/changes:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
    post:
      operationId: createChange
      tags: [changes]
      summary: Create a change from a workspace and evaluate it
      description: |
        Creates the change and evaluates it against the project's evaluator
        policy (secret scan always; diff/webhook/llm/sandbox per policy).

        On an instance with an evaluation queue (the hosted instance, and any
        self-host that binds `EVALUATION_QUEUE`) the evaluators run off the
        request: the response is `202` with the change in status `evaluating`
        and no verdict. Poll `GET /api/changes/{id}` until the status becomes
        `accepted` or `needs_changes`. A change cannot be merged while it is
        `evaluating`.

        Without the queue — or if enqueueing fails — evaluation runs inline and
        the response is `201` with the verdict, as before.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace]
              properties:
                workspace: { type: string }
                title:
                  type: string
                  maxLength: 200
                  description: One line saying what the change does. No line breaks.
                description:
                  type: string
                  maxLength: 20000
                  description: Why the change exists and what a reviewer should know (markdown source).
      responses:
        "201":
          description: |
            Change created and evaluated inline — no evaluation queue is bound, or
            sending to it failed and the run executed on the request instead.
          content:
            application/json:
              schema:
                type: object
                properties:
                  change: { $ref: "#/components/schemas/Change" }
                  eval: { $ref: "#/components/schemas/EvalResult" }
                  evalRuns:
                    type: array
                    items: { $ref: "#/components/schemas/EvalRun" }
        "202":
          description: Change created; evaluation queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvaluationQueued" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetDeleting"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listChanges
      tags: [changes]
      summary: List changes for a project
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, evaluating, external, needs_changes, accepted, approved, promoted, merged, rejected]
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        "200":
          description: Changes
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  changes:
                    type: array
                    items: { $ref: "#/components/schemas/Change" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{name}/changes/merge-batch:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
    post:
      operationId: mergeBatch
      tags: [changes]
      summary: Merge many changes into the project in one request
      description: |
        Batched server-side merge (ADR 004): resolves and policy-gates every
        change, then merges the eligible ones onto the project head with a
        single push. At most 80 changes per request. Requires the RepoDO
        backend to be enabled. `force` is deny-by-default and must be allowed
        by the project policy (`merge.allowForce: true`).

        A change that came from a pull request on the mirror is skipped, so
        that its commits are kept; merge it on its own. When nothing is
        eligible the `400` response carries the `skipped` list with a reason
        for each change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changeIds]
              properties:
                changeIds:
                  type: array
                  maxItems: 80
                  items: { type: string }
                force: { type: boolean, default: false }
      responses:
        "200":
          description: Batch outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  merged:
                    type: array
                    items: { type: string }
                  conflicted:
                    type: array
                    items: { type: string }
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        changeId: { type: string }
                        reason: { type: string }
                  timings:
                    type: object
                    properties:
                      resolveMs: { type: number }
                      batchMs: { type: number }
                      persistMs: { type: number }
                      serverMs: { type: number }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >
            Under `merge.requireFreshBase`, the project's current head could
            not be read, and no change in the batch could be merged (code
            BASE_UNVERIFIABLE). The body carries `skipped`. Nothing was merged;
            try again. When other changes in the batch are mergeable they are
            merged, and the unverified ones are listed under `skipped` in the
            `200`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      skipped:
                        type: array
                        items:
                          type: object
                          properties:
                            changeId: { type: string }
                            reason: { type: string }

  /api/changes/{id}:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
    get:
      operationId: getChange
      tags: [changes]
      summary: Get a change with its eval runs and cost summary
      security: [{ bearerAuth: [] }, {}]
      responses:
        "200":
          description: Change detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  change: { $ref: "#/components/schemas/Change" }
                  evalRuns:
                    type: array
                    items: { $ref: "#/components/schemas/EvalRun" }
                  costs:
                    type: array
                    items:
                      type: object
                      description: Per-kind cost summary for this change
                  externalPullRequest:
                    $ref: "#/components/schemas/ExternalPullRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateChange
      tags: [changes]
      summary: Set or clear a change's title and description
      description: >-
        Changes only the text. It does not re-run evaluation or affect whether
        the change may merge. Needs write access to the project; agent tokens
        are accepted.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title:
                  type: [string, "null"]
                  maxLength: 200
                  description: One line. `null` or an empty string clears it.
                description:
                  type: [string, "null"]
                  maxLength: 20000
                  description: Markdown source. `null` or an empty string clears it.
      responses:
        "200":
          description: The change as it now stands
          content:
            application/json:
              schema:
                type: object
                properties:
                  change: { $ref: "#/components/schemas/Change" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/changes/{id}/import:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
    post:
      operationId: importChange
      tags: [changes]
      summary: Import an external change's pull request
      description: |
        Brings the commits of a pull request on the project's GitHub mirror
        into the change's workspace and starts the change's evaluation. This
        is what turns an `external` change into an ordinary one.

        A person with write access to the project only. An agent credential is
        refused with `401`.

        The pull request is read from GitHub again: it must be open against
        the default branch of the mirror, and its head must be `headSha` when
        that is given. Its commits are fetched from the mirror repository and
        checked against the limits (100 commits, 300 changed files, 5 MB of
        changed content, 20 MB fetched), and refused if they add a submodule
        or a Git LFS pointer or conflict with the default branch. A refusal is
        recorded on the change (`externalPullRequest.refusal`) and nothing is
        brought in.

        The importing user becomes the change's author of record, so their own
        approval does not count towards the approvals the change needs.

        A form-encoded request is answered with a redirect to the change page
        instead of JSON.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                agreementConfirmed:
                  type: boolean
                  description: >
                    The caller confirms that the pull request's author has
                    agreed to the project's contributor agreement. Required
                    when the mirror sets `requireContributorAgreement`; recorded
                    in the audit log.
                headSha:
                  type: string
                  description: >
                    The pull request head the caller looked at. The import is
                    refused if the pull request has moved since.
      responses:
        "202":
          description: Imported; the change is being evaluated
          content:
            application/json:
              schema:
                type: object
                required: [change, externalPullRequest, evaluation]
                properties:
                  change: { $ref: "#/components/schemas/Change" }
                  externalPullRequest: { $ref: "#/components/schemas/ExternalPullRequest" }
                  evaluation:
                    type: object
                    properties:
                      runId: { type: string }
                      mode:
                        type: string
                        enum: [queued, inline]
                        description: >
                          `inline` means the evaluation has already run and
                          `change` carries its verdict.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The change is not `external` (`NOT_EXTERNAL`); the pull request has
            new commits (`PR_HEAD_MOVED`) or is no longer open against the
            default branch (`PR_NOT_OPEN`); or the mirror no longer accepts
            pull requests (`EXTERNAL_IMPORT_UNAVAILABLE`)
        "422":
          description: >
            The contributor agreement was not confirmed
            (`CONTRIBUTOR_AGREEMENT_REQUIRED`), or the pull request cannot be
            imported as it stands — `code` is one of `PR_TOO_MANY_COMMITS`,
            `PR_TOO_MANY_FILES`, `PR_TOO_LARGE`, `PR_UNRELATED_HISTORY`,
            `PR_CONFLICTS`, `PR_EMPTY`, `SUBMODULES_UNSUPPORTED`,
            `LFS_UNSUPPORTED`
        "502":
          description: GitHub could not be reached

  /api/changes/{id}/merge:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
    post:
      operationId: mergeChange
      tags: [changes]
      summary: Merge a change into its project
      description: |
        Users only. The change must be approved, accepted, or promoted (unless
        forcing, which the project policy must allow). Branch protection,
        stale-base (`requireFreshBase`), and stale-workspace (SEC-2) gates run
        before the merge. A change still `evaluating` is refused with `409`
        `EVALUATION_PENDING`, with or without force, and an `external` change
        with `409` `EXTERNAL_NOT_IMPORTED`. A change from a pull request that
        has commits newer than the ones imported is refused with `409`
        `PR_HEAD_MOVED`, also with or without force.

        A change that came from a pull request on the mirror keeps its commits
        when it merges; with `strategy=squash` the squash commit names their
        authors in `Co-authored-by` trailers.
      parameters:
        - name: force
          in: query
          schema: { type: boolean, default: false }
          description: Bypass evaluation/approval gates. Only allowed when the project policy sets `merge.allowForce`.
        - name: strategy
          in: query
          schema: { type: string, enum: [merge, squash], default: merge }
      responses:
        "200":
          description: Merged
          content:
            application/json:
              schema:
                type: object
                properties:
                  merged: { type: boolean }
                  changeId: { type: string }
                  project: { type: string }
                  workspace: { type: string }
                  commit: { type: string }
                  postMerge:
                    type: object
                    description: Post-merge policy check outcome
                    properties:
                      status: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Project access denied, or merge blocked by branch protection (code PROTECTION_BLOCKED with `reasons`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      reasons:
                        type: array
                        items: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Structured conflict responses; `code` is one of EVALUATION_PENDING,
            EVALUATION_MISSING (the evaluation failed closed and pinned no
            revision; refused even with force), STALE_BASE (under
            `merge.requireFreshBase`: the recorded base is behind the project
            head, or the change has no recorded base at all), STALE_WORKSPACE,
            WORKSPACE_UNVERIFIABLE, or MERGE_CONFLICT (which
            includes `conflictId` and `conflictingFiles` for
            `POST /api/projects/conflicts/{id}/resolve`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      baseSha: { type: string }
                      currentHead: { type: string }
                      evaluatedSha: { type: string }
                      currentTip: { type: string }
                      conflictId: { type: string }
                      conflictingFiles:
                        type: array
                        items: { type: string }
                      message: { type: string }
        "503":
          description: >
            Under `merge.requireFreshBase`, the project's current head could
            not be read, so the change's base could not be verified as fresh
            (code BASE_UNVERIFIABLE). Nothing was merged; try again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/changes/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
    post:
      operationId: rejectChange
      tags: [changes]
      summary: Reject a change
      description: Users only. Merged changes cannot be rejected.
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  rejected: { type: boolean }
                  changeId: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/changes/{id}/evaluate:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
    post:
      operationId: evaluateChange
      tags: [changes]
      summary: Re-run evaluation for a change
      description: |
        Users only. Merged, rejected, or promoted changes cannot be re-evaluated.
        An `external` change is refused with `409` `EXTERNAL_NOT_IMPORTED`:
        importing it is what starts its evaluation.

        With an evaluation queue bound this re-enqueues: the change moves to
        `evaluating` under a new run, which supersedes any run still in flight
        (its verdict is discarded), and the response is `202`. Re-evaluating a
        change stuck in `evaluating` is allowed and is the manual recovery.
        Without the queue, evaluation runs inline and the response is `200`.
      responses:
        "202":
          description: Evaluation queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvaluationQueued" }
        "200":
          description: Evaluation result, run inline (no evaluation queue bound, or sending to it failed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  changeId: { type: string }
                  eval: { $ref: "#/components/schemas/EvalResult" }
                  evalRuns:
                    type: array
                    items: { $ref: "#/components/schemas/EvalRun" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/changes/{id}/checks:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
    get:
      operationId: listChangeChecks
      tags: [changes]
      summary: List a change's check runs
      description: |
        Check runs are per-job CI results a project's runner reports back
        asynchronously. Returns the newest run of each check on the change's
        evaluated revision, which is the set `merge.requiredChecks` is checked
        against. Steps of first-party CI (`.stratum/ci.yaml`) are listed here
        under their step names; each is a required check without being named in
        `merge.requiredChecks`, unless the step is marked `optional`. Needs
        read access to the project.
      parameters:
        - name: all
          in: query
          required: false
          schema: { type: boolean }
          description: >
            Return every run instead — all revisions and all attempts, oldest
            first.
      responses:
        "200":
          description: The change's check runs
          content:
            application/json:
              schema:
                type: object
                required: [changeId, revision, checks]
                properties:
                  changeId: { type: string }
                  revision:
                    type: [string, "null"]
                    description: The change's evaluated head sha; null before its first evaluation
                  checks:
                    type: array
                    items: { $ref: "#/components/schemas/CheckRun" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/changes/{id}/checks/{checkId}/log:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
      - name: checkId
        in: path
        required: true
        schema: { type: string }
        description: Check run id of a first-party CI step
    get:
      operationId: getChangeCheckLog
      tags: [changes]
      summary: Read the log of a first-party CI step
      description: |
        The output of one step run by the instance's CI executor
        (`.stratum/ci.yaml`). Needs read access to the project: a log holds
        whatever the change's code printed. Stratum fetches it from the
        executor on each request; it is the URL a step's `detailsUrl` points
        at. Served as plain text that a browser will not render or sniff.
        Check runs reported by a project's own runner have no log here.
      responses:
        "200":
          description: The log so far (a running step's log grows)
          content:
            text/plain:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >
            No such change or check run on it (NOT_FOUND); the check is not a
            first-party CI step (CHECK_HAS_NO_LOG); or the executor holds no
            log for the run — not started yet, or expired (CHECK_LOG_NOT_FOUND).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The executor could not be reached or refused the request (CI_EXECUTOR_UNAVAILABLE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: This instance has no CI executor, or it is misconfigured; the message names the setting (CI_EXECUTOR_UNAVAILABLE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/changes/{id}/checks/{checkId}/rerun:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
      - name: checkId
        in: path
        required: true
        schema: { type: string }
        description: Check run id
    post:
      operationId: rerunChangeCheck
      tags: [changes]
      summary: Re-run one check on the revision it ran against
      description: |
        Users only, with write access to the project. Creates a new run of the
        same check on the SAME revision and dispatches it to the runner; the
        run named in the URL stops counting toward `merge.requiredChecks`. It
        does not pick up new commits — re-evaluate the change for that.
        Re-running a first-party CI step (`.stratum/ci.yaml`) re-runs the whole
        job, so every step of it gets a new run.
      responses:
        "202":
          description: The new run, queued and dispatched
          content:
            application/json:
              schema:
                type: object
                required: [check]
                properties:
                  check: { $ref: "#/components/schemas/CheckRun" }
        "302":
          description: Redirect back to the change page (HTML form posts only)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The re-run is refused: the change is still evaluating
            (EVALUATION_PENDING); the workspace or the change has moved to
            another revision (STALE_REVISION); a newer run of this check exists
            (CHECK_SUPERSEDED); the policy no longer declares the check
            (CHECK_NOT_DECLARED) or is invalid (POLICY_INVALID); or the change
            is merged, rejected or reverted (CONFLICT).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: >
            The new run was created but the runner could not be reached (code
            CHECK_DISPATCH_FAILED). `check` is the new run, already errored.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      check: { $ref: "#/components/schemas/CheckRun" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/checks/{checkRunId}:
    parameters:
      - name: checkRunId
        in: path
        required: true
        schema: { type: string }
        description: The check run id handed to the runner in the dispatch request's `checkRunIds`
    post:
      operationId: reportCheckRun
      tags: [changes]
      summary: Report a check run's progress or result (runner callback)
      description: |
        Called by a project's check runner, not by an API client. The request
        carries no bearer token and no session; it is authenticated by the
        `X-Stratum-Signature` header, the HMAC-SHA256 of the raw request body
        under the project secret named by the policy's `checks` entry. A run
        that is a step of first-party CI (`.stratum/ci.yaml`) is verified
        against the instance's executor secret instead, and only that: which
        key applies is decided by the run's own record, so neither key can
        report the other kind of run.

        A report can only move an existing run's status forward. It cannot
        create a check or change a run's name, change or revision. Terminal
        states (`passed`, `failed`, `errored`) are final.

        Safe to retry: a report whose `sequence` is not above the last one
        applied is acknowledged with `applied: false` and changes nothing.
      security: []
      parameters:
        - name: X-Stratum-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: "^sha256=[0-9a-f]{64}$"
          description: "`sha256=` followed by the hex HMAC-SHA256 of the raw request body"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckRunReport" }
      responses:
        "200":
          description: >
            The report was recorded (`applied: true`), or was a redelivered or
            out-of-order report that changed nothing (`applied: false`).
          content:
            application/json:
              schema:
                type: object
                required: [applied, check]
                properties:
                  applied: { type: boolean }
                  check: { $ref: "#/components/schemas/CheckRun" }
        "400":
          description: Signed, but not a valid report (code INVALID_REPORT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: >
            Missing or wrong signature, or no such check run (code
            INVALID_SIGNATURE). Deliberately the same response in every case, so
            the endpoint does not reveal which check run ids exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            The report cannot land: it names, or arrives for, a revision the
            change has moved on from (STALE_REVISION); a newer run replaced
            this one (CHECK_SUPERSEDED); the run already finished
            (CHECK_TERMINAL); or its deadline passed (CHECK_DEADLINE_EXCEEDED).
            `check` is the run's current state.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      check: { $ref: "#/components/schemas/CheckRun" }
        "413":
          description: The body is over 64 KB (code PAYLOAD_TOO_LARGE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limited; unauthenticated callers share the per-address anonymous budget
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/changes/{id}/github-pr:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
    post:
      operationId: promoteChangeToGitHubPr
      tags: [changes]
      summary: Promote an accepted change to a GitHub pull request
      description: |
        Users only. The change must be accepted (or already promoted), and the
        project must be authorized for its GitHub repository and be that
        repository's canonical project. Creates a (draft by default) PR from
        branch `stratum/{changeId}` and marks the change `promoted`.

        Two credentials are involved. The branch is always pushed with the
        instance's credential, described next. The PR itself is created with the
        promoting person's own GitHub authorization when they have connected
        their GitHub account, so that GitHub records them as its author, and
        with the instance's credential otherwise. Connecting does not
        guarantee it: the instance's credential is also used when the person's
        authorization has lapsed, is being renewed by another promotion at
        that moment, cannot be read, or is refused by GitHub for this
        repository. `github.openedAs` in the response says which was used,
        and `github.openedAsAppBecause` why.

        The instance's credential is the GitHub App's installation token when the project's
        owner is linked to the installation covering the repository (or an
        operator binding names that owner). Otherwise it is the instance
        `GITHUB_TOKEN`, and only under an operator binding. A refused
        credential means `403`. No App credential obtained (App not configured,
        not installed on the repository, or its installation lookup or token
        minting failed, which the server logs as a "GitHub App token
        unavailable" warning) and no `GITHUB_TOKEN` configured means
        `400 GITHUB_NOT_CONFIGURED`. A project
        that is not the repository's canonical project gets `409`.

        The PR base is always the project's own recorded default branch and is
        not accepted from the request body: the endpoint acts with a credential
        the instance holds, so honouring a caller-supplied base would let a
        caller aim it at a branch of its choosing.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                body: { type: string }
                draft: { type: boolean, default: true }
      responses:
        "200":
          description: PR created
          content:
            application/json:
              schema:
                type: object
                properties:
                  changeId: { type: string }
                  github:
                    type: object
                    properties:
                      owner: { type: string }
                      repo: { type: string }
                      branch: { type: string }
                      pullRequestNumber: { type: integer }
                      pullRequestUrl: { type: string }
                      pullRequestAuthor:
                        type: string
                        description: The PR author's GitHub login, as GitHub returned it.
                      openedAs:
                        type: string
                        enum: [user, app]
                        description: |
                          Who this call opened the PR as: the person promoting,
                          when they have connected their GitHub account, or the
                          app. Absent when the PR already existed.
                      openedAsAppBecause:
                        type: string
                        enum:
                          - not_connected
                          - connection_expired
                          - refresh_in_progress
                          - unavailable
                          - github_refused
                        description: |
                          Why the app opened the PR, on an instance where
                          accounts can be connected. The promotion succeeded.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            No project access, or no GitHub credential may act on the repository
            for the project's owner (`GITHUB_APP_NOT_AUTHORIZED`,
            `GITHUB_NOT_AUTHORIZED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `EVALUATION_PENDING` — a re-evaluation began while the branch was being
            pushed. The PR exists and its link is recorded (`github` carries it),
            but the change is not marked promoted; promote again once the
            evaluation finishes, which re-pushes to the same PR.
            Or `GITHUB_REPO_NOT_CANONICAL` — the repository is already connected
            to another Stratum project (no `github` field).
            Or `PUSH_MIRROR_ENABLED` — the project mirrors to GitHub, so its
            changes merge in Stratum and are not promoted (no `github` field).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      github:
                        type: object
                        properties:
                          owner: { type: string }
                          repo: { type: string }
                          branch: { type: string }
                          pullRequestNumber: { type: integer }
                          pullRequestUrl: { type: string }

  /api/changes/{id}/github-pr/ready:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
    post:
      operationId: markChangePullRequestReady
      tags: [changes]
      summary: Take a promoted change's GitHub pull request out of draft
      description: >-
        Users only, with write access to the project. Acts on the pull request
        the change was promoted to, always with the instance's GitHub
        credential and never with a person's connected GitHub account, whoever
        the pull request was opened as. A pull request that is already ready
        succeeds with `alreadyReady: true`.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The pull request is ready for review
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean }
                  changeId: { type: string }
                  alreadyReady: { type: boolean }
                  github:
                    type: object
                    properties:
                      owner: { type: string }
                      repo: { type: string }
                      prNumber: { type: integer }
                      url: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The change has no pull request (`NOT_PROMOTED`), or its pull request
            is closed on GitHub (`PULL_REQUEST_CLOSED`)
        "502":
          description: GitHub refused or could not be reached (`GITHUB_ERROR`)

  /api/changes/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
    post:
      operationId: addChangeComment
      tags: [reviews]
      summary: Add a comment to a change
      description: |
        Users and agents with read access to the project may comment.

        A comment can optionally be anchored to a diff line by passing `file`
        and `line` together (`side` and `commitSha` are only allowed with such
        an anchor). Passing `parentCommentId` posts a reply into an existing
        thread: the parent must belong to the same change, replies inherit the
        thread's anchor (anchor fields must be omitted), and replies to
        replies are flattened onto the thread root.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 20000 }
                file:
                  type: string
                  description: File path the comment is anchored to (requires line)
                line:
                  type: integer
                  minimum: 1
                  description: 1-based line number in the diff (requires file)
                side:
                  type: string
                  enum: [old, new]
                  description: Which half of the diff the line belongs to; only with file+line
                commitSha:
                  type: string
                  description: Commit the anchor was recorded against; only with file+line
                parentCommentId:
                  type: string
                  description: Thread root to reply to; mutually exclusive with anchor fields
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment: { $ref: "#/components/schemas/ChangeComment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listChangeComments
      tags: [reviews]
      summary: List comments on a change
      description: |
        Comments are returned in `createdAt` order and each carries its
        `parentCommentId` (plus any line anchor), so threads are
        reconstructable: roots in order, replies grouped under their root.
      security: [{ bearerAuth: [] }, {}]
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items: { $ref: "#/components/schemas/ChangeComment" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/changes/{id}/comments/{commentId}/resolve:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
      - name: commentId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: resolveChangeComment
      tags: [reviews]
      summary: Resolve a comment thread
      description: |
        Marks a thread-root comment resolved. Allowed for project writers or
        the comment's author. Replies cannot be resolved — only the thread
        root.
      responses:
        "200":
          description: Thread resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment: { $ref: "#/components/schemas/ChangeComment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/changes/{id}/comments/{commentId}/unresolve:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
      - name: commentId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: unresolveChangeComment
      tags: [reviews]
      summary: Reopen a resolved comment thread
      description: Same authorization rules as resolve.
      responses:
        "200":
          description: Thread reopened
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment: { $ref: "#/components/schemas/ChangeComment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/changes/{id}/reviews:
    parameters:
      - $ref: "#/components/parameters/ChangeId"
    post:
      operationId: submitReview
      tags: [reviews]
      summary: Submit a human review verdict
      description: |
        Users only — agent tokens cannot review. An `approve` verdict
        moves the change to `approved`; `request_changes` moves it to
        `needs_changes`. Only open, evaluating, needs_changes, accepted, or
        approved changes can be reviewed.

        While the change is `evaluating`, `approve` is refused (409
        EVALUATION_PENDING) and `request_changes` leaves the status to the
        evaluation — which then lands on `needs_changes` even if it passed. An
        approval is recorded only if the change is still exactly as the request
        loaded it (status, evaluation run, evaluated revision, base); otherwise
        409 and nothing is recorded.

        Approvals are made by a signed-in human: `approve` requires a browser
        session (or the legacy user key). A scoped API token or an OAuth grant
        (MCP clients, the CLI) gets `403 SESSION_REQUIRED` with an
        `approveUrl` to open instead. Those credentials can still submit
        `request_changes` and `comment`, which can only block.

        A `comment` verdict is a comment-only review: `comment` (the text) is
        required, the body is recorded in the change's discussion, the change
        status is untouched, and it never counts toward required approvals nor
        blocks a merge. It also never replaces an existing
        approve/request_changes verdict by the same reviewer — a verdict row
        with `comment` is only recorded when the reviewer has no verdict yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict]
              properties:
                verdict:
                  type: string
                  enum: [approve, request_changes, comment]
                comment: { type: string, maxLength: 20000 }
      responses:
        "201":
          description: Review recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  review: { $ref: "#/components/schemas/Review" }
                  changeStatus:
                    type: string
                    description: |
                      approved or needs_changes after an approve/request_changes
                      verdict (evaluating for a request_changes on an evaluating
                      change); the change's unchanged status after a comment
                      verdict.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            No write access, or `SESSION_REQUIRED`: an `approve` verdict from a
            scoped API token or OAuth grant. The body then carries
            `approveUrl`, the change page where a signed-in human approves.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      approveUrl: { type: string, example: /changes/chg_abc123 }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `code` is TARGET_DELETING (the project is being deleted),
            EVALUATION_PENDING (an `approve` while the change is evaluating), or
            REVIEW_STALE (the change moved on between loading it and recording
            the approval; nothing was recorded — reload and review again).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List reviews on a change
      security: [{ bearerAuth: [] }, {}]
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items: { $ref: "#/components/schemas/Review" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/workspaces/{namespace}/{slug}/workspaces:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a workspace (fork) for a project
      description: Requires project write access. Omitting `name` generates one (`ws-<timestamp>`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 1-64 char alphanumeric slug
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace: { type: string }
                  remote: { type: string }
                  namespace: { type: string }
                  slug: { type: string }
                  path: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetDeleting"
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List workspaces for a project
      security: [{ bearerAuth: [] }, {}]
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { type: string }
                  slug: { type: string }
                  path: { type: string }
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/workspaces/{namespace}/{slug}/workspaces/{name}/remote-credential:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: Workspace name
    post:
      operationId: mintWorkspaceRemoteCredential
      tags: [workspaces]
      summary: Mint a short-lived git credential for one workspace
      description: |
        Returns the workspace's smart-HTTP remote and a `stratum_git_` credential
        that works ONLY for `git-upload-pack` and `git-receive-pack` on this one
        workspace. It is refused on the project URL, on every other workspace,
        and on the whole API (including `/mcp`). It lasts `expiresInMinutes`
        (default and maximum 60), never past the calling credential's own
        expiry, and stops working at once if that credential is revoked. Backs
        the `stratum_workspace_remote` MCP tool.

        Requires a `read_write` API token, an `mcp:write` grant, an agent token
        or the legacy key; a read-only credential gets 403
        `TOKEN_SCOPE_INSUFFICIENT` and a browser session 403 `TOKEN_REQUIRED`.
        The caller must be able to push to the workspace (its creator or a
        project admin); every other refusal is a 404. At most 20 live
        credentials per user (409 `TOKEN_LIMIT_REACHED`). Audited as
        `workspace_remote.credential_minted`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInMinutes:
                  type: integer
                  minimum: 5
                  maximum: 60
                  default: 60
      responses:
        "201":
          description: "Credential minted. Sent with `Cache-Control: no-store`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  remote: { type: string, description: "Smart-HTTP URL of the workspace" }
                  username: { type: string, description: "Any username works; this is a suggestion" }
                  token: { type: string, description: "The secret. Returned once, never stored in plaintext" }
                  expiresAt: { type: string, format: date-time }
                  credentialId: { type: string }
                  project: { type: string }
                  workspace: { type: string }
                  allows:
                    type: array
                    items: { type: string, enum: [git-upload-pack, git-receive-pack] }
                  branches:
                    type: array
                    items: { type: string }
                    description: Branches a push may update (tags are also allowed)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Too many live credentials, or the project is being deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/workspaces/{name}/commit:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: Workspace name (scoped by projectId in the body)
    post:
      operationId: commitToWorkspace
      tags: [workspaces]
      summary: Commit files to a workspace
      description: |
        Writes the given file map onto the workspace fork as one commit. Bounded
        to 2000 files / 25 MiB per commit. Requires project write access AND
        workspace write access (creator or admin); failures return 404 to avoid
        leaking existence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files, message, projectId]
              properties:
                files:
                  type: object
                  additionalProperties: { type: string }
                  description: Path -> contents map
                message: { type: string }
                projectId: { type: string, format: uuid }
      responses:
        "200":
          description: Commit pushed
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace: { type: string }
                  commit: { type: string, description: Commit SHA }
                  filesChanged:
                    type: array
                    items: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/workspaces/{name}/merge:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: mergeWorkspaceDeprecated
      tags: [workspaces]
      summary: Deprecated workspace merge endpoint
      deprecated: true
      responses:
        "410":
          description: 'Gone — use POST /api/projects/{name}/changes instead'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/workspaces/{name}:
    parameters:
      - name: name
