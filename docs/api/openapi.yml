openapi: 3.1.0
info:
  title: Stratum API
  description: |
    The open-source, agent-first code forge: git hosting where every change, human or
    agent, proves itself through evaluation gates before it merges.

    This specification is generated from the route code (`src/index.ts` and
    `src/routes/*.ts`) and covers every `/api/*` route, the root health check,
    the GitHub webhook receiver, and the SCIM 2.0 provisioning endpoints under
    `/scim/v2`.

    Also covered: the remote MCP endpoint (`/mcp`) and the OAuth 2.1
    authorization server that fronts it (`/oauth/*` and its `.well-known`
    discovery documents), which sit outside `/api/*` but are the surface an MCP
    client speaks to.

    Not covered here:
    - HTML page routes (`/`, `/p/*`, `/changes/*`, `/auth/*` — including the
      SSO sign-in flow at `/auth/sso/*` — `/dev-login`, `/ui.css`, ...).
    - `GET|POST /oauth/authorize`, which renders and processes an HTML consent
      screen rather than serving JSON.
    - The git smart-HTTP endpoints (`/@{namespace}/{slug}/info/refs`,
      `git-upload-pack`, `git-receive-pack`) — documented separately in
      `docs/adr/005`.

    Second factor: browser sign-in may require a passkey (WebAuthn) after the
    primary factor; that HTML flow lives at `/auth/2fa` and is not covered
    here. An org that requires a second factor answers requests for ITS OWN
    projects and `/api/orgs/{slug}/*` endpoints with `403 SECOND_FACTOR_REQUIRED`
    when the session has not passed one; nothing else is affected.
    API tokens, the legacy key, agent tokens and OAuth grants are never asked
    for one, but they are held to the same policy by how the session that
    created them had signed in, which each credential records. One created
    without a second factor (or this org's SSO) gets the same
    `403 SECOND_FACTOR_REQUIRED` on that org's resources, and keeps the rest
    of its access; creating it again from a session that meets the policy
    restores it. What is withheld, for a session or a credential, is the
    access that membership grants. Three things stay open: reading the org's
    PUBLIC projects, which need no membership; reading the policy
    (`GET /api/orgs/{slug}/security`); and leaving the org. The policy also
    applies when a credential is minted: a session that has not met it gets
    `403 SECOND_FACTOR_REQUIRED` from token creation (unless the token is
    bound to a target outside the policy org), agent creation and legacy-key
    rotation. OAuth consent is a browser page and answers differently:
    `/oauth/authorize` renders an HTML explanation with status `400` and
    issues no code.

    Authentication: most endpoints accept a Stratum API token (user or agent)
    as a `Authorization: Bearer <token>` header. Browser requests may instead be
    authenticated by the `stratum_session` cookie. Read endpoints on projects
    with `visibility: public` also accept anonymous requests. Admin endpoints
    additionally accept an `X-Admin-API-Key` header. The `/scim/v2` endpoints
    accept only a per-connection SCIM bearer token (`stratum_scim_*`) and no
    other credential.

    MCP OAuth grants (`stratum_mcp_...`) authenticate like any user token and
    obey the same scopes — `mcp:write` maps to `read_write`, anything else to
    `read` — with two extra refusals: they cannot reach `/api/admin/*` and
    cannot rotate the legacy key.

    Token scopes: a user token carries either `read` or `read_write`. A `read`
    token is refused, before routing, on anything that is not a GET or HEAD —
    `403` with code `TOKEN_SCOPE_INSUFFICIENT` — so every non-GET/HEAD endpoint
    below can return it. Sessions and agent tokens are unaffected. Token
    management (`/api/users/me/tokens*`) is session-only.

    Token binding: a user token may also be bound to one project or one
    organization. A bound token reaches only `/api/projects/...`,
    `/api/changes/...`, `/api/workspaces/...`, `/api/deployments/...`,
    `GET /api/users/me`, the health checks, `/mcp` and git; every other
    endpoint answers `403`
    with code `TOKEN_BINDING_EXCLUDES_ROUTE` before routing. Within those, a
    project outside the binding answers exactly as a missing private project
    does (usually `404`).

    Several form-friendly endpoints return a `302` redirect instead of JSON when
    the request body is form-encoded rather than `application/json`; this spec
    documents the JSON behaviour.
  version: 0.2.0

servers:
  - url: https://your-instance.workers.dev
    description: Production

security:
  - bearerAuth: []

tags:
  - name: health
    description: Liveness and dependency health checks
  - name: projects
    description: Project creation, metadata, files, and history
  - name: imports
    description: Importing repositories from GitHub/GitLab/Bitbucket
  - name: sync
    description: Keeping imported projects in sync with their source repository
  - name: mirror
    description: Push mirror — a read-only, fast-forward-only copy of a project on GitHub
  - name: workspaces
    description: Workspace (fork) lifecycle and commits
  - name: changes
    description: Changes (evaluated merge proposals) and merge operations
  - name: reviews
    description: Human review verdicts and comments on changes
  - name: issues
    description: Project issues
  - name: webhooks
    description: Outbound project webhooks
  - name: deployments
    description: Post-merge deployments and the per-project deploy secret store
  - name: orgs
    description: Organizations, members, and teams
  - name: sso
    description: Per-org OIDC SSO connection administration (org admins/owners; 501 without SSO_ENCRYPTION_SECRET)
  - name: scim
    description: SCIM 2.0 Users provisioning (SCIM bearer token only)
  - name: users
    description: The authenticated user's account
  - name: agents
    description: Agent registration and tokens
  - name: bulk-import
    description: Importing many repositories at once
  - name: github
    description: Inbound GitHub webhook receiver, and linking GitHub App installations to Stratum owners
  - name: mcp
    description: The remote MCP server and its OAuth 2.1 authorization server
  - name: admin
    description: Administrator-only operations (metrics, audit, backup, restore, deletion jobs)

paths:
  /health:
    get:
      operationId: rootHealth
      tags: [health]
      summary: Basic health check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: stratum }

  /api/health:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Comprehensive health check of all system dependencies
      security: []
      responses:
        "200":
          description: Healthy or degraded (queue-only failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"
        "503":
          description: Unhealthy — a critical dependency (database, KV, artifacts) failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"

  /api/health/simple:
    get:
      operationId: healthSimple
      tags: [health]
      summary: Simple liveness check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: stratum }
                  timestamp: { type: string, format: date-time }

  /api/projects:
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      description: |
        Creates a project (and its backing Artifacts git repo) in the caller's
        namespace, or in an organization's namespace when `org` is given (the
        caller needs org write access). Also accepts form-encoded bodies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: 1-64 char alphanumeric slug
                visibility:
                  type: string
                  enum: [private, public]
                  default: private
                files:
                  type: object
                  additionalProperties: { type: string }
                  description: Initial file map (path -> contents). Defaults to a single `.gitkeep`, or starter files when `seed` is true.
                seed:
                  type: boolean
                  description: Seed the repo with default starter files
                org:
                  type: string
                  description: Organization slug to own the project
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                type: object
                required: [id, name, namespace, slug]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  namespace: { type: string }
                  slug: { type: string }
                  path: { type: string }
                  remote: { type: string }
                  commit:
                    type: string
                    description: SHA of the initial commit
                  visibility: { type: string, enum: [private, public] }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Organization not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects in the caller's namespace
      description: Returns an empty list for unauthenticated callers. Results are filtered to projects the caller can read.
      responses:
        "200":
          description: Projects the caller can read
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      security: [{ bearerAuth: [] }, {}]
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete project (owner-only, cascading, async)
      description: |
        Owner-only. Requires a confirm token that EXACTLY equals
        `@namespace/slug`. Enqueues a durable deletion job; a repeated request
        while a cascade is in flight returns the same in-flight job.
        Non-owners receive a 404 (existence is not disclosed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  description: Must exactly equal "@namespace/slug".
      responses:
        "202":
          description: Deletion enqueued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionAccepted" }
        "400":
          description: Confirmation mismatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found or not the owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/delete:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: deleteProjectForm
      tags: [projects]
      summary: Delete project (form-friendly alias of DELETE)
      description: Same semantics as `DELETE /api/projects/{namespace}/{slug}` for HTML forms that cannot send DELETE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string }
      responses:
        "202":
          description: Deletion enqueued (JSON callers)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionAccepted" }
        "302":
          description: Redirect to home (form callers)
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{namespace}/{slug}/import:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: importProject
      tags: [imports]
      summary: Import a repository from GitHub/GitLab/Bitbucket
      description: |
        Creates the project and queues a background import. Rate limited
        (3 imports/minute per user, 1 concurrent import per project). The
        target namespace is the caller's own, or an organization's where the
        caller has write access (the project is then owned by the
        organization); anything else is a 403. If the project already exists
        with an incomplete import, the import is re-triggered and a 200 is
        returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  description: Repository URL (GitHub, GitLab, or Bitbucket)
                branch:
                  type: string
                  default: main
                depth:
                  type: integer
                  description: Clone depth
                visibility:
                  type: string
                  enum: [private, public]
                  default: private
      responses:
        "201":
          description: Import queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { type: string }
                  slug: { type: string }
                  importId: { type: string }
                  path: { type: string }
                  status: { type: string, example: queued }
                  source: { type: string }
                  visibility: { type: string, enum: [private, public] }
        "200":
          description: Project already exists (incomplete imports are re-triggered)
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { type: string }
                  slug: { type: string }
                  remote: { type: string }
                  source: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Import rate limit exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/import/status:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getImportStatus
      tags: [imports]
      summary: Get import progress (for polling)
      description: Also detects and recovers imports stalled for more than 5 minutes.
      responses:
        "200":
          description: Import progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportProgress" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/import/stream:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: streamImportStatus
      tags: [imports]
      summary: Import progress as Server-Sent Events
      description: Emits an `ImportProgress` JSON object as an SSE `data:` line every 2 seconds until the import completes, fails, or is cancelled.
      responses:
        "200":
          description: SSE stream of import progress
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{namespace}/{slug}/import/retry:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: retryImport
      tags: [imports]
      summary: Retry a failed import
      description: Rate limited like the initial import. Only allowed in the caller's own namespace.
      responses:
        "200":
          description: Retry initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  namespace: { type: string }
                  slug: { type: string }
                  status: { type: string, example: queued }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/import/cancel:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: cancelImport
      tags: [imports]
      summary: Cancel an ongoing import
      responses:
        "200":
          description: Cancellation requested or completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  namespace: { type: string }
                  slug: { type: string }
                  status: { type: string, enum: [cancelled, cancelling] }
        "400":
          description: Import is not in a cancellable state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/files:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: listProjectFiles
      tags: [projects]
      summary: List files in the project repository
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - $ref: "#/components/parameters/Ref"
      responses:
        "200":
          description: File listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { type: string }
                  slug: { type: string }
                  path: { type: string }
                  ref:
                    type: string
                    description: The branch actually read
                  files:
                    type: array
                    items: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/content:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getFileContent
      tags: [projects]
      summary: Get file content by path
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: File path within the repository
        - $ref: "#/components/parameters/Ref"
      responses:
        "200":
          description: File content, or a marker for binary/oversized files
          content:
            application/json:
              schema:
                type: object
                required: [namespace, slug, path, kind]
                properties:
                  namespace: { type: string }
                  slug: { type: string }
                  path: { type: string }
                  ref:
                    type: string
                    description: The branch actually read
                  kind:
                    type: string
                    description: '"content" when `value` carries the text; other kinds (e.g. binary/too-large) omit `value`.'
                  value:
                    type: string
                    description: Present only when kind is "content"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/log:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getCommitLog
      tags: [projects]
      summary: Get the project's commit log
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - name: depth
          in: query
          schema: { type: integer, default: 20 }
          description: Number of commits to return
        - $ref: "#/components/parameters/Ref"
      responses:
        "200":
          description: Commit log
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { type: string }
                  slug: { type: string }
                  path: { type: string }
                  ref:
                    type: string
                    description: The branch actually read
                  log:
                    type: array
                    items: { $ref: "#/components/schemas/CommitLogEntry" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/tags:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: listProjectTags
      tags: [projects]
      summary: List the repository's tags
      description: >
        Tag names come from the remote's ref advertisement, so a listing
        normally does not clone the repository. A tag whose details are not
        stored yet is read by cloning, and remembered unless it could not be
        resolved or its details come to more than 64 KB once stored (in
        practice, a very long message).
        Capped at 200, keeping the highest-sorting names; `truncated` reports
        when the list was cut.
      security: [{ bearerAuth: [] }, {}]
      responses:
        "200":
          description: Tag listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { type: string }
                  slug: { type: string }
                  path: { type: string }
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        oid:
                          type: string
                          description: The tag object for an annotated tag, the target for a lightweight one.
                        targetSha:
                          type: [string, "null"]
                          description: The commit the tag resolves to, or null when it could not be determined.
                        annotated: { type: boolean }
                        message: { type: string }
                        tagger: { type: string }
                        timestamp:
                          type: integer
                          description: Tagger time in epoch seconds.
                        unresolvable: { type: boolean }
                  truncated: { type: boolean }
                  totalTagCount: { type: integer }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/projects/{namespace}/{slug}/branches:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: listProjectBranches
      tags: [projects]
      summary: List the repository's branches
      description: >
        Reads the remote's ref advertisement, so the cost does not grow with the
        number of branches. Capped at 200; `truncated` reports when the list was
        cut, and the default branch is always retained.
      security: [{ bearerAuth: [] }, {}]
      responses:
        "200":
          description: Branch listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { type: string }
                  slug: { type: string }
                  path: { type: string }
                  defaultBranch: { type: string }
                  branches:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        oid: { type: string }
                  truncated: { type: boolean }
                  totalBranchCount: { type: integer }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createProjectBranch
      tags: [projects]
      summary: Create a branch
      description: >
        Creates `refs/heads/{name}` pointing at an object the repository already
        contains. The start point may be a branch name or a full 40-character
        commit sha; short shas and tag names are refused. Because the ref can
        only be aimed at an existing object, this cannot introduce unevaluated
        content and does not bypass the change gate. Writers only.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                startPoint:
                  type: string
                  description: >
                    Branch name or full 40-hex commit sha. Defaults to the default
                    branch's tip. Tag names are rejected: a tag can point at a
                    non-commit, and one may sit outside the history a backup captures.
      responses:
        "201":
          description: Branch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { type: string }
                  slug: { type: string }
                  branch:
                    type: object
                    properties:
                      name: { type: string }
                      oid: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The branch already exists (`BRANCH_EXISTS`); the name collides with
            an existing ref path, such as `release` when `release/2.x` exists
            (`BRANCH_NAME_CONFLICT`); the configured default branch is not
            advertised by the remote, so there is no start point to default to
            (`NO_DEFAULT_BRANCH`); or the project is being deleted
            (`TARGET_DELETING`)
        "413":
          description: Request body too large
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/branches/{name}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: >
          Branch name. May contain slashes (`release/2.x`), passed as real path
          segments. A percent-encoded slash (`%2F`) is accepted too and names the
          same branch — each path segment is decoded individually.
    delete:
      operationId: deleteProjectBranch
      tags: [projects]
      summary: Delete a branch
      description: Writers only. The project's default branch cannot be deleted.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Branch deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { type: string }
                  slug: { type: string }
                  deleted: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The branch is the default branch (`DEFAULT_BRANCH_PROTECTED`), or the project is being deleted (`TARGET_DELETING`)
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/provenance:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: listProvenance
      tags: [projects]
      summary: List provenance records (which agent/model produced each merged commit)
      security: [{ bearerAuth: [] }, {}]
