                  type: string
                  description: |
                    "*" (default) or a comma-separated subset of:
                    change.created, change.evaluated, change.merged,
                    change.rejected, change.reverted, change.commented,
                    change.reviewed, project.created, project.imported,
                    workspace.created, sync.completed, issue.opened,
                    issue.commented, issue.closed, deployment.requested,
                    deployment.succeeded, deployment.failed, mirror.diverged,
                    mirror.failed, branch.resynced
      responses:
        "201":
          description: Webhook created (includes the secret, shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
