    delete:
      operationId: deleteAccount
      tags: [users]
      summary: Delete account (GDPR erasure, self-only, async)
      description: |
        Requires a confirm token equal to the caller's username. Marks the
        account as deleting (credentials are invalidated immediately) and
        enqueues the erasure cascade job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  description: Must exactly equal the caller's username.
      responses:
        "202":
          description: Erasure enqueued (jobId returned); credentials invalidated immediately
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionAccepted" }
        "400":
          description: Confirmation mismatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not authenticated, or the user no longer exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/usage:
    get:
      operationId: getMyUsage
      tags: [users]
      summary: Get the caller's metered usage for the current period
      description: |
        Read-only, and deliberately the only billing surface a token can reach:
        nothing here raises a limit, buys capacity, or attaches a payment method.

        An **agent token** reports its OWNER's allowance, because that is the
        account its evaluations are charged to.

        `used` counts platform-billed consumption only. Spend on a project's own
        provider key is reported separately in `byok` and never counted against
        an allowance. On an instance with no billing service configured — every
        self-hosted deployment — `metered` is `false` and every limit is `-1`.

        A limit of `-1` is unlimited and `0` is a plan that forbids the meter
        outright, so render words rather than computing a percentage against
        either; `percentUsed` and `remaining` are `null` in both cases.
      responses:
        "200":
          description: Usage for the current billing period
          content:
            application/json:
              schema:
                type: object
                required:
                  [subject, usedSource, plan, metered, period, resetsAt, meters, rates]
                properties:
                  subject:
                    type: object
                    description: Whose allowance this is — the enforcement subject.
                    required: [ownerId, ownerType]
                    properties:
                      ownerId: { type: string }
                      ownerType: { type: string, enum: [user, org] }
                  usedSource:
                    type: string
                    enum: [meter, ledger]
                    description: |
                      `meter` is the live enforcement counter a limit is compared
                      against. `ledger` is the recorded aggregate alone — every
                      self-hoster, and any instance whose meter binding is
                      missing or unreadable — which omits work done in an org
                      namespace, where the org is the recorded owner.
                  plan:
                    type: string
                    description: Opaque plan name; `unlimited` when there is none.
                  metered:
                    type: boolean
                    description: Whether any allowance is in force at all.
                  period: { type: string, description: "'YYYY-MM' UTC." }
                  resetsAt:
                    type: string
                    format: date-time
                    description: When the monthly meters roll over.
                  meters:
                    type: array
                    items:
                      type: object
                      required:
                        [meter, used, byok, limit, unlimited, blocked, percentUsed, remaining]
                      properties:
                        meter:
                          type: string
                          enum: [llm_tokens_month, sandbox_ms_month, deploys_month]
                        used:
                          type: integer
                          description: Platform-billed consumption — the only kind a limit binds.
                        byok:
                          type: integer
                          description: Spend on a project's own provider key; never counted against the limit.
                        limit: { type: integer, description: "`-1` unlimited, `0` a hard block." }
                        unlimited: { type: boolean }
                        blocked: { type: boolean }
                        percentUsed:
                          type: number
                          nullable: true
                          description: Null when there is no finite limit.
                        remaining:
                          type: integer
                          nullable: true
                          description: Floored at zero; null when unlimited.
                  rates:
                    type: array
                    description: Burst ceilings. Reported as a limit only.
                    items:
                      type: object
                      required: [rate, limit, unlimited]
                      properties:
                        rate: { type: string, enum: [evaluations_per_hour] }
                        limit: { type: integer }
                        unlimited: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/rotate-token:
    post:
      operationId: rotateToken
      tags: [users]
      summary: Rotate the caller's API token
      description: >
        The old token is invalid as of this response; the new one is shown once.
        This rotates the single legacy `users.token_hash` credential, not a named
        API token — prefer `POST /api/users/me/tokens`.


        Callable with a browser session or the legacy credential itself. A
        SCOPED API token is refused with `SESSION_REQUIRED`: the key this mints
        never expires and cannot be revoked individually, so a scoped token able
        to rotate it would outlive its own revocation.
      responses:
        "200":
          description: New API token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenScopeInsufficient"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/tokens:
    get:
      operationId: listApiTokens
      tags: [users]
      summary: List the caller's API tokens
      description: >
        Never returns a token hash or plaintext — only the non-secret prefix,
        which is enough to recognise a credential already deployed somewhere.
        Requires a browser session; an API token is refused with SESSION_REQUIRED.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The caller's tokens, newest first
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: { $ref: "#/components/schemas/ApiToken" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SessionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createApiToken
      tags: [users]
      summary: Mint a named API token
      description: >
        The plaintext is returned exactly once, in this response, and is never
        stored — only its hash is. The response carries `Cache-Control: no-store`.
        Requires a browser session; an API token is refused with SESSION_REQUIRED,
        so a token can never mint another.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: A label. Not unique; uniqueness is on the hash.
                scope:
                  type: string
                  enum: [read, read_write]
                  default: read
                  description: >
                    `read` permits GET/HEAD and `git clone`/`fetch` only; every
                    other method is refused with TOKEN_SCOPE_INSUFFICIENT.
                expiresInDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                  description: Omit for a token that never expires.
      responses:
        "201":
          description: The token, plus its plaintext (shown only here)
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `no-store`
          content:
            application/json:
              schema:
                type: object
                required: [token, plaintext]
                properties:
                  token: { $ref: "#/components/schemas/ApiToken" }
                  plaintext:
                    type: string
                    description: The `stratum_user_…` credential. Shown once, never again.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SessionRequired"
        "409":
          description: >
            The caller already holds the maximum of 20 active tokens
            (code TOKEN_LIMIT_REACHED). Revoked tokens do not count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/tokens/{id}:
    delete:
      operationId: revokeApiToken
      tags: [users]
      summary: Revoke one of the caller's API tokens
      description: >
        A soft revoke: the row is kept for the audit trail and stops
        authenticating immediately. Scoped by owner, so another user's token id
        is indistinguishable from one that does not exist. Requires a browser
        session.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Token id
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SessionRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/legacy-token/disable:
    post:
      operationId: disableLegacyToken
      tags: [users]
      summary: Disable the legacy (pre-scopes) API token
      description: >
        Rotates `users.token_hash` to a value that is never returned to anyone,
        making the single unnamed, never-expiring credential minted by
        `POST /api/users/me/rotate-token` permanently unusable. Named API tokens
        are unaffected. Requires a browser session.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The legacy token no longer authenticates
          content:
            application/json:
              schema:
                type: object
                required: [disabled]
                properties:
                  disabled: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SessionRequired"
        "500":
          $ref: "#/components/responses/InternalError"

