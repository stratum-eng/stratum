      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete (revoke) an agent
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  id: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/bulk-import:
    post:
      operationId: startBulkImport
      tags: [bulk-import]
      summary: Start a bulk import job (up to 50 repositories)
      description: Imports run in the background; poll `GET /api/bulk-import/{id}` for status. Only the caller's own namespace is allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repos]
              properties:
                repos:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [url]
                    properties:
                      url: { type: string }
                      namespace: { type: string }
                      slug: { type: string }
                      branch: { type: string }
                      visibility:
                        type: string
                        enum: [private, public]
      responses:
        "201":
          description: Job started
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string }
                  status: { type: string, example: queued }
                  totalRepos: { type: integer }
                  message: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The private repositories in the batch would take the account past its
            private-project limit. The whole batch is refused and nothing is
            imported. Public repositories and projects that already exist do not
            count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: listBulkImportJobs
      tags: [bulk-import]
