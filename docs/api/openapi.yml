  /api/bulk-import:
    post:
      operationId: startBulkImport
      tags: [bulk-import]
      summary: Start a bulk import job (up to 50 repositories)
      description: Imports run in the background; poll `GET /api/bulk-import/{id}` for status. Only the caller's own namespace is allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repos]
              properties:
                repos:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [url]
                    properties:
                      url: { type: string }
                      namespace: { type: string }
                      slug: { type: string }
                      branch: { type: string }
                      visibility:
                        type: string
                        enum: [private, public]
      responses:
        "201":
          description: Job started
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string }
                  status: { type: string, example: queued }
                  totalRepos: { type: integer }
                  message: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      operationId: listBulkImportJobs
      tags: [bulk-import]
      summary: List the caller's bulk import jobs
      responses:
        "200":
          description: Jobs, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/BulkImportJobSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/bulk-import/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getBulkImportJob
      tags: [bulk-import]
      summary: Get bulk import job status
      responses:
        "200":
          description: Job status with progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkImportJobStatus" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/webhooks/github:
    post:
      operationId: receiveGitHubWebhook
      tags: [github]
      summary: GitHub webhook receiver
      description: |
        Inbound receiver for GitHub `push`, `pull_request`,
        `pull_request_review`, and `ping` events. Authenticated by HMAC
        signature (`X-Hub-Signature-256`) against the configured webhook
        secret, not by bearer token. Requires `X-GitHub-Event` and
        `X-GitHub-Delivery` headers; duplicate delivery ids are skipped.
        Processing errors still return 200 to prevent GitHub retries.
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: { type: string }
        - name: X-GitHub-Event
          in: header
          required: true
          schema: { type: string }
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw GitHub webhook payload for the event type
      responses:
        "200":
          description: Received (possibly a duplicate, or with a logged processing error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  duplicate: { type: boolean }
                  error: { type: string }
        "400":
          description: Missing headers or invalid JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: Webhook secret not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

