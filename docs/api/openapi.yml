          description: Filter to one organization's rows, by org id
        - $ref: "#/components/parameters/AuditSince"
        - $ref: "#/components/parameters/AuditUntil"
        - $ref: "#/components/parameters/AuditCursor"
        - $ref: "#/components/parameters/AuditLimit"
      responses:
        "200":
          description: One page of audit entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/backup:
    get:
      operationId: adminListBackups
      tags: [admin]
      summary: List backup runs (newest first)
      security:
        - bearerAuth: []
        - adminApiKey: []
      responses:
        "200":
          description: Backup runs, each flagged complete/incomplete
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: { type: object }
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: adminRunBackup
      tags: [admin]
      summary: Trigger a backup run now (single-flight)
      security:
        - bearerAuth: []
        - adminApiKey: []
      responses:
        "200":
          description: Backup summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary: { type: object }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A backup run is already in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/restore/{runTs}/repos/{projectId}:
    parameters:
      - name: runTs
        in: path
        required: true
        schema: { type: string }
        description: Backup run timestamp identifier
      - name: projectId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: adminRestoreRepo
      tags: [admin]
      summary: Restore one project's repository from a backup run, or drill it
      description: |
        With `drill`, restores to a generated scratch repository, verifies it and
        deletes it, without touching the project's repository. Otherwise restores
        to the project's own repository, and needs `force` if it exists. Restores
        the Git repository only. Check `verification.ok` even on a `200`.
      security:
        - bearerAuth: []
        - adminApiKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Overwrite the project's existing repository. Cannot be combined with `drill`.
                drill: { type: boolean }
      responses:
        "200":
          description: The restore ran. `verification` says whether the refs match the backup.
          content:
            application/json:
              schema:
                type: object
                required: [restore]
                properties:
                  restore:
                    type: object
                    required: [runTs, projectId, mode, verification]
                    properties:
                      runTs: { type: string }
                      projectId: { type: string }
                      mode: { type: string, enum: [drill, restore] }
                      repoName:
                        type: string
                        description: Drill only. The scratch repository.
                      tipSha: { type: string, description: "Absent for a tag-only snapshot" }
                      verification:
                        type: object
                        required: [ok, checked, mismatches]
                        properties:
                          ok: { type: boolean }
                          checked: { type: integer }
                          mismatches: { type: array, items: { type: string } }
                          error: { type: string, description: "The refs could not be read" }
                      scratchDeleted:
                        type: boolean
                        description: Drill only. False means the scratch repository still exists.
                      branchesTruncatedTotal:
                        type: integer
                        description: The backup held only some branches; this many existed.
        "400":
          description: Invalid run, project id or body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The run did not complete, or holds no pack for this project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The project's repository exists and `force` was not set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          description: The push timed out and may still land. The outcome is unknown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/admin/restore/{runTs}/plan:
    parameters:
      - name: runTs
        in: path
        required: true
        schema: { type: string }
        description: Backup run timestamp identifier
    get:
      operationId: adminRestorePlan
      tags: [admin]
      summary: Dry-run restorability check for a backup run
      description: Reads and decrypts every blob in the run and verifies it against the manifest. Read-only.
      security:
        - bearerAuth: []
        - adminApiKey: []
      responses:
        "200":
          description: Restore plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan: { type: object }
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/deletion-jobs/{id}/redrive:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: adminRedriveDeletionJob
      tags: [admin]
      summary: Re-drive an incomplete deletion job
      description: Resets the attempt budget and drives the job once; idempotent.
      security:
        - bearerAuth: []
        - adminApiKey: []
      responses:
        "200":
          description: Job re-driven
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: { $ref: "#/components/schemas/DeletionJob" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Deletion job is not in the incomplete state (code NOT_REDRIVABLE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/backfill-project-id/plan:
    get:
      operationId: adminBackfillPlan
      tags: [admin]
      summary: Dry-run plan for backfilling legacy project_id columns
      description: Reports how much legacy (NULL project_id) data exists per table and which project names are safe to backfill. Read-only.
      security:
        - bearerAuth: []
        - adminApiKey: []
      responses:
        "200":
          description: Backfill plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan: { type: object }
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /scim/v2/ServiceProviderConfig:
    get:
      operationId: scimServiceProviderConfig
      tags: [scim]
      summary: SCIM service provider configuration
      security:
        - scimBearer: []
      responses:
        "200":
          description: Supported SCIM features (PATCH supported; bulk, filter beyond eq, sort, and etags not)
          content:
            application/scim+json:
              schema: { type: object }
        "401":
          $ref: "#/components/responses/ScimUnauthorized"

  /scim/v2/ResourceTypes:
    get:
      operationId: scimResourceTypes
      tags: [scim]
      summary: SCIM resource types (Users only; no Groups)
      security:
        - scimBearer: []
      responses:
        "200":
          description: Resource type list
          content:
            application/scim+json:
              schema: { type: object }
        "401":
          $ref: "#/components/responses/ScimUnauthorized"

  /scim/v2/Schemas:
    get:
      operationId: scimSchemas
      tags: [scim]
      summary: SCIM schemas (core User only)
      security:
        - scimBearer: []
      responses:
        "200":
          description: Schema list
          content:
            application/scim+json:
              schema: { type: object }
        "401":
          $ref: "#/components/responses/ScimUnauthorized"

  /scim/v2/Users:
    get:
      operationId: scimListUsers
      tags: [scim]
      summary: List users in the connection's scope
      security:
        - scimBearer: []
      parameters:
        - name: filter
          in: query
          schema: { type: string }
          description: Only `userName eq "..."` and `externalId eq "..."` are supported; any other filter answers 501
        - name: startIndex
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: 1-based start index
        - name: count
          in: query
          schema: { type: integer, minimum: 0, maximum: 200, default: 100 }
          description: Page size; 0 returns totalResults with no Resources
      responses:
        "200":
          description: SCIM ListResponse of Users
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimUserList" }
        "401":
          $ref: "#/components/responses/ScimUnauthorized"
        "501":
          description: Unsupported filter expression
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimError" }
    post:
      operationId: scimCreateUser
      tags: [scim]
      summary: Provision a user
      description: |
        `userName` must be an email within the connection's verified domains.
        If an account with that email already exists (and is not being
        deleted), it is adopted into the connection's scope; otherwise a new
        account is created and added to the org as a member. Either way the
        answer is 201 with a `Location` header (RFC 7644 §3.3). A retried POST
        for a user this connection already manages converges on the requested
        `externalId`/`active` instead of failing; only a different stored
        `externalId` is a 409.
      security:
        - scimBearer: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
              required: [userName]
              properties:
                userName: { type: string, description: Email address within the connection's verified domains }
                externalId: { type: string }
                active: { type: boolean, default: true }
      responses:
        "201":
          description: User created or existing account adopted
          headers:
            Location:
              schema: { type: string }
              description: Canonical URI of the user resource
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimUser" }
        "400":
          description: Invalid attribute (SCIM error body)
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimError" }
        "401":
          $ref: "#/components/responses/ScimUnauthorized"
        "409":
          description: Conflicting account, already-provisioned user, or duplicate externalId
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimError" }

  /scim/v2/Users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Stratum user id
    get:
      operationId: scimGetUser
      tags: [scim]
      summary: Get a user
      security:
        - scimBearer: []
      responses:
        "200":
          description: User (`active` reflects the enforced account state)
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimUser" }
        "401":
          $ref: "#/components/responses/ScimUnauthorized"
        "404":
          $ref: "#/components/responses/ScimNotFound"
    put:
      operationId: scimReplaceUser
      tags: [scim]
      summary: Replace a user
      description: Only `active` and `externalId` are writable; `userName` cannot be changed (400 mutability). Deactivation (`active:false`) reversibly disables every credential the user holds and deletes their browser sessions; reactivation restores their tokens, agents, and OAuth grants (the user signs in again for a new session).
      security:
        - scimBearer: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
              properties:
                userName: { type: string, description: Must equal the current value }
                externalId: { type: [string, "null"] }
                active: { type: boolean }
      responses:
        "200":
          description: Updated user
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimUser" }
        "400":
          description: Invalid attribute or userName change (SCIM error body)
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimError" }
        "401":
          $ref: "#/components/responses/ScimUnauthorized"
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "409":
          description: externalId already assigned to another user
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimError" }
    patch:
      operationId: scimPatchUser
      tags: [scim]
      summary: Patch a user
      description: Accepts `replace` and `add` operations (equivalent for these single-valued attributes, RFC 7644 §3.5.2.1) on `active` and `externalId`, with or without a path. Operations of any type on unstored attributes (displayName, name.*, enterprise extension paths, ...) are ignored rather than errored, matching Okta/Entra profile syncs; any other operation on a stored attribute is rejected.
      security:
        - scimBearer: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
              required: [Operations]
              properties:
                Operations:
                  type: array
                  items:
                    type: object
                    properties:
                      op: { type: string, description: '"replace" or "add" (case-insensitive) on stored attributes' }
                      path: { type: string }
                      value: {}
      responses:
        "200":
          description: Updated user
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimUser" }
        "400":
          description: Malformed operations (SCIM error body)
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimError" }
        "401":
          $ref: "#/components/responses/ScimUnauthorized"
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "409":
          description: externalId already assigned to another user
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimError" }
    delete:
      operationId: scimDeleteUser
      tags: [scim]
      summary: Deactivate a user
      description: Deactivates rather than erases (equivalent to `active:false`), so a later GET returns the resource with `active:false` and a misconfigured IdP cannot destroy data. Idempotent.
      security:
        - scimBearer: []
      responses:
        "204":
          description: User deactivated
        "401":
          $ref: "#/components/responses/ScimUnauthorized"
        "404":
          $ref: "#/components/responses/ScimNotFound"

  /mcp:
    post:
      tags: [mcp]
      summary: MCP endpoint (JSON-RPC 2.0 over streamable HTTP)
      description: |
        Stateless. One JSON-RPC request in, one response out; there is no
        session to establish and no `Mcp-Session-Id`. Methods: `initialize`,
        `notifications/initialized`, `notifications/cancelled`, `ping`,
        `tools/list`, `tools/call`.

        A JSON array is accepted as a batch (for the protocol revisions that
        allow one). A message with no `id` is a notification and is answered
        with `202` and no body.

        Authenticate with an MCP OAuth access token, a user token, or an agent
        token. A request with no credential gets `401` with a
        `WWW-Authenticate` header naming the protected-resource metadata, which
        is how a client bootstraps the OAuth flow.
      parameters:
        - name: Mcp-Protocol-Version
          in: header
          required: false
          schema:
            type: string
            enum: ["2025-06-18", "2025-03-26", "2024-11-05"]
          description: Omit it, or send a version this server speaks; anything else is a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/JsonRpcRequest"
                - type: array
                  items: { $ref: "#/components/schemas/JsonRpcRequest" }
      responses:
        "200":
          description: JSON-RPC response (or an array of them, for a batch)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/JsonRpcResponse"
                  - type: array
                    items: { $ref: "#/components/schemas/JsonRpcResponse" }
        "202":
          description: Notification accepted; no body
        "400":
          description: Malformed JSON, an empty batch, or an unsupported protocol version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
        "401":
          description: Missing or invalid credential
          headers:
            WWW-Authenticate:
              schema: { type: string }
              description: 'Bearer challenge carrying `resource_metadata`'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
        "413":
          description: Request body exceeded the endpoint's cap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
    get:
      tags: [mcp]
      summary: Server-initiated stream (not offered)
      description: This server never initiates messages, so there is no stream to open.
      responses:
        "405":
          description: No server-initiated stream
    delete:
      tags: [mcp]
      summary: End an MCP session
      description: There is no session state to discard, so this always succeeds.
      responses:
        "204":
          description: Acknowledged

  /.well-known/oauth-protected-resource:
    get:
      tags: [mcp]
      summary: Protected-resource metadata (RFC 9728)
      security: []
      responses:
        "200":
          description: Metadata document, built from the request origin
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource: { type: string }
                  authorization_servers:
                    type: array
                    items: { type: string }
                  scopes_supported:
                    type: array
                    items: { type: string }

  /.well-known/oauth-authorization-server:
    get:
      tags: [mcp]
      summary: Authorization-server metadata (RFC 8414)
      security: []
      responses:
        "200":
          description: Metadata document, built from the request origin
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer: { type: string }
                  authorization_endpoint: { type: string }
                  token_endpoint: { type: string }
                  registration_endpoint: { type: string }
                  revocation_endpoint: { type: string }
                  code_challenge_methods_supported:
                    type: array
                    items: { type: string, enum: [S256] }

  /oauth/register:
    post:
      tags: [mcp]
      summary: Dynamic client registration (RFC 7591)
      description: |
        Unauthenticated by design — an MCP client discovers this server from a
        URL and has no pre-shared credential. The registration confers nothing
        on its own: reaching a user's data still requires that user to complete
        the consent screen in their own browser.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uris]
              properties:
                client_name: { type: string, maxLength: 120 }
                redirect_uris:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string }
                  description: |
                    `https`, or `http` on loopback (`localhost`, `127.0.0.1`,
                    `[::1]`) for native apps. No fragment, no embedded
                    credentials. Matched exactly at authorization time, except
                    that a loopback redirect may use any port (RFC 8252 §7.3).
                scope: { type: string, example: "mcp:read mcp:write" }
                token_endpoint_auth_method:
                  type: string
                  enum: [none, client_secret_post, client_secret_basic]
                  default: none
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id: { type: string }
                  client_secret:
                    type: string
                    description: Confidential clients only; returned once.
                  client_id_issued_at: { type: integer }
                  client_secret_expires_at: { type: integer, enum: [0] }
        "400":
          description: Invalid client metadata, redirect URI, or scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }

  /oauth/token:
    post:
      tags: [mcp]
      summary: Token endpoint
      description: |
        Grant types: `authorization_code` (PKCE `S256` required) and
        `refresh_token` (rotating). Client authentication is `none`,
        `client_secret_post`, or `client_secret_basic`.

        A replayed authorization code revokes every token issued from that
        client to that user (RFC 6749 §10.5).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                code: { type: string }
                code_verifier: { type: string, minLength: 43, maxLength: 128 }
                redirect_uri: { type: string }
                refresh_token: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string, example: "stratum_mcp_..." }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer, example: 3600 }
                  refresh_token: { type: string }
                  scope: { type: string }
        "400":
          description: Invalid grant or request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "401":
          description: Client authentication failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }

  /oauth/revoke:
    post:
      tags: [mcp]
      summary: Token revocation (RFC 7009)
      description: |
        Accepts either half of a pair and revokes the whole grant. Always
        returns `200`, whether or not the token existed — reporting the
        difference would make this a free oracle for testing stolen tokens.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
      responses:
        "200":
          description: Acknowledged

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Stratum API token (user token or agent token)
    adminApiKey:
      type: apiKey
      in: header
      name: X-Admin-API-Key
      description: Admin API key for administrator endpoints
    scimBearer:
      type: http
      scheme: bearer
      description: >
        Per-connection SCIM token (`stratum_scim_*`), rotated via
        `POST /api/orgs/{slug}/sso/scim-token`. The only credential the
        `/scim/v2` endpoints accept — session cookies and user/agent tokens
        are never honored there.
    sessionCookie:
      type: apiKey
      in: cookie
      name: stratum_session
      description: >
        Browser session cookie, set by signing in through the web UI. Endpoints
        that declare only this scheme are session-only: they reject API tokens,
        so a token can never manage tokens.

  parameters:
    Namespace:
      name: namespace
      in: path
      required: true
      schema: { type: string }
      description: Project namespace, including the @ prefix (e.g. "@alice")
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
      description: Project slug
    Ref:
      name: ref
      in: query
      required: false
      schema: { type: string }
      description: >
        Branch to read. Defaults to the project's default branch. Branch names
        only — tags and raw commit shas are not resolved, and a name that is
        both a branch and a tag is refused as ambiguous (409) rather than
        resolved to either. An unknown branch is a 404; there is no fall back
        to the default branch.
    ProjectName:
      name: name
      in: path
      required: true
      schema: { type: string }
      description: Project name (single segment, not namespace/slug)
    OrgSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
      description: Organization slug
    AuditAction:
      name: action
      in: query
      schema: { type: string }
      description: Filter by audit action (e.g. org.member.role_changed, auth.failed, merge.forced)
    AuditSince:
      name: since
      in: query
      schema: { type: string, format: date-time }
      description: Inclusive lower bound on createdAt (ISO-8601)
    AuditUntil:
      name: until
      in: query
      schema: { type: string, format: date-time }
      description: Exclusive upper bound on createdAt (ISO-8601)
    AuditCursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor from a previous page's `nextCursor`
    AuditLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      description: Page size; values above 500 are clamped
    ChangeId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Change id

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found (also returned for access denied, to avoid disclosing existence)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TargetDeleting:
      description: The project (or its owner) is being deleted (code TARGET_DELETING)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ReauthenticationRequired:
      description: >
        Not a browser session (code SESSION_REQUIRED), or the session is older
        than 15 minutes or skipped the account's existing passkey (code
        REAUTHENTICATION_REQUIRED) — sign in again.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SessionRequired:
      description: >
        The caller authenticated with an API token, but this endpoint requires a
        signed-in browser session (code SESSION_REQUIRED)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TokenBindingExcludesRoute:
      description: >
        The request was authenticated by an API token bound to one project or
        organization, and this endpoint is not one a bound token may use (code
        TOKEN_BINDING_EXCLUDES_ROUTE). Enforced before routing.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TokenScopeInsufficient:
      description: >
        The request was authenticated by a `read` API token and is not a GET or
        HEAD (code TOKEN_SCOPE_INSUFFICIENT). Enforced before routing, so it can
        be returned by any non-GET/HEAD endpoint that accepts a bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SsoNotConfigured:
      description: SSO is not configured on this server (no SSO_ENCRYPTION_SECRET)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ScimUnauthorized:
      description: Missing/invalid SCIM bearer, or the connection is disabled, unverified, or deleted
      content:
        application/scim+json:
          schema: { $ref: "#/components/schemas/ScimError" }
    ScimNotFound:
      description: User not found in the connection's scope
      content:
        application/scim+json:
          schema: { $ref: "#/components/schemas/ScimError" }

  schemas:
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: { type: string, enum: ["2.0"] }
        id:
          oneOf:
            - { type: string }
            - { type: integer }
          description: Omit it to send a notification, which is answered with 202 and no body.
        method:
          type: string
          enum:
            - initialize
            - notifications/initialized
            - notifications/cancelled
            - ping
            - tools/list
            - tools/call
        params: { type: object }

    JsonRpcResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc: { type: string, enum: ["2.0"] }
        id:
          oneOf:
            - { type: string }
            - { type: integer }
            - { type: "null" }
        result: { type: object }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
              description: >
                JSON-RPC 2.0 reserved code: -32700 parse error, -32600 invalid
                request, -32601 method (or tool) not found, -32602 invalid
                params, -32603 internal error.
            message: { type: string }
            data: {}

    OAuthError:
      type: object
      required: [error]
      description: RFC 6749 §5.2 error body — distinct from this API's `{error, code}` shape.
      properties:
        error:
          type: string
          example: invalid_grant
        error_description: { type: string }

    Passkey:
      type: object
      required: [id, name, createdAt, lastUsedAt]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
    OrgSecurityPolicy:
      type: object
      required: [requireSecondFactor, ipAllowlist]
      properties:
        requireSecondFactor:
          type: boolean
          description: Members must sign in with a second factor (passkey, or this org's SSO)
        ipAllowlist:
          type: array
          maxItems: 100
          items: { type: string, example: "203.0.113.0/24" }
          description: >
            Canonical CIDR ranges the org's resources may be reached from. Empty
            means no restriction.
        secondFactorImpact:
          type: object
          description: >
            Admins and the owner only, on `GET`. The members' live credentials
            that the second-factor policy refuses because they were not created
            from a session that meets it.
          required: [members, apiTokens, agents, oauthGrants, accountKeys]
          properties:
            members:
              type: integer
              description: Members holding at least one refused token, agent or grant
            apiTokens:
              type: integer
              description: API tokens that are account-wide, bound to this org, or bound to one of its projects
            agents:
              type: integer
              description: Agents with their own token
            oauthGrants:
              type: integer
              description: MCP and CLI connections
            accountKeys:
              type: integer
              description: >
                Members whose legacy API key would be refused. An upper bound:
                a disabled key cannot be told from a live one.
    OrgSecurityPolicyUpdate:
      type: object
      anyOf:
        - required: [requireSecondFactor]
        - required: [ipAllowlist]
      properties:
        requireSecondFactor:
          type: boolean
        ipAllowlist:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 64 }
          description: >
            IPv4/IPv6 addresses or CIDR ranges. A bare address is a single host.
            Saved in canonical form (host bits cleared), de-duplicated. `[]`
            removes the restriction.
        allowSelfLockout:
          type: boolean
          description: >
            Save an `ipAllowlist` that excludes the caller's current address
            anyway. Without it, such a list is refused with
            `409 IP_ALLOWLIST_SELF_LOCKOUT`.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: >
            Machine-readable code present on some errors (e.g. TARGET_DELETING,
            STALE_BASE, BASE_UNVERIFIABLE, STALE_WORKSPACE, WORKSPACE_UNVERIFIABLE,
            MERGE_CONFLICT, PROTECTION_BLOCKED, NOT_REDRIVABLE, GONE, INVALID_PATH,
            TOKEN_SCOPE_INSUFFICIENT, TOKEN_BINDING_EXCLUDES_ROUTE,
            TOKEN_LIMIT_REACHED, SESSION_REQUIRED, DOMAIN_VERIFICATION_FAILED,
            INVALID_SIGNATURE, INVALID_REPORT, STALE_REVISION, CHECK_SUPERSEDED,
            CHECK_TERMINAL, CHECK_DEADLINE_EXCEEDED, CHECK_DISPATCH_FAILED,
            CHECK_HAS_NO_LOG, CHECK_LOG_NOT_FOUND, CI_EXECUTOR_UNAVAILABLE)

    SsoConnectionEnvelope:
      type: object
      properties:
        connection:
          type: object
          description: Admin view of the connection — client secret ciphertext and SCIM token hash are never included
          properties:
            id: { type: string }
            orgId: { type: string }
            protocol: { type: string, enum: [oidc] }
            issuer: { type: string }
            clientId: { type: string }
            authorizationEndpoint: { type: string }
            tokenEndpoint: { type: string }
            jwksUri: { type: string }
            emailDomains:
              type: array
              items: { type: string }
            domainsVerifiedAt:
              type: [string, "null"]
              format: date-time
            enabled: { type: boolean }
            scimTokenSet: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        domainVerification:
          type: [object, "null"]
          description: The DNS TXT records to publish (null only when the connection has no verification token). It may still be present after verification, so read `connection.domainsVerifiedAt` for verification status
          properties:
            token: { type: string }
            records:
              type: array
              items:
                type: object
                properties:
                  domain: { type: string }
                  name:
                    type: string
                    description: "`_stratum-sso.<domain>`"
                  type: { type: string, enum: [TXT] }
                  value:
                    type: string
                    description: "`stratum-sso-verify=<token>`"
            instructions: { type: string }

    ScimUser:
      type: object
      description: SCIM core User resource
      properties:
        schemas:
          type: array
          items: { type: string }
        id: { type: string, description: Stratum user id }
        userName: { type: string, description: The user's email address }
        externalId: { type: string }
        active:
          type: boolean
          description: Reflects users.disabled_at — the enforced account state
        name:
          type: object
          properties:
            formatted: { type: string }
        emails:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              primary: { type: boolean }
        meta:
          type: object
          properties:
            resourceType: { type: string }
            created: { type: string, format: date-time }
            location: { type: string }

    ScimUserList:
      type: object
      description: SCIM ListResponse envelope
      properties:
        schemas:
          type: array
          items: { type: string }
        totalResults: { type: integer }
        startIndex: { type: integer }
        itemsPerPage: { type: integer }
        Resources:
          type: array
          items: { $ref: "#/components/schemas/ScimUser" }

    ScimError:
      type: object
      description: SCIM error envelope (urn:ietf:params:scim:api:messages:2.0:Error)
      properties:
        schemas:
          type: array
          items: { type: string }
        status: { type: string }
        detail: { type: string }
        scimType: { type: string }

    ApiToken:
      type: object
      description: A token as listed to its owner. Deliberately carries no hash.
      required: [id, name, tokenPrefix, scope, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        tokenPrefix:
          type: string
          description: >
            The credential's leading, non-secret characters (e.g.
            "stratum_user_1a2b3c4d") — enough to recognise a token already
            deployed somewhere, never enough to use one.
        scope:
          type: string
          enum: [read, read_write]
        expiresAt:
          type: string
          format: date-time
          description: Absent when the token never expires
        lastUsedAt:
          type: string
          format: date-time
          description: >
            Absent until first use. Written at most hourly, and not at all on
            the git smart-HTTP path, which has no execution context.
        createdAt: { type: string, format: date-time }
        revokedAt:
          type: string
          format: date-time
          description: Present on a revoked token; the row is kept for the audit trail
        binding:
          description: >
            Present only on a token bound to one project or organization;
            absent means account-wide. `label` is the project path or `@org`
            as it is now, or a note that the target no longer exists (the
            token then reaches nothing).
          oneOf:
            - type: object
              required: [kind, projectId, label]
              properties:
                kind: { type: string, enum: [project] }
                projectId: { type: string }
                label: { type: string, example: "@alice/web" }
            - type: object
              required: [kind, orgId, label]
              properties:
                kind: { type: string, enum: [org] }
                orgId: { type: string }
                label: { type: string, example: "@acme" }

    Project:
      type: object
      required: [id, name, namespace, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        namespace:
          type: string
          description: '"@username" or "@org-slug"'
        slug: { type: string }
        path:
          type: string
          description: "/{namespace}/{slug}"
        remote:
          type: string
          description: Backing Artifacts git remote URL
        createdAt: { type: string, format: date-time }
        visibility:
          type: string
          enum: [private, public]
        githubUrl: { type: string }
        githubOwner: { type: string }
        githubRepo: { type: string }
        githubDefaultBranch: { type: string }
        githubConnectionStatus:
          type: string
          enum: [connected, disconnected]

    Workspace:
      type: object
      required: [name]
      properties:
        name: { type: string }
        createdAt: { type: string, format: date-time }
        path:
          type: string
          description: "/{namespace}/{slug}/workspaces/{name}"
        remote:
          type: string
          description: Workspace fork remote (returned on creation)

    EvaluationQueued:
      type: object
      required: [change, evaluation]
      properties:
        change: { $ref: "#/components/schemas/Change" }
        evaluation:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [evaluating, superseded]
              description: |
                `evaluating` — the run is queued; poll the change for its verdict.
                `superseded` — the run executed inline (the queue send failed) but
                found the change had already moved on (rejected, or waiting on a
                newer run), so no verdict was recorded.
            runId:
              type: string
              description: The queued run's id. Present only when `status` is `evaluating`.
    Change:
      type: object
      required: [id, project, workspace, status, createdAt]
      properties:
        id: { type: string }
        project:
          type: string
          description: Project name (or project id for changes created via the GitHub bridge)
        projectId:
          type: string
          format: uuid
          description: Globally-unique project id; absent on legacy rows
        workspace: { type: string }
        title:
          type: string
          description: One line saying what the change does, when its opener gave one
        description:
          type: string
          description: Why the change exists, as markdown source, when its opener gave one
        status:
          type: string
          enum: [open, evaluating, external, needs_changes, accepted, approved, promoted, merged, rejected, reverted]
          description: |
            `evaluating` means an evaluation run is queued or running and no
            verdict exists yet; it is never mergeable.

            `external` means the change stands for a pull request opened on the
            project's GitHub mirror that a maintainer has not imported yet. It
            cannot be evaluated, reviewed or merged, even by force; importing
            it (`POST /api/changes/{id}/import`) is the only way forward. An
            imported change returns to `external` when its pull request gets
            new commits.
        agentId: { type: string }
        evalScore: { type: number }
        evalPassed: { type: boolean }
        evalReason: { type: string }
        baseSha:
          type: string
          description: >-
            The project's tip when the change was last evaluated (at creation,
            until the first verdict). `merge.requireFreshBase` compares it with
            the project head.
        forkPointSha:
          type: string
          description: >-
            The commit the workspace forked from the project. The evaluated
            diff runs from this commit to `evaluatedSha`. Differs from
            `baseSha` when the workspace is behind the project. Absent on
            changes evaluated before this field existed.
        evaluatedSha:
          type: string
          description: Workspace tip the evaluation ran against; merges reject if it moved
        evaluatedTreeOid: { type: string }
        agentModel:
          type: string
          description: Authoring agent's model, snapshotted at change creation
        agentPromptHash: { type: string }
        workspaceHeadSha: { type: string }
        evalRunId:
          type: string
          description: |
            The evaluation run the change is waiting on, or the last one
            dispatched. Absent on changes evaluated inline.
        evalRequestedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        mergedAt: { type: string, format: date-time }
        githubOwner: { type: string }
        githubRepo: { type: string }
        githubBranch: { type: string }
        githubPrNumber: { type: integer }
        githubPrUrl: { type: string }
        githubPrState: { type: string }
        githubPrDraft:
          type: boolean
          description: Whether the pull request is still a draft; absent when not known
        githubHeadSha: { type: string }
        promotedAt: { type: string, format: date-time }
        promotedBy: { type: string }

    EvalResult:
      type: object
      required: [score, passed, reason]
      properties:
        score: { type: number }
        passed: { type: boolean }
        reason: { type: string }
        issues:
          type: array
          items: { type: string }

    EvalRun:
      type: object
      required: [id, changeId, evaluatorType, score, passed, reason, ranAt]
      properties:
        id: { type: string }
        changeId: { type: string }
        evaluatorType:
          type: string
          description: e.g. secret_scan, diff, webhook, llm, sandbox
        score: { type: number }
        passed: { type: boolean }
        reason: { type: string }
        issues:
          type: array
          items: { type: string }
        ranAt: { type: string, format: date-time }

    CheckRun:
      type: object
      description: >
        One attempt at one named check on one revision of a change. Created by
        Stratum when it dispatches the checks a project's policy declares;
        moved by the runner's signed reports.
      required: [id, changeId, revision, name, attempt, status, createdAt, deadlineAt]
      properties:
        id:
          type: string
          description: Check run id (`chk_…`); also the last path segment of the runner's callback URL
        changeId: { type: string }
        revision:
          type: string
          description: The evaluated head sha this run was dispatched for
        baseSha:
          type: string
          description: The commit the dispatched diff was computed against
        name:
          type: string
          description: The check name, as declared by a `checks` evaluator in the policy
        attempt:
          type: integer
          minimum: 1
          description: Counts runs of the same check on the same revision; the highest is the one that counts
        status:
          type: string
          enum: [queued, running, passed, failed, errored]
        summary: { type: string }
        detailsUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        completedAt:
          type: string
          format: date-time
          description: Present once the status is terminal
        deadlineAt:
          type: string
          format: date-time
          description: When a run that is still queued or running becomes errored

    CheckRunReport:
      type: object
      required: [checkRunId, headSha, status, sequence]
      properties:
        checkRunId:
          type: string
          description: Must equal the id in the URL, binding the signed body to one check run
        headSha:
          type: string
          description: Must equal the `headSha` of the dispatch request
        status:
          type: string
          enum: [running, passed, failed, errored]
        sequence:
          type: integer
          minimum: 1
          description: >
            Strictly increasing per check run (a counter, or milliseconds since
            the epoch). A report at or below the last applied value is treated
            as a redelivery.
        summary:
          type: string
          description: Plain text; truncated to 4000 characters. Omit to keep the previous value.
        detailsUrl:
          type: string
          format: uri
          maxLength: 2048
          description: An http(s) URL without credentials. Omit to keep the previous value.

    CheckDispatch:
      type: object
      description: >
        The body Stratum POSTs to a `checks` evaluator's `url` for each
        evaluated revision (and for a re-run), signed with
        `X-Stratum-Signature`. Not a request any client sends to Stratum;
        documented here because a runner is built against it.
      required: [event, changeId, project, baseSha, headSha, headTreeSha, diff, checkRunIds, callbackUrl, deadline]
      properties:
        event:
          type: string
          enum: [checks.requested]
        changeId: { type: string }
        project:
          type: string
          description: "`@namespace/slug`"
        baseSha:
          type: string
          description: The commit `diff` was computed against
        headSha:
          type: string
          description: The evaluated revision
        headTreeSha:
          type: string
          description: >
            The git tree id of `headSha`. Checking out `baseSha` and applying
            `diff` must produce exactly this tree; a runner compares
            `git write-tree` against it before running anything.
        diff:
          type: string
          description: Unified diff of baseSha..headSha
        checkRunIds:
          type: object
          additionalProperties: { type: string }
          description: Check name to check run id, for exactly the checks this request asks for
        callbackUrl:
          type: string
          format: uri
          description: Report to `<callbackUrl>/<checkRunId>`
        deadline:
          type: string
          format: date-time
          description: After this instant an unfinished check is errored

    Issue:
      type: object
      required: [id, project, number, title, status, authorType, authorId, createdAt, updatedAt]
      properties:
        id: { type: string }
        project: { type: string }
        projectId: { type: string, format: uuid }
        number: { type: integer }
        title: { type: string }
        body: { type: string }
        status:
          type: string
          enum: [open, closed]
        authorType:
          type: string
          enum: [user, agent]
        authorId: { type: string }
        assignee:
          type: string
          description: Single assignee (user id); absent when unassigned
        labels:
          type: array
          items: { type: string }
          description: Returned by the issue list, detail, and update endpoints
        linkedChangeId: { type: string }
        closedAt: { type: string, format: date-time }
        closedBy: { type: string }
        externalAuthor:
          type: string
          description: GitHub login of an imported issue's author with no linked Stratum account
        externalUrl:
          type: string
          format: uri
          description: Link to the original GitHub issue; present only on imported issues
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ResyncSource:
      type: object
      description: Where a break-glass resync read from.
      required: [kind, repo]
      properties:
        kind:
          type: string
          enum: [mirror, source]
          description: The project's push mirror, or its linked GitHub repository.
        repo:
          type: string
          description: "`owner/repository` on GitHub."

    ResyncFastForwarded:
      type: object
      description: A break-glass resync that moved the default branch.
      required:
        [status, branch, source, oldSha, newSha, commits, commitCount, commitsTruncated, evaluated, mirror]
      properties:
        status: { type: string, enum: [fast-forwarded] }
        branch: { type: string }
        source: { $ref: "#/components/schemas/ResyncSource" }
        oldSha: { type: string, description: The branch's commit before. }
        newSha: { type: string, description: The branch's commit now. }
        commits:
          type: array
          description: The commits that came in, newest first, at most 50.
          items:
            type: object
            required: [sha, summary, author]
            properties:
              sha: { type: string }
              summary: { type: string, description: First line of the commit message. }
              author: { type: string, description: The author's name. }
        commitCount:
          type: integer
          description: How many commits came in, including any left out of `commits`.
        commitsTruncated: { type: boolean }
        evaluated:
          type: boolean
          enum: [false]
          description: Always false. No evaluator ran on these commits.
        mirror:
          description: The push mirror after the resync, or null when the project has none.
          oneOf:
            - $ref: "#/components/schemas/PushMirror"
            - type: "null"

    ResyncUpToDate:
      type: object
      description: A break-glass resync that found nothing to do.
      required: [status, branch, source, projectSha, upstreamSha, mirror]
      properties:
        status: { type: string, enum: [up-to-date] }
        branch: { type: string }
        source: { $ref: "#/components/schemas/ResyncSource" }
        projectSha: { type: string }
        upstreamSha: { type: string }
        mirror:
          oneOf:
            - $ref: "#/components/schemas/PushMirror"
            - type: "null"

    ResyncRefusal:
      type: object
      description: A refused break-glass resync.
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
        projectSha:
          type: string
          description: The project's commit, when the refusal knows it.
        upstreamSha:
          type: string
          description: GitHub's commit, when the refusal knows it.

    PushMirror:
      type: object
      description: A project's push mirror to GitHub — its configuration and status.
      required: [repo, url, enabled, state, pending, lastPushedSha, lastPushedAt, lastAttemptAt]
      properties:
        repo:
          type: string
          description: The GitHub repository, as `owner/repository`
        url: { type: string, format: uri }
        enabled: { type: boolean }
        state:
          type: string
          enum: [idle, pushing, ok, retrying, failed, diverged]
          description: |
            `idle` — configured, nothing pushed yet. `pushing` — a push is
            running. `ok` — the mirror matched the project when the last push
            finished. `retrying` — the last attempt failed and another is
            scheduled. `failed` — retries are exhausted, or the failure is one
            no retry fixes; the next merge or a resume tries again. `diverged`
            — the GitHub repository holds history the project does not;
            nothing is pushed until an admin resumes the mirror.
        pending:
          type: boolean
          description: A push has been requested and has not completed
        lastPushedSha:
          type: [string, "null"]
          description: The default-branch commit the mirror was last brought to
        lastPushedAt: { type: [string, "null"], format: date-time }
        lastAttemptAt: { type: [string, "null"], format: date-time }
        lastError:
          type: [string, "null"]
          description: Why the last attempt failed or diverged. Project writers only.
        nextAttemptAt:
          type: [string, "null"]
          format: date-time
          description: When the next retry is due, while `retrying`. Project writers only.
        attempts:
          type: integer
          description: Consecutive failed attempts. Project writers only.
        acceptPullRequests:
          type: boolean
          description: >
            Whether a pull request opened against the mirror's default branch
            becomes an `external` change in the project.
        requireContributorAgreement:
          type: boolean
          description: >
            Whether importing such a pull request needs a maintainer to
            confirm the contributor agreement.

    ExternalPullRequest:
      type: object
      description: >
        The pull request, on the project's GitHub mirror, that a change stands
        for. `title`, `author` and `commitAuthors` are text chosen by the pull
        request's author: display them as text.
      required: [repo, number, url, author, title, headSha, importedHeadSha, state, refusal, closure]
      properties:
        repo:
          type: string
          description: The mirror repository, as `owner/repository`
        number: { type: integer }
        url: { type: string, format: uri }
        author:
          type: string
          description: GitHub login of whoever opened the pull request
        title: { type: string }
        headSha:
          type: string
          description: The newest head commit GitHub reported
        importedHeadSha:
          type: [string, "null"]
          description: The head commit the workspace holds; null before the first import
        commits:
          type: [integer, "null"]
          description: GitHub's count of the pull request's commits
        changedFiles:
          type: [integer, "null"]
          description: GitHub's count of the files it changes
        state:
          type: string
          enum: [open, closed, merged]
          description: The pull request's state on GitHub, as last seen
        refusal:
          description: Why the newest head cannot be imported, or null
          oneOf:
            - type: "null"
            - type: object
              required: [code, reason]
              properties:
                code:
                  type: string
                  enum: [PR_TOO_MANY_COMMITS, PR_TOO_MANY_FILES, PR_TOO_LARGE, PR_UNRELATED_HISTORY, PR_CONFLICTS, PR_EMPTY, SUBMODULES_UNSUPPORTED, LFS_UNSUPPORTED]
                reason: { type: string }
        importedBy:
          type: [string, "null"]
          description: The user who last imported it
        importedAt: { type: [string, "null"], format: date-time }
        agreementConfirmedBy:
          type: [string, "null"]
          description: The user who confirmed the contributor agreement
        agreementConfirmedAt: { type: [string, "null"], format: date-time }
        commitAuthors:
          type: array
          description: Authors of the imported commits
          items:
            type: object
            required: [name, email]
            properties:
              name: { type: string }
              email: { type: string }
        closure:
          type: object
          description: Closing the pull request on GitHub after the change merged
          required: [state, error]
          properties:
            state:
              type: string
              enum: [none, commented, done, failed]
              description: |
                `none` — nothing done yet. `commented` — the link to the change
                is posted, and the pull request is closed in a later pass if
                GitHub has not marked it merged. `done` — the pull request is
                merged or closed. `failed` — Stratum could not comment on or
                close it; `error` says why.
            error: { type: [string, "null"] }

    IssueImportRun:
      type: object
      required: [id, projectId, githubRepo, status, initiatedBy, nextPage, issuesCreated, issuesUpdated, commentsImported, pullsSkipped, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        githubRepo: { type: string, description: "owner/repo" }
        status:
          type: string
          enum: [queued, running, completed, failed]
        initiatedBy: { type: string }
        nextPage: { type: integer }
        resume:
          type: object
          description: >
            Where the current page resumes, when it ran out of a queue message's
            work budget. Absent when the page starts from its top.
          required: [issue, commentPage]
          properties:
            issue: { type: integer, description: "GitHub number of the issue to resume at" }
            commentPage: { type: integer }
        issuesCreated: { type: integer }
        issuesUpdated: { type: integer }
        commentsImported: { type: integer }
        pullsSkipped: { type: integer }
        message: { type: string, description: Failure or rate-limit wait detail }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }

    IssueComment:
      type: object
      required: [id, issueId, authorType, authorId, body, createdAt]
      properties:
        id: { type: string }
        issueId: { type: string }
        authorType:
          type: string
          enum: [user, agent]
        authorId: { type: string }
        body: { type: string }
        externalAuthor:
          type: string
          description: GitHub login of an imported comment's author with no linked Stratum account
        externalUrl:
          type: string
          format: uri
          description: Link to the original GitHub comment; present only on imported comments
        createdAt: { type: string, format: date-time }

    Review:
      type: object
      required: [id, changeId, reviewerId, verdict, createdAt]
      properties:
        id: { type: string }
        changeId: { type: string }
        reviewerId: { type: string }
        verdict:
          type: string
          enum: [approve, request_changes, comment]
        comment: { type: string }
        createdAt: { type: string, format: date-time }

    ChangeComment:
      type: object
      required: [id, changeId, authorType, authorId, body, createdAt, resolved]
      properties:
        id: { type: string }
        changeId: { type: string }
        authorType:
          type: string
          enum: [user, agent]
        authorId: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        file:
          type: string
          description: Diff anchor file path; absent on change-level comments
        line:
          type: integer
          description: 1-based anchored line number
        side:
          type: string
          enum: [old, new]
          description: Which half of the diff the anchored line belongs to
        commitSha:
          type: string
          description: Commit the anchor was recorded against
        parentCommentId:
          type: string
          description: Thread root this comment replies to; absent on roots
        resolved:
          type: boolean
          description: Thread resolution state (meaningful on thread roots)

    ActivityEvent:
      type: object
      required: [id, type, actorType, payload, createdAt]
      properties:
        id: { type: string }
        type:
          type: string
          description: Domain event type (e.g. change.created, change.merged, issue.opened)
        actorType:
          type: string
          enum: [user, agent, system]
        actorId: { type: string }
        payload:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }

    Webhook:
      type: object
      required: [id, project, url, events, active, createdBy, createdAt]
      properties:
        id: { type: string }
        project: { type: string }
        projectId: { type: string, format: uuid }
        url: { type: string, format: uri }
        secret:
          type: string
          description: Returned only on creation; omitted from list responses
        events:
          type: string
          description: Comma-separated event types, or "*" for all
        active: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    ProjectSecret:
      type: object
      required: [name, createdBy, updatedBy, createdAt, updatedAt]
      description: >
        A deploy secret as anyone other than the deploy runner may ever see it.
        The value is deliberately absent: no endpoint returns it.
      properties:
        name: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        createdBy: { type: string }
        updatedBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Deployment:
      type: object
      required: [id, projectId, project, commitSha, name, target, attempt, status, requestedByType, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        project: { type: string }
        changeId:
          type: string
          description: Absent for a deploy not traceable to a change
        commitSha: { type: string }
        name:
          type: string
          description: >
            The `deploys:` entry name or the pipeline environment name; or
            "(unresolved)" for a row that never selected one — a rejected entry,
            an unreadable tree, or a merge with nothing configured — and
            "(pipeline)" for an invalid `deploy:` section
        target:
          type: string
          enum: [cloudflare-pages, cloudflare-workers, vercel, pipeline, unresolved]
          description: >
            `pipeline` is a deployment run by the CI executor from the
            `deploy:` section of `.stratum/ci.yaml`
        attempt:
          type: integer
          description: 1 for the original; incremented by each retry
        status:
          type: string
          enum: [pending_approval, queued, running, succeeded, failed, superseded, skipped]
          description: >
            `skipped` means only that nothing was configured to deploy. Every
            operator error (missing secret, unset DEPLOY_SECRET_KEY, limit
            exceeded, provider error) is `failed` with a reason. For the
            `vercel` target, `succeeded` means "accepted for build" — Vercel
            builds asynchronously and Stratum does not poll it.
        reason: { type: string }
        url:
          type: string
          description: >
            Absent when the provider returned none. The Cloudflare targets derive
            it from the optional CLOUDFLARE_WORKERS_SUBDOMAIN secret, so without
            that secret a deployment succeeds with no URL.
        logTail:
          type: string
          description: >
            Redacted, truncated provider payload (16 KiB). Returned **only** to
            callers with project write access.
        durationMs: { type: number }
        leaseExpiresAt: { type: string, format: date-time }
        requestedByType:
          type: string
          enum: [user, agent, system]
        requestedById: { type: string }
        approvedBy: { type: string }
        version:
          type: string
          description: >
            What the deployment put live, set when it succeeded: whatever a
            pipeline's steps recorded (a Worker version id, for a Worker), or
            the commit for a static target. It is what a rollback to this
            deployment is given
        rollbackOf:
          type: string
          description: The id of the deployment this one rolled back to. Absent on an ordinary deploy
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }

    DeploymentReport:
      type: object
      description: The body the CI executor POSTs when a pipeline deployment's job ends
      required: [deploymentId, commitSha, status]
      properties:
        deploymentId:
          type: string
          description: Must equal the id in the URL, so a signed body is bound to one deployment
        commitSha:
          type: string
          description: Must equal the commit the deployment is for
        environment: { type: string }
        status:
          type: string
          enum: [succeeded, failed]
        cause:
          type: string
          enum: [failed, errored]
          description: >
            For a failed deployment: `failed` when a step failed, `errored` when
            the job could not run to the end (a timeout, a lost container)
        summary: { type: string }
        steps:
          type: array
          description: How each step of the environment ended, in order
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string, enum: [passed, failed, errored, skipped] }
              summary: { type: string }
        version:
          type: string
          description: >
            What a step recorded as the deployed version. Stored only for a
            succeeded deployment, and only if it is a short label
        url:
          type: string
          description: The deployed URL a step recorded. Stored only if it is an https URL
        logTail:
          type: string
          description: The end of the last step's output

    WebhookDelivery:
      type: object
      required: [id, webhookId, eventId, eventType, status, createdAt]
      properties:
        id: { type: string }
        webhookId: { type: string }
        eventId: { type: string }
        eventType: { type: string }
        status:
          type: string
          enum: [success, failed]
        statusCode: { type: integer }
        error: { type: string }
        durationMs: { type: number }
        createdAt: { type: string, format: date-time }

    CommitLogEntry:
      type: object
      required: [sha, message, author, timestamp]
      properties:
        sha: { type: string }
        message: { type: string }
        author: { type: string }
        timestamp:
          type: number
          description: Unix timestamp

    ProvenanceRecord:
      type: object
      required: [id, commitSha, project, workspace, changeId, mergedAt]
      properties:
        id: { type: string }
        commitSha: { type: string }
        project: { type: string }
        projectId: { type: string, format: uuid }
        workspace: { type: string }
        changeId: { type: string }
        agentId: { type: string }
        evalScore: { type: number }
        model:
          type: string
          description: Model that authored the change, snapshotted at change creation
        promptHash: { type: string }
        mergedAt: { type: string, format: date-time }

    ImportProgress:
      type: object
      required: [id, projectId, namespace, slug, status, sourceUrl, branch, startedAt, updatedAt, version, progress, errors, logs]
      properties:
        id: { type: string }
        projectId: { type: string, format: uuid }
        namespace: { type: string }
        slug: { type: string }
        status:
          type: string
          enum: [queued, cloning, processing, completed, failed, cancelled, cancelling, syncing, checking]
        sourceUrl: { type: string }
        branch: { type: string }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version:
          type: integer
          description: Optimistic-locking version, incremented on each update
        progress:
          type: object
          properties:
            totalFiles: { type: integer }
            processedFiles: { type: integer }
            currentFile: { type: string }
            bytesTransferred: { type: integer }
            totalBytes: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              file: { type: string }
              error: { type: string }
              timestamp: { type: string }
        logs:
          type: array
          items:
            type: object
            properties:
              message: { type: string }
              level:
                type: string
                enum: [info, warn, error]
              timestamp: { type: string }

    SyncStatus:
      type: object
      properties:
        namespace: { type: string }
        slug: { type: string }
        sourceUrl: { type: string }
        provider:
          type: string
          enum: [github, gitlab, bitbucket]
        lastSyncedAt: { type: string, format: date-time }
        lastSyncedCommit: { type: string }
        lastSyncStatus:
          type: string
          enum: [success, failed, in_progress, idle]
        lastSyncError: { type: string }
        autoSyncEnabled: { type: boolean }
        hasUpdates: { type: boolean }
        commitsBehind: { type: integer }
        latestCommit: { type: string }
        lastCheckedAt: { type: string, format: date-time }
        mirror:
          description: >
            The project's push mirror, or null when it has none. Readers
            without write access do not receive `lastError`, `nextAttemptAt`
            or `attempts`.
          oneOf:
            - $ref: "#/components/schemas/PushMirror"
            - type: "null"
        importProgress:
          type: object
          description: Present when a sync/import is active
          properties:
            status: { type: string }
            progress: { type: object }
            logs:
              type: array
              items: { type: object }
            errors:
              type: array
              items: { type: object }

    Org:
      type: object
      required: [id, name, slug, ownerId, createdAt, requireSecondFactor, ipAllowlist]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        ownerId: { type: string }
        createdAt: { type: string, format: date-time }
        requireSecondFactor:
          type: boolean
          description: >
            Members must pass a second factor (passkey, or this org's SSO) to
            use the access the org grants. See `PUT /api/orgs/{slug}/security`.
        ipAllowlist:
          type: array
          items: { type: string }
          description: >
            CIDR ranges the org's resources may be reached from; empty means no
            restriction. See `PUT /api/orgs/{slug}/security`.

    OrgSummary:
      type: object
      description: An `Org` as `GET /api/orgs` lists it, without `ipAllowlist`.
      required: [id, name, slug, ownerId, createdAt, requireSecondFactor]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        ownerId: { type: string }
        createdAt: { type: string, format: date-time }
        requireSecondFactor: { type: boolean }

    Team:
      type: object
      required: [id, orgId, name, slug, permissions, createdAt]
      properties:
        id: { type: string }
        orgId: { type: string }
        name: { type: string }
        slug: { type: string }
        permissions:
          type: string
          enum: [read, write, admin]
        createdAt: { type: string, format: date-time }

    Agent:
      type: object
      required: [id, name, ownerId, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        ownerId: { type: string }
        model: { type: string }
        description: { type: string }
        promptHash: { type: string }
        createdAt: { type: string, format: date-time }

    AuditEntry:
      type: object
      required: [id, action, actorType, detail, createdAt]
      properties:
        id: { type: string }
        action:
          type: string
          description: |
            e.g. token.rotated, agent.created, merge.forced, deletion.requested,
            org.member.added, org.member.removed, org.member.role_changed,
            team.created, team.member.added, auth.failed
        actorType:
          type: string
          enum: [user, agent, system]
        actorId: { type: string }
        subject: { type: string }
        orgId:
          type: string
          description: The organization the event belongs to; absent for account-level events
        projectId:
          type: string
          description: The project the event happened in, when it happened in one
        detail:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }

    AuditPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        nextCursor:
          type: string
          description: Pass back as `cursor` for the next (older) page; absent on the last page

    DeletionAccepted:
      type: object
      required: [status, jobId]
      properties:
        status:
          type: string
          example: deleting
        jobId:
          type: string
          example: del_abc123

    DeletionJob:
      type: object
      required: [id, kind, state, attempts, createdAt]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [project, account]
        target:
          type: string
          description: Raw JSON of the captured deletion target
        state:
          type: string
          enum: [pending, running, verifying, completed, incomplete]
        checkpoint: { type: [string, "null"] }
        heartbeatAt: { type: [string, "null"] }
        leaseOwner: { type: [string, "null"] }
        leaseExpiresAt: { type: [string, "null"] }
        residuals:
          type: array
          items: { type: string }
        attempts: { type: integer }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"] }
        finishedAt: { type: [string, "null"] }

    BulkImportJobSummary:
      type: object
      properties:
        jobId: { type: string }
        status:
          type: string
          enum: [queued, processing, completed, failed, partial]
        totalRepos: { type: integer }
        processedRepos: { type: integer }
        successfulRepos: { type: integer }
        failedRepos: { type: integer }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        hasErrors: { type: boolean }

    BulkImportJobStatus:
      type: object
      properties:
        jobId: { type: string }
        status:
          type: string
          enum: [queued, processing, completed, failed, partial]
        totalRepos: { type: integer }
        processedRepos: { type: integer }
        successfulRepos: { type: integer }
        failedRepos: { type: integer }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        errors:
          type: array
          items:
            type: object
            properties:
              repo: { type: string }
              error: { type: string }
        progress:
          type: object
          properties:
            percentage: { type: integer }
            current: { type: integer }
            total: { type: integer }

    HealthCheckResult:
      type: object
      required: [status, latency]
      properties:
        status:
          type: string
          enum: [ok, error, degraded]
        latency:
          type: string
          example: 12ms
        message: { type: string }

    HealthCheckResponse:
      type: object
      required: [status, timestamp, checks]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        timestamp: { type: string, format: date-time }
        checks:
          type: object
          required: [database, kv, queue, artifacts]
          properties:
            database: { $ref: "#/components/schemas/HealthCheckResult" }
            kv: { $ref: "#/components/schemas/HealthCheckResult" }
            queue: { $ref: "#/components/schemas/HealthCheckResult" }
            artifacts: { $ref: "#/components/schemas/HealthCheckResult" }
