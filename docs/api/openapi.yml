  /api/projects/conflicts/{id}/resolve:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Conflict id returned by a merge that failed with MERGE_CONFLICT
    post:
      operationId: resolveConflict
      tags: [sync, changes]
      summary: Resolve a recorded merge conflict
      description: |
        Applies a resolution strategy to a conflict previously recorded by a
        failed merge and commits the result to the project. Requires project
        write access.

        The `manual` strategy is the only one that introduces content no
        evaluator has seen, so it is gated: the project's evaluator suite and
        merge protection both run on the resolution before anything is
        committed. That evaluation is pinned to the revision it read, so if a
        push lands on the default branch in between, the resolution is refused
        with `409 STALE_PROJECT` rather than committed onto the newer tip —
        re-resolve against the current revision. The `accept-*` strategies
        re-stage content that is already committed on one side of the conflict
        and are neither evaluated nor pinned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [strategy]
              properties:
                strategy:
                  type: string
                  enum: [accept-project, accept-workspace, manual]
                resolutions:
                  type: array
                  description: Required for the manual strategy
                  items:
                    type: object
                    required: [file, content]
                    properties:
                      file: { type: string }
                      content: { type: string }
      responses:
        "200":
          description: Conflict resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: resolved }
                  commitSha: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The project advanced past the revision this resolution was evaluated
            against (code STALE_PROJECT) — detected before committing, or by the
            remote refusing the commit if the project moved in between. Nothing
            was committed either way; re-resolve against the current revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Conflict not found or already resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Resolution failed to apply (or invalid file path)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: >
            An infrastructure failure while applying the resolution — most often
            a clone whose current revision could not be read, so the evaluated
            base could not be verified. Reported as 5xx rather than 422 because
            the request itself was well formed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Failed to mint repository tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/projects/{namespace}/{slug}/webhooks:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: createWebhook
      tags: [webhooks]
      summary: Create an outbound webhook
      description: |
        Requires project write access. The webhook `secret` is returned only on
        creation; receivers verify the `X-Stratum-Signature` header with it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
