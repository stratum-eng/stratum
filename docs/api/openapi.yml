        "500":
          $ref: "#/components/responses/InternalError"

  /api/orgs/{slug}/audit:
    parameters:
      - $ref: "#/components/parameters/OrgSlug"
    get:
      operationId: listOrgAudit
      tags: [orgs]
      summary: Read the organization's audit log (org admins/owner only)
      description: |
        Audit events that belong to this organization, newest first: membership
        and role changes, teams, SSO and SCIM administration, failed SSO
        sign-ins, and events on the org's projects (forced merges, webhooks,
        branches, deploy secrets and approvals, deletions). Rows recorded before
        org scoping existed are not attributed to any org and appear only in
        the instance-wide admin view.

        Paginate by passing the response's `nextCursor` back as `cursor`; it is
        absent on the last page. `format=ndjson` returns the same stream as
        `GET /api/orgs/{slug}/audit/export`.

        Plain members get 403. Non-members get the same 404 as a missing org.
      parameters:
        - $ref: "#/components/parameters/AuditAction"
        - name: actor
          in: query
          schema: { type: string }
          description: Filter by actor id
        - $ref: "#/components/parameters/AuditSince"
        - $ref: "#/components/parameters/AuditUntil"
        - $ref: "#/components/parameters/AuditCursor"
        - $ref: "#/components/parameters/AuditLimit"
        - name: format
          in: query
          schema: { type: string, enum: [json, ndjson] }
          description: "`ndjson` streams the export instead of returning one page"
      responses:
        "200":
          description: One page of audit entries (or an NDJSON stream with `format=ndjson`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/AuditEntry" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/orgs/{slug}/audit/export:
    parameters:
      - $ref: "#/components/parameters/OrgSlug"
    get:
      operationId: exportOrgAudit
      tags: [orgs]
      summary: Export the organization's audit log as NDJSON (org admins/owner only)
      description: |
        Streams every entry in `[since, until)` as newline-delimited JSON, one
        `AuditEntry` per line, newest first, as a file download. `until`
        defaults to now and `since` to 30 days before `until`; the window may
        not exceed 90 days (400 otherwise) — export longer periods in
        consecutive windows. A storage failure after the stream has started
        aborts the download rather than ending it early, so a complete file is
        always a complete window.
      parameters:
        - $ref: "#/components/parameters/AuditAction"
        - name: actor
          in: query
          schema: { type: string }
          description: Filter by actor id
        - $ref: "#/components/parameters/AuditSince"
        - $ref: "#/components/parameters/AuditUntil"
      responses:
        "200":
          description: NDJSON stream of audit entries
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/AuditEntry" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/orgs/{slug}/sso:
    parameters:
      - $ref: "#/components/parameters/OrgSlug"
    put:
      operationId: upsertSsoConnection
      tags: [sso]
      summary: Create or replace the org's OIDC SSO connection (admins/owner only)
      description: |
        Endpoints are discovered from the issuer's OIDC discovery document. The
        client secret is encrypted at rest and never echoed back. Changing the
        connection resets domain verification. Like every `/sso` endpoint,
        answers 501 when the server has no `SSO_ENCRYPTION_SECRET`; non-members
        get the same 404 as a missing org.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer, clientId, clientSecret, emailDomains]
              properties:
                issuer: { type: string, description: OIDC issuer URL }
                clientId: { type: string }
                clientSecret:
                  type: string
                  description: Accepted in request bodies only; never returned
                emailDomains:
                  type: array
                  items: { type: string }
                  description: Email domains this connection covers; each must pass DNS TXT verification before the connection can be enabled
      responses:
        "200":
          description: Connection replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SsoConnectionEnvelope" }
        "201":
          description: Connection created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SsoConnectionEnvelope" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/SsoNotConfigured"
    get:
      operationId: getSsoConnection
      tags: [sso]
      summary: Get the org's SSO connection (admins/owner only)
      responses:
        "200":
          description: Connection (secret ciphertext and SCIM token hash redacted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SsoConnectionEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/SsoNotConfigured"
    delete:
      operationId: deleteSsoConnection
      tags: [sso]
      summary: Delete the org's SSO connection (admins/owner only)
      description: Users this connection had deactivated via SCIM are re-enabled first, so deletion is a clean rollback rather than a lockout.
      responses:
        "200":
          description: Connection deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  reenabledUserIds:
                    type: array
                    items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/SsoNotConfigured"

  /api/orgs/{slug}/sso/verify-domains:
    parameters:
      - $ref: "#/components/parameters/OrgSlug"
    post:
      operationId: verifySsoDomains
      tags: [sso]
      summary: Verify the connection's email domains via DNS (admins/owner only)
      description: |
        Checks (over DNS-over-HTTPS) that each domain publishes a TXT record
        `stratum-sso-verify=<token>` at `_stratum-sso.<domain>`; the record
        details are returned by `PUT`/`GET` under `domainVerification`. All
        domains must pass in one call. Verified domains are globally unique
        across connections.
      responses:
        "200":
          description: All domains verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean }
                  domains:
                    type: array
                    items: { type: string }
                  domainsVerifiedAt: { type: string, format: date-time }
        "400":
          description: TXT record missing or incorrect (code DOMAIN_VERIFICATION_FAILED, with failedDomains)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A domain is already verified by another connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          $ref: "#/components/responses/SsoNotConfigured"

  /api/orgs/{slug}/sso/enable:
    parameters:
      - $ref: "#/components/parameters/OrgSlug"
    post:
      operationId: enableSsoConnection
      tags: [sso]
      summary: Enable the connection for sign-in and SCIM (admins/owner only)
      description: Requires verified domains; domain uniqueness is re-checked at enable time.
      responses:
        "200":
          description: Enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
        "400":
          description: Domains are not verified yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A domain is already verified by another connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          $ref: "#/components/responses/SsoNotConfigured"

  /api/orgs/{slug}/sso/disable:
    parameters:
      - $ref: "#/components/parameters/OrgSlug"
    post:
      operationId: disableSsoConnection
      tags: [sso]
      summary: Disable the connection (admins/owner only)
      description: Stops SSO sign-in and SCIM for this connection without deleting its configuration.
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/SsoNotConfigured"

  /api/orgs/{slug}/sso/scim-token:
    parameters:
      - $ref: "#/components/parameters/OrgSlug"
    post:
      operationId: rotateScimToken
      tags: [sso]
      summary: Rotate the connection's SCIM bearer token (admins/owner only)
      description: The plaintext token (`stratum_scim_*`) is returned exactly once; only its hash is stored. Rotation invalidates the previous token.
      responses:
        "200":
          description: New SCIM token
          content:
            application/json:
              schema:
                type: object
                properties:
                  scimToken:
                    type: string
                    description: The `stratum_scim_*` bearer for `/scim/v2`
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/SsoNotConfigured"

  /api/orgs/{slug}/security:
    parameters:
      - $ref: "#/components/parameters/OrgSlug"
    get:
      operationId: getOrgSecurityPolicy
      tags: [orgs]
      summary: Read the org's security policy (any member)
      description: >
        For an org admin or the owner, the response also carries
        `secondFactorImpact`: how many of the members' live credentials the
        second-factor policy refuses, whether or not it is currently on.
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSecurityPolicy" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setOrgSecurityPolicy
      tags: [orgs]
      summary: Set the org's second-factor requirement and/or IP allowlist (admins/owner only)
      description: >
        When `requireSecondFactor` is true, a member's browser session reaches
        this org's projects and `/api/orgs/{slug}/*` endpoints only if it passed
        a passkey check — or signed in through THIS org's SSO, whose IdP MFA is
        trusted. Otherwise those requests return `403 SECOND_FACTOR_REQUIRED`
        (with `org` and an `enroll` link). The policy binds only this org's
        resources: members' personal projects, other orgs and account settings
        are never affected, because membership is granted without the member's
        consent. `GET …/security` and leaving the org stay open. API tokens,
        the legacy key, agent tokens, OAuth grants and workspace remote
        credentials are held to the same rule by how the session that created
        them had signed in, which each credential records: one created without
        a second factor (including every credential created before this was
        recorded) gets `403 SECOND_FACTOR_REQUIRED` on this org's resources
        until it is created again from a session that meets the policy. Read
        `secondFactorImpact` on `GET …/security` first to see how many
        credentials that is. Turning the policy on is refused with
        `409 ADMIN_SECOND_FACTOR_REQUIRED` until the acting admin has a passkey
        (unless their session signed in through this org's SSO). Changes are
        audited as `org.second_factor_policy_changed`.


        `ipAllowlist` (IPv4/IPv6 addresses or CIDR ranges, at most 100; `[]`
        clears it) limits this org's resources — its projects including git,
        its `/api/orgs/{slug}/*` endpoints, and creating projects in it — to
        requests from inside the listed networks, for EVERY credential kind
        (sessions, API tokens, agent tokens, OAuth grants). Requests from
        outside get `403 IP_NOT_ALLOWED` (members only; anyone else gets the
        route's usual 404). The client address is `CF-Connecting-IP`; a request
        without one is refused. Anonymous reads of public projects, the SSO
        sign-in flow, SCIM and leaving the org are not restricted. Saving a list
        that excludes the caller's own address is refused with
        `409 IP_ALLOWLIST_SELF_LOCKOUT` unless `allowSelfLockout` is true.
        Changes are audited as `org.ip_allowlist_changed`; refusals as
        `org.ip_access_denied` (sampled: once per member per org per 10 minutes).


        Send either field, or both.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgSecurityPolicyUpdate" }
      responses:
        "200":
          description: The policy now in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSecurityPolicy" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The acting admin has no passkey (code ADMIN_SECOND_FACTOR_REQUIRED),
            or the IP allowlist excludes the caller's own address (code
            IP_ALLOWLIST_SELF_LOCKOUT, with the `ip` seen)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/agent-signup:
    post:
      operationId: requestAgentSignup
      tags: [agents]
      security: []
      summary: Request a Stratum account on a human's behalf (unauthenticated)
      description: |
        An agent asks for an account for the person at `email`. Stratum emails
        that address an approval link naming the agent, and returns a `userCode`
        the agent must show its human: the approval page requires it, and it is
        never in the email, so only the person working with the requesting agent
        can approve (five wrong entries end the request). Nothing is created
        until then. The response also carries a `pollToken` (shown once, stored
        only as a hash) for `POST /api/agent-signup/poll`, which returns an agent
        token owned by the new account once approved.

        Subject to the same caps as a web signup: the per-email and per-IP
        magic-link send limits (the attempt is counted before any existence
        check), and the closed-beta invite code where the instance requires one.
        An address that already has an account is refused rather than attached
        to: an existing user connects an agent from Settings or over OAuth.
        Disabled by the operator with `AGENT_SIGNUP_DISABLED=1` (404).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, agentName]
              properties:
                email: { type: string, format: email }
                username:
                  type: string
                  description: The account's username, under the same rules as web signup.
                agentName:
                  type: string
                  pattern: "^[A-Za-z0-9][A-Za-z0-9 _-]{0,63}$"
                  description: Shown to the human in the approval email and used as the agent's name.
                model:
                  type: string
                  pattern: "^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,99}$"
                  description: Optional model identifier recorded on the agent.
                inviteCode:
                  type: string
                  description: Required while the instance's closed-beta gate is on.
      responses:
        "202":
          description: Approval email sent; poll with the returned secret
          content:
            application/json:
              schema:
                type: object
                required: [signupId, status, pollToken, userCode, pollUrl, interval, expiresAt, message]
                properties:
                  signupId: { type: string }
                  status: { type: string, enum: [pending] }
                  pollToken: { type: string, description: "Secret; shown once" }
                  userCode:
                    type: string
                    example: WXYZ-4KHT
                    description: Show this to the human; they type it to approve. Never emailed.
                  pollUrl: { type: string, example: /api/agent-signup/poll }
                  interval: { type: integer, description: Suggested seconds between polls }
                  expiresAt: { type: string, format: date-time }
                  message: { type: string }
        "400":
          description: Body is not a JSON object (`INVALID_BODY`), or invalid email, username, agentName or model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Invite code missing or invalid (closed beta)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Agent signup is disabled on this instance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The address already has an account, or the username is taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Signup email send limit reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The instance cannot send email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/agent-signup/poll:
    post:
      operationId: pollAgentSignup
      tags: [agents]
      security: []
      summary: Poll an agent signup; collect the agent token once approved
      description: |
        Returns `pending` until the human approves. The first poll after
        approval returns `complete` with the agent token (shown once); every
        later poll gets 410 `ALREADY_COLLECTED`. Concurrent polls cannot both
        collect. A request expires 30 minutes after it was made, approved or not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pollToken]
              properties:
                pollToken: { type: string }
      responses:
        "200":
          description: Still pending, or complete with the agent token
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: AgentSignupPending
                    required: [status, interval, expiresAt]
                    properties:
                      status: { type: string, enum: [pending] }
                      interval: { type: integer, description: Suggested seconds between polls }
                      expiresAt: { type: string, format: date-time }
                  - type: object
                    title: AgentSignupComplete
                    required: [status, user, agent, token]
                    properties:
                      status: { type: string, enum: [complete] }
                      user:
                        type: object
                        required: [id, username]
                        properties:
                          id: { type: string }
                          username: { type: string }
                      agent:
                        type: object
                        required: [id, name, ownerId]
                        properties:
                          id: { type: string }
                          name: { type: string }
                          ownerId: { type: string }
                          model: { type: string, description: Present when the request named one }
                      token: { type: string, description: "Agent token; shown once" }
        "400":
          description: Body is not a JSON object (`INVALID_BODY`), or a missing or malformed pollToken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No request matches, or agent signup is disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: >
            Expired (`EXPIRED`), already collected (`ALREADY_COLLECTED`), or dead
            after five wrong codes on the approval page (`LOCKED`, status `locked`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get the authenticated user
      description: |
        Who the credential acts as. A user credential gets its account with
        `actingAs: user`. An MCP OAuth grant bound to an agent gets
        `actingAs: agent`, the agent, and the owner it acts for (no email). A
        bare agent token gets 401.
      responses:
        "200":
          description: Current identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  actingAs: { type: string, enum: [user, agent] }
                  id: { type: string, description: "Present when actingAs is user" }
                  email: { type: string, format: email, description: "Present when actingAs is user" }
                  username:
                    type: string
                    description: Present when actingAs is user. The caller's personal namespace is `@username`.
                  createdAt: { type: string, format: date-time, description: "Present when actingAs is user" }
                  agent:
                    type: object
                    description: Present when actingAs is agent
                    properties:
                      id: { type: string }
                      name: { type: string }
                  owner:
                    type: object
                    description: Present when actingAs is agent
                    properties:
                      id: { type: string }
                      username: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteAccount
      tags: [users]
      summary: Delete account (GDPR erasure, self-only, async)
      description: |
        Requires a confirm token equal to the caller's username. Marks the
        account as deleting (credentials are invalidated immediately) and
        enqueues the erasure cascade job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  description: Must exactly equal the caller's username.
      responses:
        "202":
          description: Erasure enqueued (jobId returned); credentials invalidated immediately
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionAccepted" }
        "400":
          description: Confirmation mismatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not authenticated, or the user no longer exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/usage:
    get:
      operationId: getMyUsage
      tags: [users]
      summary: Get the caller's metered usage for the current period
      description: |
        Read-only, and deliberately the only billing surface a token can reach:
        nothing here raises a limit, buys capacity, or attaches a payment method.

        An **agent token** reports its OWNER's allowance, because that is the
        account its evaluations are charged to.

        `used` counts platform-billed consumption only. Spend on a project's own
        provider key is reported separately in `byok` and never counted against
        an allowance. On an instance with no billing service configured — every
        self-hosted deployment — `metered` is `false` and every limit is `-1`.

        A limit of `-1` is unlimited and `0` is a plan that forbids the meter
        outright, so render words rather than computing a percentage against
        either; `percentUsed` and `remaining` are `null` in both cases.
      responses:
        "200":
          description: Usage for the current billing period
          content:
            application/json:
              schema:
                type: object
                required:
                  [subject, usedSource, plan, metered, period, resetsAt, meters, rates]
                properties:
                  subject:
                    type: object
                    description: Whose allowance this is — the enforcement subject.
                    required: [ownerId, ownerType]
                    properties:
                      ownerId: { type: string }
                      ownerType: { type: string, enum: [user, org] }
                  usedSource:
                    type: string
                    enum: [meter, ledger]
                    description: |
                      `meter` is the live enforcement counter a limit is compared
                      against. `ledger` is the recorded aggregate alone — every
                      self-hoster, and any instance whose meter binding is
                      missing or unreadable — which omits work done in an org
                      namespace, where the org is the recorded owner.
                  plan:
                    type: string
                    description: Opaque plan name; `unlimited` when there is none.
                  metered:
                    type: boolean
                    description: Whether any allowance is in force at all.
                  period: { type: string, description: "'YYYY-MM' UTC." }
                  resetsAt:
                    type: string
                    format: date-time
                    description: When the monthly meters roll over.
                  meters:
                    type: array
                    items:
                      type: object
                      required:
                        [meter, used, byok, limit, unlimited, blocked, percentUsed, remaining]
                      properties:
                        meter:
                          type: string
                          enum: [llm_tokens_month, sandbox_ms_month, deploys_month]
                        used:
                          type: number
                          description: Platform-billed consumption — the only kind a limit binds.
                        byok:
                          type: number
                          description: Spend on a project's own provider key; never counted against the limit.
                        limit: { type: integer, description: "`-1` unlimited, `0` a hard block." }
                        unlimited: { type: boolean }
                        blocked: { type: boolean }
                        percentUsed:
                          type: number
                          nullable: true
                          description: Null when there is no finite limit.
                        remaining:
                          type: number
                          nullable: true
                          description: Floored at zero; null when unlimited.
                  rates:
                    type: array
                    description: Burst ceilings. Reported as a limit only.
                    items:
                      type: object
                      required: [rate, limit, unlimited]
                      properties:
                        rate: { type: string, enum: [requests_per_minute, evaluations_per_hour] }
                        limit: { type: integer }
                        unlimited: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/rotate-token:
    post:
      operationId: rotateToken
      tags: [users]
      summary: Rotate the caller's API token
      description: >
        The old token is invalid as of this response; the new one is shown once.
        This rotates the single legacy `users.token_hash` credential, not a named
        API token — prefer `POST /api/users/me/tokens`.


        Callable with a browser session or the legacy credential itself. A
        SCOPED API token is refused with `SESSION_REQUIRED`: the key this mints
        never expires and cannot be revoked individually, so a scoped token able
        to rotate it would outlive its own revocation.
      responses:
        "200":
          description: New API token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenScopeInsufficient"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/tokens:
    get:
      operationId: listApiTokens
      tags: [users]
      summary: List the caller's API tokens
      description: >
        Never returns a token hash or plaintext — only the non-secret prefix,
        which is enough to recognise a credential already deployed somewhere.
        Requires a browser session; an API token is refused with SESSION_REQUIRED.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The caller's tokens, newest first
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: { $ref: "#/components/schemas/ApiToken" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SessionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createApiToken
      tags: [users]
      summary: Mint a named API token
      description: >
        The plaintext is returned exactly once, in this response, and is never
        stored — only its hash is. The response carries `Cache-Control: no-store`.
        Requires a browser session; an API token is refused with SESSION_REQUIRED,
        so a token can never mint another.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: A label. Not unique; uniqueness is on the hash.
                scope:
                  type: string
                  enum: [read, read_write]
                  default: read
                  description: >
                    `read` permits GET/HEAD and `git clone`/`fetch` only; every
                    other method is refused with TOKEN_SCOPE_INSUFFICIENT.
                expiresInDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                  description: Omit for a token that never expires.
                project:
                  type: string
                  example: "@alice/web"
                  description: >
                    Bind the token to this one project (`@namespace/slug`). The
                    caller must be able to read it, or the request is a 404.
                    Mutually exclusive with `org`; omit both for an
                    account-wide token.
                org:
                  type: string
                  example: acme
                  description: >
                    Bind the token to the projects owned by this organization
                    (its slug). The caller must be a member, or the request is a
                    404. Mutually exclusive with `project`.
      responses:
        "201":
          description: The token, plus its plaintext (shown only here)
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `no-store`
          content:
            application/json:
              schema:
                type: object
                required: [token, plaintext]
                properties:
                  token: { $ref: "#/components/schemas/ApiToken" }
                  plaintext:
                    type: string
                    description: The `stratum_user_…` credential. Shown once, never again.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Token management needs a browser session (`SESSION_REQUIRED`), or
            the session has not met the second-factor policy of an org the
            token could reach (`SECOND_FACTOR_REQUIRED`): an unbound token, or
            one bound to that org or its projects.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: >
            The requested `project` or `org` does not exist, or the caller
            cannot reach it — the two are deliberately indistinguishable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            The caller already holds the maximum of 20 active tokens
            (code TOKEN_LIMIT_REACHED). Revoked tokens do not count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/tokens/{id}:
    delete:
      operationId: revokeApiToken
      tags: [users]
      summary: Revoke one of the caller's API tokens
      description: >
        A soft revoke: the row is kept for the audit trail and stops
        authenticating immediately. Scoped by owner, so another user's token id
        is indistinguishable from one that does not exist. Requires a browser
        session.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Token id
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SessionRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/passkeys:
    get:
      operationId: listPasskeys
      tags: [users]
      summary: List the caller's passkeys and unused recovery-code count
      description: >
        Passkeys (WebAuthn credentials) are the second factor of interactive
        sign-in. Every `/api/users/me/passkeys*` endpoint requires a browser
        session; an API token gets `403 SESSION_REQUIRED`. Key material is
        never returned.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The caller's passkeys
          content:
            application/json:
              schema:
                type: object
                required: [passkeys, recoveryCodesRemaining]
                properties:
                  passkeys:
                    type: array
                    items: { $ref: "#/components/schemas/Passkey" }
                  recoveryCodesRemaining: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SessionRequired"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/passkeys/registration/options:
    post:
      operationId: beginPasskeyRegistration
      tags: [users]
      summary: Begin a passkey registration ceremony
      description: >
        Returns `PublicKeyCredentialCreationOptionsJSON` for
        `navigator.credentials.create()`. The challenge is single-use and
        expires after 5 minutes. Requires a session minted in the last 15
        minutes and — once the account has a passkey — one that used it;
        otherwise `403 REAUTHENTICATION_REQUIRED`.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: WebAuthn creation options (JSON-serialized, base64url fields)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReauthenticationRequired"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/passkeys/registration/verify:
    post:
      operationId: finishPasskeyRegistration
      tags: [users]
      summary: Verify the registration and save the passkey
      description: >
        Verifies the authenticator's response against the challenge issued by
        `registration/options` (consuming it). On the account's FIRST passkey
        the response also carries ten one-time `recoveryCodes` — shown exactly
        once, stored only as hashes — and the calling session is marked as
        second-factor verified. Audited as `passkey.registered`.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                name: { type: string, maxLength: 64 }
                response:
                  type: object
                  description: The `RegistrationResponseJSON` from the browser
                  additionalProperties: true
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [passkey]
                properties:
                  passkey: { $ref: "#/components/schemas/Passkey" }
                  recoveryCodes:
                    type: array
                    items: { type: string }
                  recoveryCodesError:
                    type: string
                    description: >
                      Present when the passkey was saved but its first recovery
                      codes could not be issued; generate them with
                      `POST /api/users/me/passkeys/recovery-codes`.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReauthenticationRequired"
        "409":
          description: This authenticator is already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/passkeys/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [users]
      summary: Replace the caller's recovery codes
      description: >
        Issues ten new one-time recovery codes (returned once) and invalidates
        the previous set. Same fresh-session rule as registration. `409
        NO_PASSKEY` when the account has no passkey.
      security:
        - sessionCookie: []
      responses:
        "201":
          description: New codes
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes:
                    type: array
                    items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReauthenticationRequired"
        "409":
          description: No passkey registered (code NO_PASSKEY)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/passkeys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Passkey id
    patch:
      operationId: renamePasskey
      tags: [users]
      summary: Rename a passkey
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                type: object
                properties:
                  renamed: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SessionRequired"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removePasskey
      tags: [users]
      summary: Remove a passkey
      description: >
        Same fresh-session rule as registration. Removing the LAST passkey
        also deletes the recovery codes (and any org requiring a second factor
        then withholds its own resources until the user enrolls again).
        Audited as `passkey.removed`.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: string }
                  remaining: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReauthenticationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/legacy-token/disable:
    post:
      operationId: disableLegacyToken
      tags: [users]
      summary: Disable the legacy (pre-scopes) API token
      description: >
        Rotates `users.token_hash` to a value that is never returned to anyone,
        making the single unnamed, never-expiring credential minted by
        `POST /api/users/me/rotate-token` permanently unusable. Named API tokens
        are unaffected. Requires a browser session.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The legacy token no longer authenticates
          content:
            application/json:
              schema:
                type: object
                required: [disabled]
                properties:
                  disabled: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SessionRequired"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/delete:
    post:
      operationId: deleteAccountForm
      tags: [users]
      summary: Delete account (form-friendly alias of DELETE /api/users/me)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string }
      responses:
        "202":
          description: Erasure enqueued (JSON callers)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionAccepted" }
        "302":
          description: Redirect to home (form callers)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/users/check-username:
    get:
      operationId: checkUsername
      tags: [users]
      summary: Check whether a username is available
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  message: { type: string }
        "400":
          description: Missing or invalid username (same body shape, available=false)
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  message: { type: string }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/agents:
    post:
      operationId: createAgent
      tags: [agents]
      summary: Register an agent and mint its token
      description: The agent token is returned once, on creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                model: { type: string }
                description: { type: string }
                promptHash: { type: string }
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { $ref: "#/components/schemas/Agent" }
                  token:
                    type: string
                    description: Plaintext agent token, shown once
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            A scoped API token or OAuth grant cannot create agents
            (`SESSION_REQUIRED`). A read-only one is refused earlier by the
            scope check, with `TOKEN_SCOPE_INSUFFICIENT`. A session that has
            not met an org's second-factor policy is refused with
            `SECOND_FACTOR_REQUIRED`, because an agent can reach that org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listAgents
      tags: [agents]
      summary: List the caller's agents
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/agents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get an agent (owner only)
