        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/bulk-import/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getBulkImportJob
      tags: [bulk-import]
      summary: Get bulk import job status
      responses:
        "200":
          description: Job status with progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkImportJobStatus" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/webhooks/github:
    post:
      operationId: receiveGitHubWebhook
      tags: [github]
      summary: GitHub webhook receiver
      description: |
        Inbound receiver for GitHub `push`, `pull_request`,
        `pull_request_review`, and `ping` events. Authenticated by HMAC
        signature (`X-Hub-Signature-256`) against the configured webhook
        secret, not by bearer token. Requires `X-GitHub-Event` and
        `X-GitHub-Delivery` headers; duplicate delivery ids are skipped.
        Processing errors still return 200 to prevent GitHub retries.
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: { type: string }
        - name: X-GitHub-Event
          in: header
          required: true
          schema: { type: string }
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw GitHub webhook payload for the event type
      responses:
        "200":
          description: Received (possibly a duplicate, or with a logged processing error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  duplicate: { type: boolean }
                  error: { type: string }
        "400":
          description: Missing headers or invalid JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: Webhook secret not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/github/installations:
    get:
      operationId: listGitHubAppInstallations
      tags: [github]
      summary: List GitHub App installations the caller can manage
      description: |
        Installations linked to the caller or to an org they administer. A
        browser session also sees the installations GitHub said it could link
        the last time it asked from `/github/app/setup` (kept ten minutes); an
        API token never does. Who installed the app is not a way onto this
        list. Users only; unreachable with a project- or org-bound token.
      responses:
        "200":
          description: Installations
          content:
            application/json:
              schema:
                type: object
                properties:
                  githubLinked:
                    type: boolean
                    description: Whether the caller's Stratum account has a GitHub account linked
                  linkingConfigured:
                    type: boolean
                    description: |
                      Whether the operator has set `GITHUB_APP_CLIENT_ID` and
                      `GITHUB_APP_CLIENT_SECRET`. When `false`, every link
                      attempt is refused with 501.
                  installations:
                    type: array
                    items:
                      type: object
                      properties:
                        installationId: { type: integer }
                        account:
                          type: object
                          properties:
                            login: { type: string }
                            type: { type: string, description: "`User` or `Organization`" }
                        suspended: { type: boolean }
                        linkedTo: { type: [string, "null"] }
                        canLink:
                          type: boolean
                          description: |
                            Whether this caller may start a link. Always
                            `false` for an API token. Control of the
                            installation is confirmed with GitHub on every
                            attempt, not by this flag.
                        canUnlink: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/github/installations/{installationId}/link:
    post:
      operationId: linkGitHubAppInstallation
      tags: [github]
      summary: Start linking a GitHub App installation to a Stratum owner
      description: |
        Starts the GitHub round trip that links an installation; it links
        nothing by itself. Once linked, projects owned by the target use the
        installation's token for outbound GitHub calls on its repositories.

        Control is proven with GitHub at the moment of linking. The caller is
        sent to the app's authorization page (`authorizeUrl`), and on return to
        `/github/app/callback` Stratum asks GitHub what they manage right now:
        the installation must be listed for them, and they must be an active
        `admin` (owner) of the organization it is installed on, or be the
        personal account it is installed on. Who installed the app decides
        nothing. The GitHub user token this round trip obtains is used for that
        one request, never stored or logged, and revoked afterwards. (A person
        who separately connects their GitHub account does have an
        authorization stored, encrypted, for opening the pull requests they
        promote; linking never reads or changes it.)

        Requires a browser session: a token cannot be walked through GitHub's
        authorization page and is refused with 403 (`BROWSER_REQUIRED`). The
        target is the caller's personal account, or an org they administer.
        The outcome arrives as `?notice=` on the redirect back to
        `/github/app/setup` (`linked`, `not_found`, `not_authorized`,
        `linked_elsewhere`, ...). Accepts JSON, or a form post, which is
        redirected straight to GitHub.
      parameters:
        - name: installationId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                org:
                  type: string
                  description: Org slug; omit or empty for the caller's personal account
      responses:
        "200":
          description: The round trip was started; send the browser to `authorizeUrl`
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  authorizeUrl:
                    type: string
                    format: uri
                    description: GitHub's authorization page, carrying a single-use `state` bound to this session
        "303":
          description: |
            Form submission; redirects to GitHub, or back to the setup page
            with a `notice` when refused
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            `BROWSER_REQUIRED` (authenticated by a token),
            `GITHUB_ACCOUNT_REQUIRED` (no GitHub account connected),
            `SECOND_FACTOR_REQUIRED` or `IP_NOT_ALLOWED` (the target org's
            policy is not met)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          description: |
            `NOT_CONFIGURED`: the operator has not set `GITHUB_APP_CLIENT_ID`
            and `GITHUB_APP_CLIENT_SECRET`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/github/installations/{installationId}/unlink:
    post:
      operationId: unlinkGitHubAppInstallation
      tags: [github]
      summary: Unlink a GitHub App installation
      description: |
        Allowed for the linked user, or an admin of the linked org (whose
        session meets that org's second-factor policy). Afterwards no project
        uses the app on its repositories, unless an operator binding in
        `GITHUB_ALLOWED_OWNERS` covers them.
      parameters:
        - name: installationId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Unlinked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  installationId: { type: integer }
        "303":
          description: Form submission; redirects to the setup page
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

