                properties:
                  added: { type: boolean }
                  orgId: { type: string }
                  userId: { type: string }
                  role: { type: string, enum: [member, admin] }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/orgs/{slug}/members/{uid}:
    parameters:
      - $ref: "#/components/parameters/OrgSlug"
      - name: uid
        in: path
        required: true
        schema: { type: string }
        description: User id of the member to remove
    delete:
      operationId: removeOrgMember
      tags: [orgs]
      summary: Remove an organization member (admins), or leave the org (any member)
      description: >
        An org admin may remove any member. Any member may remove THEMSELVES
        (`{uid}` = own user id), and this is never blocked by the org's
        second-factor policy. The owner cannot leave (`409 OWNER_CANNOT_LEAVE`).
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: boolean }
                  orgId: { type: string }
