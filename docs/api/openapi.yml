  /api/projects/{namespace}/{slug}/issues:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: createIssue
      tags: [issues]
      summary: Open an issue
      description: Anyone who can read the project can open issues. Also accepts form bodies (which redirect on success).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 20000 }
                linkedChangeId:
                  type: string
                  description: Must reference a change in this project
      responses:
        "201":
          description: Issue created
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue: { $ref: "#/components/schemas/Issue" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TargetDeleting"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listIssues
      tags: [issues]
      summary: List issues
      description: |
        Filterable by status, label, assignee, and free-text search (`q`, a
        case-insensitive substring match over title + body). Paginate with
        `limit` + `offset`; results are ordered newest-first by issue number.
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, closed] }
        - name: label
          in: query
          description: Only issues carrying this exact label
          schema: { type: string }
        - name: assignee
          in: query
          description: Only issues assigned to this user id
          schema: { type: string }
        - name: q
          in: query
          description: Substring search over title and body (max 200 chars; % and _ match literally)
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
        - name: offset
          in: query
          description: Rows to skip (LIMIT/OFFSET pagination)
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: Issues
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items: { $ref: "#/components/schemas/Issue" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/issues/{number}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Slug"
      - name: number
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getIssue
      tags: [issues]
      summary: Issue detail
      security: [{ bearerAuth: [] }, {}]
      responses:
        "200":
          description: Issue
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue: { $ref: "#/components/schemas/Issue" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateIssue
      tags: [issues]
      summary: Edit, close, reopen, label, or assign an issue
      description: Requires project write access. Users only (agent tokens cannot edit issues).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 20000 }
                status: { type: string, enum: [open, closed] }
                linkedChangeId:
                  type: [string, "null"]
                  description: Set to null or "" to unlink
                assignee:
                  type: [string, "null"]
                  description: Single assignee (user id); set to null or "" to unassign
                labels:
                  type: array
                  maxItems: 20
                  items: { type: string, maxLength: 50 }
                  description: |
                    Replaces the issue's full label set (add/remove by sending the
                    desired set); [] clears all labels. Omit to leave labels unchanged.
      responses:
        "200":
          description: Updated issue
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue: { $ref: "#/components/schemas/Issue" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{namespace}/{slug}/issues/{number}/comments:
    parameters:
      - $ref: "#/components/parameters/Namespace"
