# =============================================================================
# Stratum Worker configuration
#
# The TOP-LEVEL config below is a GENERIC self-hosting template. To run your own
# instance: replace the binding ids (KV/D1) with your own, set your domain/OAuth
# values, then `wrangler deploy`.
#
# The maintainer's hosted instance is NOT the default — it lives in
# [env.production] (and [env.staging]) and is deployed with:
#   wrangler deploy --env production
# See .github/workflows/deploy-production.yml and ci.yml.
# =============================================================================

name = "stratum"
main = "src/index.ts"
compatibility_date = "2026-04-29"
compatibility_flags = ["nodejs_compat"]

# --- EU-only (or US-only) deployment ------------------------------------------
# Follow "Deploying EU-only" in docs/user-guide/trust.md IN ORDER before the
# first deploy; the pieces that live in this file are marked "EU-only:" below.
# It is for a FRESH instance: every storage jurisdiction is fixed at creation,
# and DO_JURISDICTION makes existing Durable Object state unreachable.
#
# EU-only: serve on a custom domain only. Cloudflare's Regional Services does
# not cover *.workers.dev, so that hostname must not exist. `preview_urls` has
# to be set explicitly as well — disabling workers_dev alone does not disable
# version/preview URLs, which are served on workers.dev too.
# These three are per environment. If you deploy with `--env <name>`, set them
# inside [env.<name>] instead: the named environments below set
# `workers_dev = true` and their own routes, and do not inherit these.
# workers_dev = false
# preview_urls = false
# routes = [{ pattern = "stratum.example.eu", custom_domain = true }]

# Durable Object migrations — defined once, inherited by all environments.
[[migrations]]
tag = "v1"
new_classes = ["MergeQueue"]

# RepoDO: per-repo ref authority (ADR 004, Phase 1). SQLite-backed so it can hold
# the ref + a hot object index. One-way migration; rollback is the REPO_DO_ENABLED
# kill switch, not class removal. Migrations are declared once here and apply to
# every env; only the per-env bindings below differ (script_name).
[[migrations]]
tag = "v2"
new_sqlite_classes = ["RepoDO"]

# MagicLinkRateLimiter: serialized magic-link send counters (issue #283). One
# instance per subject (email digest / source IP); replaces the KV counters,
# whose read-modify-write could not hold the cap under concurrency.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["MagicLinkRateLimiter"]

# UsageMeter: serialized usage counters, one instance per ENFORCEMENT subject
# (PRD §4a — the acting user, or an org positively known to be paid). SQLite-backed
# like the two above. APPEND ONLY: tags are recorded on the deployed script, so
# editing or reordering one makes wrangler replay the chain and every deploy of
# that environment fails with error 10074 — see tests/wrangler-migration-chain.test.ts.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["UsageMeter"]

# Observability - Workers Logs and Traces
[observability]
enabled = true
head_sampling_rate = 1.0

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# --- Bindings: replace the ids with your own Cloudflare resources -------------
# EU-only: create the namespace with a jurisdiction BEFORE the first project
# exists (REST API; see docs/user-guide/trust.md). A namespace that does not
# exist yet is created automatically, unrestricted, by the first repo in it,
# and a namespace's jurisdiction can never be changed.
[[artifacts]]
binding = "ARTIFACTS"
namespace = "stratum"

[[kv_namespaces]]
binding = "STATE"
id = "0000000000000000000000000000000a"  # replace: wrangler kv namespace create STATE
# EU-only: npx wrangler@latest kv namespace create STATE --jurisdiction=eu
# Covers where KV data is durably stored; Cloudflare says cached copies can
# still sit outside the jurisdiction.

# Request rate limits (src/middleware/rate-limit.ts). Counted per Cloudflare
# location, in memory: a check costs no KV round trip, which the KV counter it
# replaced paid twice on every request. A limit with no binding here (a plan's
# own rate, or a self-host that omits these) falls back to the KV counter.
# namespace_id is account-wide, so every environment has its own range.
[[ratelimits]]
name = "RATE_LIMIT_ANON"  # signed-out requests
namespace_id = "3031"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_AUTH"  # signed-in users and agents
namespace_id = "3032"
simple = { limit = 1000, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_ANALYTICS"  # analytics ingest
namespace_id = "3033"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_STRICT"  # routes that pass requestsPerMinute: 20 (POST /projects)
namespace_id = "3034"
simple = { limit = 20, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "stratum"
database_id = "00000000-0000-0000-0000-00000000000a"  # replace: wrangler d1 create stratum
# EU-only: wrangler d1 create stratum --jurisdiction=eu
# (not --location=weur: a location hint is best-effort, not a guarantee)
migrations_dir = "migrations"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "stratum_requests"

# Durable backup store (D1 dumps, KV identity, repo packs). Provision both the
# production and staging buckets:
#   wrangler r2 bucket create stratum-backups
#   wrangler r2 bucket create stratum-backups-staging
#
# Backup tuning vars (all optional; set them in the env's [vars] block, since
# named envs inherit no vars — see docs/runbooks/backup-restore.md):
#   BACKUP_RETENTION        whole runs to keep (default 14)
#   MAX_REPOS_PER_RUN       rotating repos snapshotted per run (default 25)
#   MAX_BACKUP_BYTES        per-repo object budget (default 128 MiB)
#   BACKUP_PINNED_PROJECTS  comma-separated "@namespace/slug" projects included in
#                           EVERY run, on top of MAX_REPOS_PER_RUN, e.g.
#                           BACKUP_PINNED_PROJECTS = "@stratum/stratum,@jordan/dotfiles"
#                           Malformed or unknown entries are logged and skipped.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "stratum-backups"
# EU-only: wrangler r2 bucket create stratum-backups --jurisdiction=eu
# and name the jurisdiction on EVERY r2 binding (REPO_OBJECTS too, if bound):
# jurisdiction = "eu"

# EU-only: Cloudflare documents no location control for Workers AI inference.
# Remove this binding to keep the `llm` evaluator from running on it.
[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "MERGE_QUEUE"
class_name = "MergeQueue"
script_name = "stratum"

[[durable_objects.bindings]]
name = "REPO_DO"
class_name = "RepoDO"
script_name = "stratum"

[[durable_objects.bindings]]
name = "MAGIC_LINK_LIMITER"
class_name = "MagicLinkRateLimiter"
script_name = "stratum"

[[durable_objects.bindings]]
name = "USAGE_METER"
class_name = "UsageMeter"
script_name = "stratum"

# EU-only: create EVERY queue below, dead-letter queues included, with a
# jurisdiction before the first deploy:
#   npx wrangler@latest queues create <name> --jurisdiction eu
# That restricts where Queues stores and processes the messages. It does NOT
# restrict where this Worker's queue() handler runs — Cloudflare offers no
# control for that, nor for the cron handlers under [triggers].
[[queues.producers]]
binding = "EVENTS_QUEUE"
queue = "stratum-events"

[[queues.producers]]
binding = "IMPORT_QUEUE"
queue = "stratum-imports"

# Post-merge deployments. Create both queues before the first deploy:
#   wrangler queues create stratum-deploys
#   wrangler queues create stratum-deploys-dlq
[[queues.producers]]
binding = "DEPLOY_QUEUE"
queue = "stratum-deploys"

# Evaluation runs (#412, ADR 009). Change creation and re-evaluation enqueue a
# run here instead of evaluating on the request. Create before the first deploy:
#   wrangler queues create stratum-evaluations
#   wrangler queues create stratum-evaluations-dlq
# Unbound, evaluation falls back to running inline on the request.
[[queues.producers]]
binding = "EVALUATION_QUEUE"
queue = "stratum-evaluations"

# Push mirror to GitHub (#417). Create before the first deploy:
#   wrangler queues create stratum-mirrors
# Unbound, mirrors are pushed by the five-minute sweep instead, so they lag a
# merge by up to that long. No dead-letter queue on purpose: a message is only
# a nudge, the work is the `push_mirrors` row, and the sweep re-sends it.
[[queues.producers]]
binding = "MIRROR_QUEUE"
queue = "stratum-mirrors"

[[queues.consumers]]
queue = "stratum-events"

[[queues.consumers]]
queue = "stratum-imports"
max_batch_size = 1  # Process imports one at a time for resource management
max_retries = 3     # Retry failed imports up to 3 times
retry_delay = 30    # Wait 30 seconds between retries

# Every knob is set explicitly because the defaults are wrong for a deploy:
# a batch of 10 would share one invocation's subrequest budget between ten
# provider uploads, and 3 retries on a message the consumer only ever retries
# for an *indeterminate* failure just delays the DLQ.
#
# visibility_timeout_ms bounds one deployment: MAX_SUBREQUESTS provider requests
# for a tree of up to MAX_TOTAL_BYTES, both in `src/deploy/limits.ts`. Raise
# those limits and this MUST rise with them — a run that outlives its lease is
# redelivered while still uploading, and the second copy races the first.
#
# max_concurrency is 1, and must stay 1: concurrent invocations share one
# isolate's 128 MiB, one Vercel deploy peaks near 92 MiB of that (the tree, its
# base64 copy, and the request body), and an OOM kill happens *before* the
# runner's `finally` can write a terminal status. See MAX_DEPLOY_CONCURRENCY in
# `src/deploy/limits.ts` for the arithmetic and for the price — this serializes
# Cloudflare deploys too.
[[queues.consumers]]
queue = "stratum-deploys"
max_batch_size = 1
max_concurrency = 1
max_retries = 2
retry_delay = 60
visibility_timeout_ms = 900000  # 15 min; see src/deploy/limits.ts
dead_letter_queue = "stratum-deploys-dlq"

# One run per invocation: a sandbox evaluation and an LLM call share the
# invocation's subrequest budget and wall clock, and a batch would split both.
# max_retries = 2 is MAX_EVALUATION_DELIVERIES - 1 in
# `src/services/evaluation-run.ts`: the consumer fails the run closed on its
# last delivery rather than leaving the change `evaluating`, so the DLQ only
# ever holds a message whose consumer crashed outright. The five-minute
# evaluation-sweep recovers those runs from D1 whatever the queue did.
[[queues.consumers]]
queue = "stratum-evaluations"
max_batch_size = 1
max_retries = 2
retry_delay = 30
dead_letter_queue = "stratum-evaluations-dlq"

# One push per invocation, and one invocation at a time: a push clones the
# repository into the isolate's memory (full history on a first push), and
# concurrent invocations share that memory — the same bound, for the same
# reason, as stratum-deploys. Pushes for ONE project are already serialized by
# the lease in `push_mirrors`; this serializes across projects.
#
# max_retries covers MIRROR_MAX_ATTEMPTS in `src/github/mirror.ts` with one to
# spare. The consumer chooses each retry's delay itself (exponential backoff),
# so retry_delay is only the fallback for a consumer that crashed outright.
[[queues.consumers]]
queue = "stratum-mirrors"
max_batch_size = 1
max_concurrency = 1
max_retries = 6
retry_delay = 60

# "0 4 * * *"   — daily backup, on its OWN trigger so the ~15-min invocation
#                 budget is never shared with (and starved by) the sync/TTL work
# "0 6 * * *"   — daily housekeeping: workspace TTL sweep + auto-sync +
#                 pruning import jobs that finished outside the retention window
# "*/5 * * * *" — event outbox sweep (re-enqueue stale pending events) and the
#                 import stall sweep (move wedged import jobs to a terminal state)
[triggers]
crons = ["0 4 * * *", "0 6 * * *", "*/5 * * * *"]

# Email Sending — configure via: wrangler email sending enable yourdomain.com
[[send_email]]
name = "EMAIL"

# Sandboxes binding — beta feature, only available with Cloudflare Sandboxes access
# [[sandboxes]]
# binding = "SANDBOX"

[vars]
# Browser analytics: PostHog's project token (`phc_…`), loaded in users' browsers.
# A plain var, NOT a secret — it ships in every page of HTML, and calling it a
# secret is how a personal API key (`phx_…`) ends up published. Deliberately
# separate from POSTHOG_API_KEY: enabling server-side telemetry must never
# silently start running third-party JS in your users' browsers. Unset = no
# analytics script is served to anyone.
# POSTHOG_PUBLIC_KEY = "phc_..."
POSTHOG_HOST = "https://app.posthog.com"
# Labels this deployment on every analytics event, so staging traffic can be
# told apart from production's in one PostHog project. Any string; events from
# an instance that leaves it unset report `environment: "unknown"`.
STRATUM_ENVIRONMENT = "development"
# Enables the /dev-login session backdoor for local `wrangler dev` only. Named
# envs do NOT inherit top-level vars, so staging/production (which re-declare
# their own [vars]) leave this unset and the route stays inert there.
DEV_LOGIN_ENABLED = "true"
# RepoDO fast-forward path (ADR 004, Phase 1). Default off: merges take the proven
# cold path. Flip to "true" to enable the fast-forward ref authority (and to run
# the benchmark "after" number). This is the kill switch / rollback.
REPO_DO_ENABLED = "false"
# EU-only: restrict every Durable Object (all four classes) to a Cloudflare
# jurisdiction: "eu", "us" or "fedramp". Unset, or set to the empty string, =
# no restriction. Otherwise the value must match exactly — any other non-empty
# value makes every request answer 503 rather than run unrestricted. A
# restricted namespace addresses DIFFERENT objects, so set this
# before the first deploy and never change it afterwards. Named envs do NOT
# inherit top-level vars: deploying with --env requires it in that env's
# [env.<name>.vars] block too, or the deployed Worker is silently unrestricted.
# DO_JURISDICTION = "eu"
# The canonical public URL of this instance. Check runs (#414) put it in the
# `callbackUrl` a project's CI runner reports to, and an instance that evaluates
# on the evaluation queue has no request to take an origin from — so without it
# every dispatched check is `errored` with a summary naming this setting. It
# also pins the passkey relying party (see docs/user-guide/passkeys.md), so set
# it to the hostname users already sign in on. Declare it PER ENVIRONMENT:
# named envs do not inherit top-level vars.
# APP_URL = "https://stratum.example.com"
#
# First-party CI (#415, docs/user-guide/ci.md). Optional: without it a project
# with a `.stratum/ci.yaml` gets `errored` checks naming what is missing, and
# everything else works as before. The executor is a SEPARATE Worker
# (`ci-executor/`), deployed first. Two things connect Stratum to it:
#
# 1. A secret shared with the executor, at least 32 characters. It signs the
#    job dispatch, verifies the executor's reports, and signs log requests:
#      wrangler secret put CI_EXECUTOR_SECRET
# 2. How to reach it. Preferably the service binding below, which keeps the
#    dispatch (it carries a short-lived repository token) off the public
#    internet. Declare it PER ENVIRONMENT (`[[env.<name>.services]]`); a named
#    env does not inherit top-level bindings, and each env should have its own
#    executor and its own secret:
#      [[services]]
#      binding = "CI_EXECUTOR"
#      service = "stratum-ci-executor"
#    Or, for an executor that is not on this account, its https URL:
#      CI_EXECUTOR_URL = "https://ci-executor.example.com"
# `APP_URL` above must also be set: it is where the executor reports, and must
# equal the executor's own STRATUM_ORIGIN.
# Set these to your own host when self-hosting (and register the callback URLs
# in your GitHub/Google OAuth apps):
OAUTH_REDIRECT_URI = "http://localhost:8787/auth/github/callback"
GOOGLE_REDIRECT_URI = "http://localhost:8787/auth/google/callback"
# Closed-beta gate (hosted-only; leave unset/commented for ungated self-hosting).
# The gate turns ON only when BETA_GATE = "1" AND REFERRAL_SERVICE_URL is set.
#
# The referral service must serve three endpoints:
#   POST /api/referral/validate  {code}                 -> {valid, referrerUserId}
#   POST /api/referral/admit     {userId,email,code,source} -> {codes[], referrerUserId}
#   GET  /api/referral/codes?userId=…                   -> {codes: [{code, redeemedAt, redeemedBy}]}
# The last two authenticate with `Authorization: Bearer $REFERRAL_SERVICE_SECRET`.
# `/codes` backs the invite list on /profile; a bare string per entry is also
# accepted, matching what /admit returns. REFERRAL_SERVICE_URL alone (without
# BETA_GATE) still enables that listing, so codes minted while the gate was on
# stay visible to their owners after it is switched off.
# BETA_GATE = "1"
# REFERRAL_SERVICE_URL = "https://your-referral-service.example.com"

# --- Usage metering, entitlements, and evaluator BYOK -------------------------
# Every var in this group must be declared PER ENVIRONMENT: named envs do NOT
# inherit top-level [vars] (the same footgun as the telemetry kill switch just
# below), so setting one here only affects a bare `wrangler deploy`.
#
# Plan/entitlements service (hosted-only). The hook is live only when BOTH
# BILLING_SERVICE_URL and the BILLING_SERVICE_SECRET secret are set — see
# `entitlementsEnabled` in src/billing/entitlements.ts, which treats a URL
# without a credential as OFF rather than half-on. Unset, the default for every
# self-hoster: nothing is fetched, every owner resolves to unlimited, and the
# usage counters record without limiting anything.
# BILLING_SERVICE_URL = "https://your-billing-service.example.com"
#
# "1" makes entitlement decisions REFUSE rather than only record. Declared "0"
# explicitly rather than left unset so the enforcement switch is visible in each
# environment's config instead of inferred from an absence — the same reason
# DEV_LOGIN_ENABLED is spelled out per env. Setting it WITHOUT
# BILLING_SERVICE_URL is enforcement that looks on and does nothing;
# `entitlementsConfigError` (src/middleware/config-guard.ts) logs exactly that.
ENTITLEMENTS_ENFORCE = "0"
#
# The evaluator's provider allowlist, and the ONLY place a provider endpoint may
# be named. A project's .stratum/policy.yaml SELECTS one of these by name
# (`evaluators: [{type: llm, provider: anthropic}]`) and can never supply a
# `baseUrl`, so a project owner cannot aim the operator's Worker at a host of
# their choosing. An unrecognized name fails the policy closed and blocks that
# project's merges — a merge gate that cannot run must not pass — and never
# falls back to Workers AI, which would move the spend back onto this bill.
#
# Parsed once per isolate by `parseLlmProviders` (src/evaluation/llm-providers.ts)
# and validated there, not per request: `kind` must be "anthropic" or
# "openai-compatible", `baseUrl` must be https with no embedded credentials, and
# a loopback, link-local, CGNAT, .internal/.local or RFC1918 host is rejected.
# `baseUrl` must include the API version path — the provider appends "/messages"
# (anthropic) or "/chat/completions" (openai-compatible) to it, so
# "https://api.anthropic.com" without the "/v1" 404s on every call. One bad entry rejects the
# whole value — every project selecting a provider then blocks, projects on
# Workers AI are unaffected, and `llmProvidersConfigError` logs the reason on the
# first request after the deploy.
#
# Unset (the default) means Workers AI (`env.AI`) only. Credentials are NOT here:
# each project stores its own key in `project_secrets` under the name derived
# from the provider — "anthropic" reads ANTHROPIC_API_KEY — encrypted under
# DEPLOY_SECRET_KEY. That coupling is deliberate (PRD Open Question 4: one key,
# not two) and it WIDENS that key's blast radius — rotating it already makes
# every deploy secret undecryptable, and now blocks the merge gate on every BYOK
# project until each re-enters its provider key. See the rotation warning in
# docs/user-guide/deployments.md.
# LLM_PROVIDERS = '[{"name":"anthropic","kind":"anthropic","baseUrl":"https://api.anthropic.com/v1"}]'

# Instance-wide telemetry kill switch. Not a secret — a plain var, listed here
# next to POSTHOG_API_KEY because they are read together. Named envs do NOT
# inherit top-level vars, so uncommenting this alone only affects a bare
# `wrangler deploy`; to disable telemetry on a named env you MUST also uncomment
# it in that env's own [env.<name>.vars] block below.
# STRATUM_TELEMETRY_DISABLED = "true"

# Ask for telemetry consent at signup (#257). "true" shows an unticked box on
# the signup forms and creates each NEW account opted out unless it was ticked;
# accounts made with nobody to ask (SCIM, SSO just-in-time) start opted out.
# Unset, the default, leaves signup as it was: no box, new accounts opted in.
# Existing accounts are never changed either way. Like every var here it is
# per-env: the hosted instance sets it in [env.production.vars] and
# [env.staging.vars] below.
# TELEMETRY_CONSENT_AT_SIGNUP = "true"

# Secrets — set via: wrangler secret put <NAME>
# POSTHOG_API_KEY =  # telemetry sends route patterns only, never concrete paths
# GITHUB_CLIENT_ID =
# GITHUB_CLIENT_SECRET =
# GOOGLE_CLIENT_ID =
# GOOGLE_CLIENT_SECRET =
# EMAIL_FROM_ADDRESS = "noreply@yourdomain.com"  # for magic link emails
# REFERRAL_SERVICE_SECRET =  # closed-beta gate shared secret (must match the referral service)
# BILLING_SERVICE_SECRET =  # entitlements service shared secret; without it BILLING_SERVICE_URL is inert
# SSO_ENCRYPTION_SECRET =  # encrypts org SSO client secrets at rest; unset → SSO endpoints 501
# DEPLOY_SECRET_KEY =  # master key for per-project deploy secrets; rotating it makes every stored secret undecryptable

# =============================================================================
# [env.production] — the maintainer's hosted instance (app.usestratum.dev).
# Deploy with: wrangler deploy --env production
# Named environments do NOT inherit top-level bindings/vars/routes, so the real
# configuration is fully declared here.
# =============================================================================
[env.production]
name = "stratum"
# Keep the *.workers.dev URL enabled alongside the custom domain (wrangler
# disables it by default once `routes` is set). The deploy smoke tests hit it.
workers_dev = true

# Production custom domain. With custom_domain = true, Cloudflare provisions the
# DNS record + TLS cert for this hostname on deploy. workers.dev keeps working.
routes = [
  { pattern = "app.usestratum.dev", custom_domain = true }
]

[env.production.observability]
enabled = true
head_sampling_rate = 1.0

[env.production.observability.traces]
enabled = true
head_sampling_rate = 0.1

[[env.production.artifacts]]
binding = "ARTIFACTS"
namespace = "stratum-prod"

[[env.production.kv_namespaces]]
binding = "STATE"
id = "2285977f426647cf9e3db347cbc0f03b"

[[env.production.ratelimits]]
name = "RATE_LIMIT_ANON"  # signed-out requests
namespace_id = "3001"
simple = { limit = 60, period = 60 }

[[env.production.ratelimits]]
name = "RATE_LIMIT_AUTH"  # signed-in users and agents
namespace_id = "3002"
simple = { limit = 1000, period = 60 }

[[env.production.ratelimits]]
name = "RATE_LIMIT_ANALYTICS"  # analytics ingest
namespace_id = "3003"
simple = { limit = 600, period = 60 }

[[env.production.ratelimits]]
name = "RATE_LIMIT_STRICT"  # routes that pass requestsPerMinute: 20 (POST /projects)
namespace_id = "3004"
simple = { limit = 20, period = 60 }

[[env.production.d1_databases]]
binding = "DB"
database_name = "stratum"
database_id = "de9b583b-d5f3-4868-a1eb-2208b76c7062"
migrations_dir = "migrations"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "stratum_requests"

[[env.production.r2_buckets]]
binding = "BACKUPS"
bucket_name = "stratum-backups"

[env.production.ai]
binding = "AI"

[[env.production.durable_objects.bindings]]
name = "MERGE_QUEUE"
class_name = "MergeQueue"
script_name = "stratum"

[[env.production.durable_objects.bindings]]
name = "REPO_DO"
class_name = "RepoDO"
script_name = "stratum"

[[env.production.durable_objects.bindings]]
name = "MAGIC_LINK_LIMITER"
class_name = "MagicLinkRateLimiter"
script_name = "stratum"

[[env.production.durable_objects.bindings]]
name = "USAGE_METER"
class_name = "UsageMeter"
script_name = "stratum"

[[env.production.queues.producers]]
binding = "EVENTS_QUEUE"
queue = "stratum-events"

[[env.production.queues.producers]]
binding = "IMPORT_QUEUE"
queue = "stratum-imports"

[[env.production.queues.producers]]
binding = "DEPLOY_QUEUE"
queue = "stratum-deploys"

[[env.production.queues.producers]]
binding = "EVALUATION_QUEUE"
queue = "stratum-evaluations"

[[env.production.queues.producers]]
binding = "MIRROR_QUEUE"
queue = "stratum-mirrors"

[[env.production.queues.consumers]]
queue = "stratum-events"

[[env.production.queues.consumers]]
queue = "stratum-imports"
max_batch_size = 1
max_retries = 3
retry_delay = 30

# See the top-level stratum-deploys consumer for why each knob is set:
# visibility_timeout_ms is tied to the bounds in `src/deploy/limits.ts`, and
# max_concurrency = 1 is the isolate-memory bound (MAX_DEPLOY_CONCURRENCY).
[[env.production.queues.consumers]]
queue = "stratum-deploys"
max_batch_size = 1
max_concurrency = 1
max_retries = 2
retry_delay = 60
visibility_timeout_ms = 900000  # 15 min; see src/deploy/limits.ts
dead_letter_queue = "stratum-deploys-dlq"

# See the top-level stratum-evaluations consumer for the knobs.
[[env.production.queues.consumers]]
queue = "stratum-evaluations"
max_batch_size = 1
max_retries = 2
retry_delay = 30
dead_letter_queue = "stratum-evaluations-dlq"

# See the top-level stratum-mirrors consumer for the knobs.
[[env.production.queues.consumers]]
queue = "stratum-mirrors"
max_batch_size = 1
max_concurrency = 1
max_retries = 6
retry_delay = 60

[env.production.triggers]
crons = ["0 4 * * *", "0 6 * * *", "*/5 * * * *"]

[[env.production.send_email]]
name = "EMAIL"

[env.production.vars]
# Browser analytics: PostHog's project token (`phc_…`), loaded in users' browsers.
# A plain var, NOT a secret — it ships in every page of HTML, and calling it a
# secret is how a personal API key (`phx_…`) ends up published. Deliberately
# separate from POSTHOG_API_KEY: enabling server-side telemetry must never
# silently start running third-party JS in your users' browsers. Unset = no
# analytics script is served to anyone.
# POSTHOG_PUBLIC_KEY = "phc_..."
POSTHOG_HOST = "https://app.posthog.com"
# Segments this environment's analytics (see top-level [vars]). Declared per-env
# because named envs don't inherit top-level vars — the same footgun as the
# telemetry kill switch below.
STRATUM_ENVIRONMENT = "production"
# Telemetry kill switch. Must be declared here, not only at top level — named
# envs don't inherit top-level vars, so a top-level-only setting never reaches
# `wrangler deploy --env=production`.
# STRATUM_TELEMETRY_DISABLED = "true"
# Telemetry is opt-in for new accounts on the hosted instance (#257): signup
# asks, and an unticked box means opted out. See the top-level [vars] comment.
TELEMETRY_CONSENT_AT_SIGNUP = "true"
# The /dev-login session backdoor is local-only. Declare it "false" explicitly
# here (named envs don't inherit the top-level "true") so the route is provably
# inert in production — and so wrangler stops warning about the missing override.
DEV_LOGIN_ENABLED = "false"
# RepoDO fast-forward path (ADR 004); default off until staging numbers justify it.
# To enable in prod you MUST also add a [[env.production.r2_buckets]] REPO_OBJECTS
# binding (staging has one) — without it the fast path throws "REPO_OBJECTS not
# bound" at merge time and workspace staging silently no-ops. The config-guard
# middleware logs an error if this is set "true" with no bucket bound.
REPO_DO_ENABLED = "false"
# Gated git push (ADR 005 slice 2b) — off until validated on staging; pushes to
# a project URL keep getting the in-protocol refusal pointing at workspaces.
GIT_PUSH_GATED_ENABLED = "false"
# Production OAuth callbacks. The matching callback URLs must also be registered
# in the GitHub and Google OAuth app settings.
OAUTH_REDIRECT_URI = "https://app.usestratum.dev/auth/github/callback"
GOOGLE_REDIRECT_URI = "https://app.usestratum.dev/auth/google/callback"
# The From address every outbound email needs. Declared here and not only at top
# level for the usual reason (named envs inherit no vars) — and it is REQUIRED,
# not optional: every send path returns early without it, so production would
# otherwise ship the usage-threshold notice and the magic-link mail as features
# that silently never send, in the one environment that has limits at all.
EMAIL_FROM_ADDRESS = "noreply@app.usestratum.dev"
# Open signup — the closed-beta invite gate is OFF in production ("available
# today" is the positioning; Origin launched to every paid Cursor plan).
# To re-enable the invite wall set BETA_GATE = "1"; the gate fails closed and
# needs REFERRAL_SERVICE_URL live (referral.usestratum.dev -> stratum-landing
# Worker; *.workers.dev subrequests are intermittently 404'd by the edge, hence
# the custom domain). REFERRAL_SERVICE_SECRET is set out-of-band via
# `wrangler secret put` and must match the stratum-landing Worker. Staging keeps
# the gate ON so the invite path stays exercised end-to-end.
BETA_GATE = "0"
REFERRAL_SERVICE_URL = "https://referral.usestratum.dev"
# Usage metering / entitlements / BYOK. Declared here as well as at top level
# because named envs inherit no vars; see the top-level [vars] block for what
# each one does. BILLING_SERVICE_SECRET is a secret and is set out-of-band with
# `wrangler secret put BILLING_SERVICE_SECRET --env production` — secrets are
# per-environment too, so a top-level one never reaches this deploy.
# BILLING_SERVICE_URL = "https://<the cloud billing service host>"
# Observe-only: the limits are measured for a period before they gate anything
# (PRD Goal 3 — metering is always on, enforcement is a separate switch).
ENTITLEMENTS_ENFORCE = "0"
# Operator-configured LLM provider allowlist; unset = Workers AI only, which is
# what production runs on today. A project opts in by naming one of these in its
# policy and storing its own key in that project's secrets. See the top-level
# [vars] block for the validation rules and the DEPLOY_SECRET_KEY coupling.
# LLM_PROVIDERS = '[{"name":"anthropic","kind":"anthropic","baseUrl":"https://api.anthropic.com/v1"}]'

# =============================================================================
# [env.staging]
# Deploy with: wrangler deploy --env staging
# =============================================================================
[env.staging]
name = "stratum-staging"
# Keep *.workers.dev enabled alongside the custom domain (the smoke tests use it).
workers_dev = true

# Staging custom domain (matches the staging OAuth callback host below).
routes = [
  { pattern = "staging.app.usestratum.dev", custom_domain = true }
]

# Observability for staging - full sampling for debugging
[env.staging.observability]
enabled = true
head_sampling_rate = 1.0

[env.staging.observability.traces]
enabled = true
head_sampling_rate = 1.0  # 100% sampling in staging for debugging

[[env.staging.artifacts]]
binding = "ARTIFACTS"
namespace = "stratum-staging"

[[env.staging.kv_namespaces]]
binding = "STATE"
id = "18a609aeddac442087de919a12677856"

[[env.staging.ratelimits]]
name = "RATE_LIMIT_ANON"  # signed-out requests
namespace_id = "3011"
simple = { limit = 60, period = 60 }

[[env.staging.ratelimits]]
name = "RATE_LIMIT_AUTH"  # signed-in users and agents
namespace_id = "3012"
simple = { limit = 1000, period = 60 }

[[env.staging.ratelimits]]
name = "RATE_LIMIT_ANALYTICS"  # analytics ingest
namespace_id = "3013"
simple = { limit = 600, period = 60 }

[[env.staging.ratelimits]]
name = "RATE_LIMIT_STRICT"  # routes that pass requestsPerMinute: 20 (POST /projects)
namespace_id = "3014"
simple = { limit = 20, period = 60 }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "stratum-staging"
database_id = "85c63ac2-381e-4cd9-9c35-e89dad02df65"
migrations_dir = "migrations"

[[env.staging.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "stratum_requests"

[[env.staging.r2_buckets]]
binding = "BACKUPS"
bucket_name = "stratum-backups-staging"

[env.staging.ai]
binding = "AI"

[[env.staging.durable_objects.bindings]]
name = "MERGE_QUEUE"
class_name = "MergeQueue"
script_name = "stratum-staging"

[[env.staging.durable_objects.bindings]]
name = "REPO_DO"
class_name = "RepoDO"
script_name = "stratum-staging"

[[env.staging.durable_objects.bindings]]
name = "MAGIC_LINK_LIMITER"
class_name = "MagicLinkRateLimiter"
script_name = "stratum-staging"

[[env.staging.durable_objects.bindings]]
name = "USAGE_METER"
class_name = "UsageMeter"
script_name = "stratum-staging"

# Needs the `staged-sha/` lifecycle rule (docs/runbooks/staged-tree-retention.md),
# or staged-tree copies for unmerged commits are never reclaimed (#262).
[[env.staging.r2_buckets]]
binding = "REPO_OBJECTS"
bucket_name = "stratum-repo-objects-staging"

# Staging gets its own queues: queue names are account-level, so sharing
# "stratum-events"/"stratum-imports" with production delivered every staging
# message to the PRODUCTION consumer, whose D1 has no matching outbox row —
# each one was dropped ("Event row missing for queue message") and staging's
# 5-minute sweep cron re-enqueued it until its attempt budget ran out. The
# -staging suffix keeps each environment's producer/consumer pair on its own
# database. The CI staging deploy creates these queues idempotently.
[[env.staging.queues.producers]]
binding = "EVENTS_QUEUE"
queue = "stratum-events-staging"

[[env.staging.queues.producers]]
binding = "IMPORT_QUEUE"
queue = "stratum-imports-staging"

[[env.staging.queues.producers]]
binding = "DEPLOY_QUEUE"
queue = "stratum-deploys-staging"

[[env.staging.queues.producers]]
binding = "EVALUATION_QUEUE"
queue = "stratum-evaluations-staging"

[[env.staging.queues.producers]]
binding = "MIRROR_QUEUE"
queue = "stratum-mirrors-staging"

[[env.staging.queues.consumers]]
queue = "stratum-events-staging"

[[env.staging.queues.consumers]]
queue = "stratum-imports-staging"
max_batch_size = 1
max_retries = 3
retry_delay = 30

# Suffixed like the queues above, and for the same reason: a shared
# "stratum-deploys" would hand staging's deploy messages to the production
# consumer, whose D1 has no matching deployments row. Its DLQ is suffixed too.
# See the top-level consumer for the knobs; visibility_timeout_ms is tied to
# the bounds in `src/deploy/limits.ts`, and max_concurrency = 1 is the
# isolate-memory bound (MAX_DEPLOY_CONCURRENCY).
[[env.staging.queues.consumers]]
queue = "stratum-deploys-staging"
max_batch_size = 1
max_concurrency = 1
max_retries = 2
retry_delay = 60
visibility_timeout_ms = 900000  # 15 min; see src/deploy/limits.ts
dead_letter_queue = "stratum-deploys-dlq-staging"

# Suffixed for the same reason as every staging queue above. See the top-level
# stratum-evaluations consumer for the knobs.
[[env.staging.queues.consumers]]
queue = "stratum-evaluations-staging"
max_batch_size = 1
max_retries = 2
retry_delay = 30
dead_letter_queue = "stratum-evaluations-dlq-staging"

# Suffixed for the same reason as every staging queue above. See the top-level
# stratum-mirrors consumer for the knobs.
[[env.staging.queues.consumers]]
queue = "stratum-mirrors-staging"
max_batch_size = 1
max_concurrency = 1
max_retries = 6
retry_delay = 60

[[env.staging.send_email]]
name = "EMAIL"

[env.staging.vars]
# Browser analytics: PostHog's project token (`phc_…`), loaded in users' browsers.
# A plain var, NOT a secret — it ships in every page of HTML, and calling it a
# secret is how a personal API key (`phx_…`) ends up published. Deliberately
# separate from POSTHOG_API_KEY: enabling server-side telemetry must never
# silently start running third-party JS in your users' browsers. Unset = no
# analytics script is served to anyone.
# POSTHOG_PUBLIC_KEY = "phc_..."
POSTHOG_HOST = "https://app.posthog.com"
# Segments this environment's analytics (see top-level [vars]). Declared per-env
# because named envs don't inherit top-level vars — the same footgun as the
# telemetry kill switch below.
STRATUM_ENVIRONMENT = "staging"
# Telemetry kill switch; must be declared per-env (see env.production.vars).
# STRATUM_TELEMETRY_DISABLED = "true"
# Opt-in telemetry for new accounts, as in production (#257).
TELEMETRY_CONSENT_AT_SIGNUP = "true"
# Local-only session backdoor; explicitly off on staging (see env.production.vars).
DEV_LOGIN_ENABLED = "false"
# RepoDO + R2 merge path (ADR 004). "true" on staging: workspace commits stage to
# R2 and merges route through the fetch-free R2 path (cold path as fallback).
REPO_DO_ENABLED = "true"
# Gated git push (ADR 005 slice 2b): a push to a project's default branch lands
# on a server-managed workspace and opens an eval-gated change. Staging-first;
# flip production once validated end-to-end against real Artifacts.
GIT_PUSH_GATED_ENABLED = "true"
OAUTH_REDIRECT_URI = "https://staging.app.usestratum.dev/auth/github/callback"
GOOGLE_REDIRECT_URI = "https://staging.app.usestratum.dev/auth/google/callback"
EMAIL_FROM_ADDRESS = "noreply@staging.app.usestratum.dev"
# Closed beta — validate the invite gate on staging before prod. Points at the
# live stratum-landing Worker (see [env.production.vars] cutover note).
BETA_GATE = "1"
REFERRAL_SERVICE_URL = "https://referral.usestratum.dev"
# Usage metering / entitlements / BYOK; declared per env (see [env.production.vars]
# and the top-level [vars] block). BILLING_SERVICE_SECRET is set with
# `wrangler secret put BILLING_SERVICE_SECRET --env staging`.
# BILLING_SERVICE_URL = "https://<the cloud billing service host>"
# Staging is where enforcement gets validated first, as with every other flag
# here — but only once the billing service is live and a period of observation
# has produced real numbers. Off until then.
ENTITLEMENTS_ENFORCE = "0"
# Operator-configured LLM provider allowlist; unset = Workers AI only. Staging is
# where a new provider entry gets exercised end-to-end before production, since a
# bad one is only visible as blocked merges on the projects selecting it.
# LLM_PROVIDERS = '[{"name":"anthropic","kind":"anthropic","baseUrl":"https://api.anthropic.com/v1"}]'
